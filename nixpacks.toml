# Railway continua no Node 20 (o backend foi testado nele). O package.json da raiz
# pede 24.x porque a Vercel descontinuou o Node 20 em 10/2026; esta variavel tem
# prioridade sobre o "engines" para o Nixpacks.
[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.build]
cmds = [
  "cd backend && NODE_ENV=development pnpm install --frozen-lockfile",
  "cd backend && pnpm run build"
]
