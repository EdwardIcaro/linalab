<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1e3f">
<title>Checklist de entrada</title>
<!-- Checklist da Localiza para o responsável (17/11/2026) — página pública, link /c/CÓDIGO.
     Protótipo aprovado: Features/front/checklist-responsavel-localiza.html. Dados: GET /api/c/:token -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17152b; --lina:#0066cc; --cream:#f4ecd8; --paper:#fbf6ea; --space:#1b1e3f;
    --blue:#2f62e6; --green:#22a15a; --red:#e5383b; --pink:#ff8fc8; --yellow:#ffd23f; --muted:#6b6780; --loc:#0b7a3b;
    --dela:'Dela Gothic One','Arial Black',Impact,sans-serif;
    --mono:'Space Mono',ui-monospace,monospace;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;background:var(--space)}
  body{color:var(--cream);font:400 14px/1.5 var(--mono);-webkit-font-smoothing:antialiased;min-height:100vh}
  button{font:inherit;cursor:pointer}
  [hidden]{display:none!important}
  .pg{max-width:560px;margin:0 auto;display:grid;gap:16px;align-content:start;
      padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .pg-head{display:flex;align-items:center;gap:10px}
  .pg-logo{width:40px;height:40px;border-radius:10px;background:var(--yellow);border:3px solid var(--ink);display:grid;place-items:center;font:400 18px var(--dela);color:var(--ink);box-shadow:3px 3px 0 var(--pink);flex:none}
  .pg-head b{display:block;font:400 16px/1.1 var(--dela)}
  .pg-head small{font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
  .pg-tit{font:400 24px/1.25 var(--dela);text-shadow:3px 3px 0 var(--lina);text-wrap:balance;margin:0}
  .pg-tit .placa{vertical-align:middle;margin-right:6px}
  .placa{display:inline-block;background:#fff;color:var(--ink);border:2.5px solid var(--loc);border-radius:6px;overflow:hidden;text-align:center;min-width:96px;box-shadow:2px 2px 0 var(--loc);text-shadow:none}
  .placa::before{content:"LOCALIZA";display:block;background:var(--loc);color:#fff;font:700 7px/1 var(--mono);letter-spacing:.2em;padding:2px 0}
  .placa b{display:block;font:700 16px/1 var(--mono);letter-spacing:.08em;padding:4px 6px 5px}
  .rot{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;display:flex;gap:12px;align-items:center}
  .rot::after{content:"";flex:1;border-top:2px dashed #f4ecd855}
  .cartao{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--sc,var(--pink));padding:12px 14px;min-width:0}
  .carimbo{display:flex;gap:10px;align-items:center}
  .ic{width:36px;height:36px;border-radius:10px;border:2.5px solid var(--ink);display:grid;place-items:center;flex:none;font-size:16px;background:var(--yellow)}
  .carimbo b{display:block;font:400 15px/1.2 var(--dela)}
  .carimbo span{font-size:12px;color:var(--muted)}
  .resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .resumo div{border:2.5px solid var(--ink);border-radius:10px;padding:8px 4px;text-align:center;font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.06em}
  .resumo b{display:block;font:400 22px/1.1 var(--dela);letter-spacing:0}
  .r-av{background:#ffd0cc}.r-ok{background:#c9efd5}.r-ft{background:var(--paper)}
  .fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .foto{aspect-ratio:1;border:2.5px solid var(--ink);border-radius:10px;background:#cbd5e1 center/cover;position:relative;padding:0;cursor:zoom-in;overflow:hidden;box-shadow:2px 2px 0 var(--ink)}
  .foto span{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:var(--cream);font:700 9px var(--mono);letter-spacing:.04em;padding:2px 4px;text-align:left;text-transform:uppercase}
  .item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:2px dashed #17152b26;align-items:start}
  .item:last-child{border:none}
  .item .st{font:700 9px/1.4 var(--mono);letter-spacing:.06em;padding:2px 7px;border-radius:999px;border:2px solid var(--ink);margin-top:2px;font-style:normal;white-space:nowrap;justify-self:start}
  .item .st.ok{background:#c9efd5}.item .st.av{background:var(--red);color:var(--cream)}.item .st.nc{background:var(--paper);color:var(--muted)}
  .item div{min-width:0}
  .item b{display:block;font:400 13px/1.25 var(--dela)}
  .item div span{display:block;font-size:12px;color:var(--muted)}
  .grade{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .grade b{display:block;color:var(--ink);font:400 13px/1.2 var(--dela);letter-spacing:0;text-transform:none;margin-top:2px;overflow-wrap:anywhere}
  .rodape{text-align:center;font:700 10px var(--mono);color:#f4ecd8aa;padding:4px 0}
  .sticker{display:inline-block;background:var(--lina);color:var(--cream);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--pink);border-radius:8px;padding:0 7px 2px;font:400 11px var(--dela);transform:rotate(-4deg);margin-left:4px}
  .lightbox{position:fixed;inset:0;background:#0e0f24ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;z-index:5;font:700 11px var(--mono);cursor:zoom-out}
  .lightbox img{max-width:100%;max-height:78vh;border:3px solid var(--cream);border-radius:12px}
  .vazio{text-align:center;padding:80px 20px;display:grid;gap:10px;justify-items:center}
  .vazio b{font:400 20px var(--dela)}
  .vazio p{margin:0;opacity:.8;font-size:13px}
  .spin{width:30px;height:30px;border:3px solid var(--cream);border-top-color:transparent;border-radius:50%;animation:g .7s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main class="pg" id="app"><div class="vazio"><div class="spin"></div></div></main>
<div class="lightbox" id="lb" hidden><img id="lbImg" alt=""><span id="lbTxt"></span><span style="opacity:.7">toque para fechar</span></div>

<script>
(function () {
  const app = document.getElementById('app');
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const token = (location.pathname.split('/').filter(Boolean).pop() || '').toUpperCase();
  const dataHora = (iso) => { const d = new Date(iso); return `${d.toLocaleDateString('pt-BR')} às ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`; };
  const curta = (iso) => { const d = new Date(iso); return `${d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })} às ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`; };
  const fotoUrl = (id) => `/api/c/${encodeURIComponent(token)}/foto/${encodeURIComponent(id)}`;

  function vazio(titulo, texto) {
    app.innerHTML = `<div class="vazio"><b>${esc(titulo)}</b><p>${esc(texto)}</p></div>`;
  }

  function desenhar(d) {
    const av = d.itens.filter((i) => i.st === 'av').length;
    const ok = d.itens.filter((i) => i.st === 'ok').length;
    const veic = [d.modelo, d.cor].filter(Boolean).join(' · ');
    document.title = `Checklist ${d.placa} · ${d.empresa}`;
    app.innerHTML = `
      <div class="pg-head"><div class="pg-logo">${esc((d.empresa || '?')[0].toUpperCase())}</div>
        <div><b>${esc(d.empresa)}</b><small>Checklist de entrada · Localiza</small></div></div>
      <h1 class="pg-tit"><span class="placa"><b>${esc(d.placa)}</b></span> ${esc(veic)}</h1>
      <div class="cartao" style="--sc:var(--blue)">
        <div class="carimbo"><div class="ic">🕑</div><div><b>${esc(dataHora(d.checklistEm))}</b>
          <span>Checklist feito${d.checklistPor ? ' por ' + esc(d.checklistPor) : ''} na ${esc(d.empresa)}${d.editadoEm ? ` · editado em ${esc(curta(d.editadoEm))}` : ''}</span></div></div>
        <div class="resumo"><div class="r-av"><b>${av}</b>avaria${av === 1 ? '' : 's'}</div><div class="r-ok"><b>${ok}</b>itens ok</div><div class="r-ft"><b>${d.fotos.length}</b>foto${d.fotos.length === 1 ? '' : 's'}</div></div>
      </div>
      ${d.fotos.length ? `<div class="rot">Fotos</div>
      <div class="cartao" style="--sc:var(--yellow)"><div class="fotos">${d.fotos.map((f) => `<button class="foto" type="button" style="background-image:url('${fotoUrl(f.id)}')" data-f="${esc(f.id)}" data-l="${esc(f.lado || 'Foto')}" data-em="${esc(f.em)}" aria-label="Abrir foto ${esc(f.lado || '')}"><span>${esc(f.lado || 'Foto')}</span></button>`).join('')}</div></div>` : ''}
      <div class="rot">Itens conferidos</div>
      <div class="cartao" style="--sc:var(--pink)">${d.itens.map((i) => `<div class="item"><em class="st ${i.st}">${i.st === 'av' ? 'AVARIA' : i.st === 'ok' ? 'OK' : 'NÃO CONFERIDO'}</em><div><b>${esc(i.rotulo)}</b>${i.obs ? `<span>${esc(i.obs)}</span>` : ''}</div></div>`).join('')}</div>
      <div class="rot">Solicitação</div>
      <div class="cartao" style="--sc:var(--loc)"><div class="grade">
        <div>Número<b>${esc(d.numero)}</b></div><div>Agência<b>${esc(d.agencia || '—')}</b></div>
        <div>Solicitado por<b>${esc(d.solicitante || '—')}</b></div><div>Chegou em<b>${esc(curta(d.abertaEm))}</b></div>
        <div>Aceita por<b>${esc(d.aceitaPor || '—')}</b></div><div>Aceita em<b>${d.aceitaEm ? esc(curta(d.aceitaEm)) : '—'}</b></div>
      </div></div>
      <div class="rodape">Registro só de leitura · feito com <span class="sticker">Lina Wash</span></div>`;

    const lb = document.getElementById('lb');
    app.querySelectorAll('[data-f]').forEach((b) => {
      b.onclick = () => {
        document.getElementById('lbImg').src = fotoUrl(b.dataset.f);
        document.getElementById('lbTxt').textContent = `${b.dataset.l} · ${curta(b.dataset.em)}`;
        lb.hidden = false;
      };
    });
    lb.onclick = () => { lb.hidden = true; };
  }

  if (!/^[A-Z2-9]{10}$/.test(token)) return vazio('Link inválido', 'Confira se o link chegou completo.');
  fetch(`/api/c/${encodeURIComponent(token)}`, { cache: 'no-store' })
    .then(async (r) => {
      const j = await r.json().catch(() => ({}));
      if (r.status === 410) return vazio('Checklist expirado', j.error || 'Este checklist não está mais disponível.');
      if (!r.ok) return vazio('Checklist não encontrado', j.error || 'Confira se o link chegou completo.');
      desenhar(j);
    })
    .catch(() => vazio('Sem conexão', 'Não foi possível carregar agora. Tente de novo em instantes.'));
})();
</script>
</body>
</html>
