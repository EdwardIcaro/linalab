<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lina Totem</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: 'Inter', -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: #14b8a6;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg) } }
    .msg { font-size: 14px; color: rgba(255,255,255,.6); max-width: 320px; }
  </style>
</head>
<body>
  <div>
    <div class="spinner" id="spinner"></div>
    <div class="msg" id="msg">Abrindo...</div>
  </div>
  <script>
    const token = localStorage.getItem('totem_device_token');
    if (token) {
      window.location.replace('/totem?t=' + token);
    } else {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('msg').textContent =
        'Este aparelho ainda não foi pareado. Peça ao administrador o link de pareamento do totem.';
    }
  </script>
</body>
</html>
