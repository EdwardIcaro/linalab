<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b1e3f">
  <title>Serviços — Lina X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/funcionario/decola-base.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <style>
    /* Visual Decola (aprovado em 04/11/2026). Backup do visual antigo: tag git design-classico-2026-11-05 */
    :root { --light: var(--muted); --roxo: #7a3fd0; }
    .pagina { max-width: 860px; padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: 120px; }
    .topo { display: flex; align-items: center; gap: 10px; }
    .topo-tit { flex: 1; min-width: 0; }
    .topo-tit h1 { margin: 0; font: 400 clamp(24px, 6vw, 34px)/1 var(--dela); text-shadow: 3px 3px 0 var(--lina); }
    .topo-tit p { margin: 4px 0 0; font-size: 11px; opacity: .8; }
    .btn-novo { padding: 8px 12px; font-size: 13px; background: var(--yellow); box-shadow: 3px 3px 0 var(--pink); }
    .abas { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; display: flex; gap: 8px; overflow-x: auto; margin: 10px calc(var(--gutter) * -1) 0; padding: 12px var(--gutter);
      background: linear-gradient(var(--space) 78%, transparent); scrollbar-width: none; }
    .tab-btn { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 7px; border: 2.5px solid var(--cream); border-radius: 999px; background: none;
      color: var(--cream); font: 700 12px var(--mono); cursor: pointer; white-space: nowrap; }
    .tab-btn b { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--cream); color: var(--ink); display: grid; place-items: center; font: 400 11px/1 var(--dela); }
    .tab-btn.active { background: var(--cream); color: var(--ink); border-color: var(--ink); box-shadow: 3px 3px 0 var(--pink); }
    .tab-btn.active b { background: var(--ink); color: var(--yellow); }
    .tab-btn .ico { width: 22px; text-align: center; }

    .grupo-tit { display: flex; align-items: center; gap: 10px; margin: 8px 0 10px; font: 400 15px var(--dela); }
    .grupo-tit i { width: 30px; height: 30px; border-radius: 9px; border: 2.5px solid var(--ink); background: var(--c); color: var(--cream); display: grid; place-items: center; font-size: 13px; flex: none; }
    .grupo-tit::after { content: ""; flex: 1; border-top: 2px dashed var(--cream); opacity: .4; }
    .grupo-tit small { font: 700 11px var(--mono); opacity: .7; }
    .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    @media (min-width: 720px) { .grade { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .svc { cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; --sc: var(--c); min-height: 120px; }
    .svc b { font: 400 14px/1.15 var(--dela); overflow-wrap: anywhere; }
    .svc .preco { font: 400 20px/1 var(--dela); margin-top: auto; white-space: nowrap; }
    .svc .preco small { font-size: .55em; margin-right: 2px; }
    .etqs { display: flex; flex-wrap: wrap; gap: 4px; }
    .etq { padding: 0 6px; border-radius: 5px; border: 1.5px solid var(--ink); background: var(--paper); font: 700 9px/1.6 var(--mono); letter-spacing: .04em; text-transform: uppercase; }
    .etq.com { background: var(--yellow); }
    .etq.todas { border-style: dashed; }
    .lista-ad { display: grid; gap: 10px; }
    .linha-ad { display: flex; align-items: center; gap: 12px; cursor: pointer; --sc: var(--pink); }
    .linha-ad .ic { width: 38px; height: 38px; border-radius: 11px; border: 2.5px solid var(--ink); background: var(--pink); display: grid; place-items: center; flex: none; }
    .linha-ad .t { flex: 1; min-width: 0; }
    .linha-ad .t b { display: block; font: 400 14px var(--dela); }
    .linha-ad .t span { display: block; font-size: 11px; color: var(--muted); }
    .linha-ad .v { font: 400 16px var(--dela); white-space: nowrap; }
    .dica { font-size: 11px; opacity: .85; margin: 0 0 12px; }

    /* categorias: arrastar e ligar/desligar */
    .cat-config { background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--blue); padding: 6px 12px; }
    .cat-config-hint { display: flex; gap: 8px; padding: 6px 0 10px; font-size: 11px; color: var(--muted); border-bottom: 2px dashed var(--line); }
    .cat-item { display: flex; align-items: center; gap: 12px; padding: 9px 0; background: var(--cream); }
    .cat-item + .cat-item { border-top: 2px dashed var(--line); }
    .cat-item.inativo { opacity: .45; }
    .cat-drag { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--ink); background: #9fc1ff; display: grid; place-items: center; font-size: 14px; flex: none; cursor: grab; }
    .cat-name { flex: 1; font: 400 14px var(--dela); }
    .cat-name small { display: block; font: 700 9px var(--mono); color: var(--muted); letter-spacing: .06em; }
    .cat-toggle { width: 40px; height: 22px; border-radius: 999px; border: 2px solid var(--ink); background: var(--paper); position: relative; cursor: pointer; flex: none; }
    .cat-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
    .cat-toggle.on { background: var(--green); }
    .cat-toggle.on::after { transform: translateX(18px); background: var(--cream); }
    .sortable-ghost { opacity: .4; }
    .cat-save-bar { margin-top: 14px; }
    .cat-save-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 3px solid var(--ink); border-radius: 12px;
      background: var(--green); color: var(--cream); font: 400 15px var(--dela); box-shadow: 4px 4px 0 var(--ink); cursor: pointer; }
    .state-box { text-align: center; padding: 26px 16px; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--yellow); display: grid; gap: 6px; justify-items: center; }
    .state-icon { font-size: 26px; }
    .state-title { font: 400 17px var(--dela); }
    .state-sub { font-size: 12px; color: var(--muted); }
    .btn-state { margin-top: 6px; padding: 8px 14px; border: 3px solid var(--ink); border-radius: 12px; background: var(--yellow); color: var(--ink); font: 400 14px var(--dela); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
    .spin { width: 30px; height: 30px; border: 3px solid var(--ink); border-top-color: transparent; border-radius: 50%; animation: girar .7s linear infinite; }

    /* janela de baixo com o formulário */
    .drawer-overlay { position: fixed; inset: 0; z-index: 800; background: #0e0f24bb; opacity: 0; pointer-events: none; transition: opacity .25s; }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; z-index: 810; left: 0; right: 0; bottom: 0; margin: 0 auto; width: 100%; max-width: 560px; max-height: 90vh; display: flex; flex-direction: column;
      background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-bottom: 0; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 0 var(--yellow);
      transform: translateY(105%); transition: transform .45s cubic-bezier(.2, .9, .3, 1.1); }
    .drawer.open { transform: none; }
    .drawer-handle { width: 44px; height: 5px; background: var(--ink); opacity: .25; border-radius: 3px; margin: 10px auto 0; flex: none; }
    .drawer-header { display: flex; align-items: center; gap: 10px; padding: 8px 14px 12px; border-bottom: 3px solid var(--ink); flex: none; }
    .drawer-title { flex: 1; min-width: 0; font: 400 17px/1.1 var(--dela); }
    .drawer-close { width: 34px; height: 34px; border-radius: 10px; border: 2.5px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; font-size: 15px; flex: none; }
    .drawer-body { padding: 14px; overflow: auto; display: grid; gap: 12px; align-content: start; }
    .drawer-footer { display: flex; gap: 10px; padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 3px solid var(--ink); flex: none; }
    .drawer-footer .btn-f-save { flex: 1; }
    .form-group { display: grid; gap: 4px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-label { font: 700 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .form-input, .form-select { width: 100%; min-width: 0; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--paper); color: var(--ink); padding: 9px 11px; font: 700 14px var(--mono); outline: none; }
    textarea.form-input { font-weight: 400; font-size: 13px; }
    .form-input:focus, .form-select:focus { box-shadow: 3px 3px 0 var(--blue); }
    .form-hint { font-size: 10px; color: var(--muted); }
    .cat-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .cat-chip { padding: 5px 11px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); font: 700 12px var(--mono); cursor: pointer; user-select: none; }
    .cat-chip input { display: none; }
    .cat-chip.checked { background: var(--ink); color: var(--yellow); }
    .cat-chip.checked::before { content: "✓ "; }
    .btn-f { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 3px solid var(--ink); border-radius: 12px; padding: 10px 14px;
      font: 400 14px/1.1 var(--dela); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; background: var(--paper); color: var(--ink); }
    .btn-f:disabled { opacity: .5; cursor: not-allowed; }
    .btn-f-save { background: var(--green); color: var(--cream); }
    .btn-f-danger { color: #c1361a; }
    .toast-container { position: fixed; z-index: 5000; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: center; width: max-content; max-width: 90vw; }
    .toast-container .toast { position: static; transform: none; opacity: 1; pointer-events: auto; }
    .toast-container .toast.info { background: var(--yellow); }
  </style>
</head>
<body>
<div id="ceu" aria-hidden="true"></div>
<div id="grao" aria-hidden="true"></div>

<div class="pagina">
  <header class="topo">
    <a class="ico-btn" href="/funcionario/index.html" title="Início"><i class="fas fa-home"></i></a>
    <div class="topo-tit"><h1>Serviços</h1><p id="hd-count">Carregando...</p></div>
    <button class="btn btn-novo" id="btnNovo" onclick="abrirNovo()"><i class="fas fa-plus"></i> Novo</button>
  </header>

  <nav class="abas">
    <button class="tab-btn active" id="tabServicos" onclick="setTab('servicos')"><b id="countServicos">—</b>Serviços</button>
    <button class="tab-btn" id="tabAdicionais" onclick="setTab('adicionais')"><b id="countAdicionais">—</b>Adicionais</button>
    <button class="tab-btn" id="tabCategorias" onclick="setTab('categorias')"><i class="fas fa-layer-group ico"></i>Categorias</button>
  </nav>

  <div id="listBody"><div class="state-box"><div class="spin"></div></div></div>
</div>

<nav id="bottomNav"></nav>
<div class="toast-container" id="toastContainer"></div>

<div class="drawer-overlay" id="drawerOverlay" onclick="fecharDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <span class="drawer-title" id="drawerTitle">—</span>
    <button class="drawer-close" onclick="fecharDrawer()"><i class="fas fa-times"></i></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer" id="drawerFooter"></div>
</div>

  <script src="../api.js"></script>
  <script src="utils.js"></script>
  <script>
    const PAGE_TITLE  = 'Serviços';
    const PAGE_ACTIVE = 'servicos';

    let tabAtiva   = 'servicos';
    let servicos   = [];
    let adicionais = [];
    let categorias = [];       // subtipos de CARRO (TipoVeiculo com categoria)
    let catSortable = null;    // instância do SortableJS
    let editandoId = null;

    const CATS_CARRO = ['HATCH','SEDAN','SUV','PICKUP','CAMINHONETE','VAN','MICROONIBUS','CAMINHAO'];
    const LABELS_CAT = {
      HATCH:'Hatch', SEDAN:'Sedan', SUV:'SUV', PICKUP:'Pickup',
      CAMINHONETE:'Caminhonete', VAN:'Van', MICROONIBUS:'Micro-ônibus', CAMINHAO:'Caminhão'
    };

    // Itens avulsos: lista sugerida pelo sistema (o dono pode adicionar novos)
    const ITENS_AVULSOS_SUGERIDOS = ['TAPETE','CARPETE','BANCO','SOFA','ESTOFADO','CADEIRA'];
    const LABEL_ITEM_AVULSO = (k) => ({
      TAPETE:'Tapete', CARPETE:'Carpete', BANCO:'Banco', SOFA:'Sofá',
      ESTOFADO:'Estofado', CADEIRA:'Cadeira'
    }[k] || (k.charAt(0) + k.slice(1).toLowerCase()));
    let itensAvulsos = []; // itens já cadastrados no banco (categorias de AVULSO)

    // ── INIT ─────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      if (!validateFuncionarioAccess()) return;
      const perms = JSON.parse(localStorage.getItem('permissoes') || '[]');
      if (!perms.includes('config_ver_servicos')) {
        showToast('Sem permissão para gerenciar serviços', 'error');
        setTimeout(() => { window.location.href = '/funcionario/index.html'; }, 1500);
        return;
      }
      document.getElementById('bottomNav').innerHTML = createMobileNav(PAGE_ACTIVE);
      await carregar();
    });

    // ── CARREGAR ──────────────────────────────────
    async function carregar() {
      setLoading();
      try {
        const [rs, ra, rt] = await Promise.all([
          window.api.getServicos(),
          window.api.getAdicionais(),
          window.api.getTiposVeiculo()
        ]);
        servicos   = rs.servicos   || [];
        adicionais = ra.adicionais || [];
        // Categorias de carro (TipoVeiculo nome=CARRO com categoria)
        categorias = (rt || []).filter(t => t.nome === 'CARRO' && t.categoria);
        // Itens avulsos já cadastrados (TipoVeiculo nome=AVULSO com categoria)
        itensAvulsos = [...new Set((rt || []).filter(t => t.nome === 'AVULSO' && t.categoria).map(t => t.categoria))];
        document.getElementById('countServicos').textContent   = servicos.length;
        document.getElementById('countAdicionais').textContent = adicionais.length;
        atualizarCount();
        renderTab();
      } catch {
        document.getElementById('listBody').innerHTML = `
          <div class="state-box">
            <div class="state-icon">⚠️</div>
            <div class="state-title">Erro ao carregar</div>
            <div class="state-sub">Verifique a conexão e tente novamente.</div>
            <button class="btn-state" onclick="carregar()">Tentar novamente</button>
          </div>`;
      }
    }

    function setLoading() {
      document.getElementById('listBody').innerHTML = '<div class="state-box"><div class="spin"></div></div>';
    }

    function atualizarCount() {
      if (tabAtiva === 'categorias') {
        const total = categorias.length;
        document.getElementById('hd-count').textContent = `${total} categoria${total !== 1 ? 's' : ''}`;
        return;
      }
      const total = tabAtiva === 'servicos' ? servicos.length : adicionais.length;
      const nome  = tabAtiva === 'servicos' ? 'serviço' : 'adicional';
      document.getElementById('hd-count').textContent = `${total} ${nome}${total !== 1 ? 's' : ''}`;
    }

    // ── TAB ───────────────────────────────────────
    function setTab(tab) {
      tabAtiva = tab;
      document.getElementById('tabServicos').classList.toggle('active', tab === 'servicos');
      document.getElementById('tabAdicionais').classList.toggle('active', tab === 'adicionais');
      document.getElementById('tabCategorias').classList.toggle('active', tab === 'categorias');
      // Botão "Novo" não faz sentido na aba de categorias
      document.getElementById('btnNovo').style.display = tab === 'categorias' ? 'none' : '';
      atualizarCount();
      renderTab();
    }

    function renderTab() {
      if (tabAtiva === 'servicos') renderServicos();
      else if (tabAtiva === 'adicionais') renderAdicionais();
      else renderCategorias();
    }

    // ── RENDER CATEGORIAS (drag + toggle) ─────────
    const LABELS_CATEGORIA = {
      HATCH:'Hatch', SEDAN:'Sedan', SUV:'SUV', PICKUP:'Pickup', VAN:'Van',
      UTILI:'Utilitário', MONOVOLUME:'Monovolume', COUPE:'Cupê',
      CONVERSIVEL:'Conversível', MINIVAN:'Minivan', IMPORTADO:'Importado', ESPECIAL:'Especial'
    };

    function renderCategorias() {
      const body = document.getElementById('listBody');
      if (!categorias.length) {
        body.innerHTML = `
          <div class="state-box">
            <div class="state-icon">🚗</div>
            <div class="state-title">Nenhuma categoria</div>
            <div class="state-sub">As categorias de carro aparecem aqui conforme os serviços são cadastrados.</div>
          </div>`;
        return;
      }

      const rows = categorias.map(c => {
        const label = LABELS_CATEGORIA[c.categoria] || c.categoria;
        const ativo = c.ativo !== false;
        return `
          <div class="cat-item ${ativo ? '' : 'inativo'}" data-id="${c.id}">
            <i class="fas fa-grip-vertical cat-drag" data-drag-handle></i>
            <div class="cat-name">${label}<small>${c.nome}</small></div>
            <button class="cat-toggle ${ativo ? 'on' : ''}" onclick="toggleCatAtivo('${c.id}', this)" title="${ativo ? 'Ativo' : 'Oculto'}"></button>
          </div>`;
      }).join('');

      body.innerHTML = `
        <div class="cat-config">
          <div class="cat-config-hint">
            <i class="fas fa-info-circle"></i>Arraste para reordenar como as categorias aparecem na Nova Ordem. Use o interruptor para ocultar categorias que não usa.
          </div>
          <div id="catList">${rows}</div>
        </div>
        <div class="cat-save-bar">
          <button class="cat-save-btn" id="catSaveBtn" onclick="salvarCategorias()">
            <i class="fas fa-check"></i> Salvar ordem e visibilidade
          </button>
        </div>`;

      // Inicializa drag-and-drop
      if (catSortable) { catSortable.destroy(); catSortable = null; }
      const listEl = document.getElementById('catList');
      catSortable = Sortable.create(listEl, {
        handle: '[data-drag-handle]',
        animation: 160,
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
      });
    }

    function toggleCatAtivo(id, btn) {
      const cat = categorias.find(c => c.id === id);
      if (!cat) return;
      cat.ativo = !(cat.ativo !== false);
      btn.classList.toggle('on', cat.ativo);
      btn.closest('.cat-item').classList.toggle('inativo', !cat.ativo);
      btn.title = cat.ativo ? 'Ativo' : 'Oculto';
    }

    async function salvarCategorias() {
      const btn = document.getElementById('catSaveBtn');
      const listEl = document.getElementById('catList');
      // Lê a ordem atual do DOM
      const ids = [...listEl.querySelectorAll('.cat-item')].map(el => el.dataset.id);
      const itens = ids.map((id, idx) => {
        const cat = categorias.find(c => c.id === id);
        return { id, ordem: idx, ativo: cat ? (cat.ativo !== false) : true };
      });
      btn.disabled = true;
      btn.innerHTML = '<div class="spin" style="width:16px;height:16px;border-width:2px;display:inline-block"></div> Salvando...';
      try {
        await window.api.reordenarTiposVeiculo(itens);
        // Atualiza estado local com a nova ordem
        itens.forEach(it => {
          const c = categorias.find(x => x.id === it.id);
          if (c) { c.ordem = it.ordem; c.ativo = it.ativo; }
        });
        categorias.sort((a, b) => (a.ordem ?? 999) - (b.ordem ?? 999));
        showToast('Categorias atualizadas!', 'success');
      } catch (e) {
        showToast(e?.error || e?.message || 'Erro ao salvar categorias', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> Salvar ordem e visibilidade';
      }
    }

    // ── RENDER SERVIÇOS (cardápio agrupado por tipo de veículo) ──
    const GRUPOS_TIPO = [
      ['CARRO', 'Carro', 'fas fa-car-side', 'var(--blue)'],
      ['MOTO', 'Moto', 'fas fa-motorcycle', 'var(--orange)'],
      ['AVULSO', 'Higienização', 'fas fa-couch', 'var(--roxo)'],
      ['OUTROS', 'Outros', 'fas fa-ellipsis', '#6b6780'],
    ];
    function precoHtml(v) { return `<small>R$</small>${Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; }

    function renderServicos() {
      const body = document.getElementById('listBody');
      if (!servicos.length) {
        body.innerHTML = `
          <div class="state-box">
            <div class="state-icon">🧽</div>
            <div class="state-title">Nenhum serviço</div>
            <div class="state-sub">Crie o primeiro serviço para começar.</div>
            <button class="btn-state" onclick="abrirNovo()"><i class="fas fa-plus"></i> Novo serviço</button>
          </div>`;
        return;
      }
      const conhecidos = GRUPOS_TIPO.map(g => g[0]);
      body.innerHTML = GRUPOS_TIPO.map(([t, rotulo, ico, cor]) => {
        const lista = servicos.filter(s => t === 'OUTROS' ? !conhecidos.slice(0, 3).includes(s.tipoVeiculo) : s.tipoVeiculo === t);
        if (!lista.length) return '';
        return `<h2 class="grupo-tit"><i class="${ico}" style="--c: ${cor}"></i>${rotulo} <small>${lista.length}</small></h2>
          <div class="grade">${lista.map(s => cardServico(s, cor)).join('')}</div>`;
      }).join('');
    }

    function cardServico(s, cor) {
      const tipo = s.tipoVeiculo || '';
      const subs = (s.subtiposVeiculo || []).map(x => x.categoria || x);
      let etqs = '';
      if (tipo === 'CARRO') etqs = subs.length ? subs.map(x => `<span class="etq">${escHtml(LABELS_CAT[x] || x)}</span>`).join('') : '<span class="etq todas">todos os carros</span>';
      else if (tipo === 'AVULSO') etqs = subs.map(x => `<span class="etq">${escHtml(LABEL_ITEM_AVULSO(x))}</span>`).join('');
      const comissao = s.comissaoPercentual != null ? `<span class="etq com">${s.comissaoPercentual}% comissão</span>` : '';
      return `
        <article class="cartao svc" style="--c: ${cor}" onclick="abrirEditarServico('${s.id}')">
          <b>${escHtml(s.nome)}</b>
          <div class="etqs">${etqs}${comissao}</div>
          <span class="preco">${precoHtml(s.preco)}</span>
        </article>`;
    }

    // ── RENDER ADICIONAIS ─────────────────────────
    function renderAdicionais() {
      const body = document.getElementById('listBody');
      if (!adicionais.length) {
        body.innerHTML = `
          <div class="state-box">
            <div class="state-icon">✨</div>
            <div class="state-title">Nenhum adicional</div>
            <div class="state-sub">Crie o primeiro adicional para começar.</div>
            <button class="btn-state" onclick="abrirNovo()"><i class="fas fa-plus"></i> Novo adicional</button>
          </div>`;
        return;
      }
      body.innerHTML = `<p class="dica">Os mais usados aparecem primeiro na nova ordem.</p><div class="lista-ad">${adicionais.map(a => cardAdicional(a)).join('')}</div>`;
    }

    function cardAdicional(a) {
      return `
        <article class="cartao linha-ad" onclick="abrirEditarAdicional('${a.id}')">
          <span class="ic"><i class="fas fa-circle-plus"></i></span>
          <span class="t"><b>${escHtml(a.nome)}</b><span>${a.descricao ? escHtml(a.descricao) : 'sem descrição'}</span></span>
          <span class="v">+ ${precoHtml(a.preco)}</span>
        </article>`;
    }

    // ── BOTÃO "NOVO" (contexto-aware) ─────────────
    function abrirNovo() {
      if (tabAtiva === 'servicos') abrirFormServico(null);
      else abrirFormAdicional(null);
    }

    // ── DRAWER HELPERS ────────────────────────────
    function abrirDrawer() {
      document.getElementById('drawerOverlay').classList.add('open');
      document.getElementById('drawer').classList.add('open');
    }
    function fecharDrawer() {
      document.getElementById('drawerOverlay').classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
      editandoId = null;
    }

    // ── FORM SERVIÇO ──────────────────────────────
    function abrirEditarServico(id) {
      const s = servicos.find(x => x.id === id);
      if (!s) return;
      abrirFormServico(s);
    }

    function abrirFormServico(s) {
      editandoId = s?.id || null;
      document.getElementById('drawerTitle').textContent = s ? 'Editar serviço' : 'Novo serviço';

      const tipo     = s?.tipoVeiculo || '';
      const catsSel  = (s?.subtiposVeiculo || []).map(x => x.categoria || x);
      const comissao = s?.comissaoPercentual != null ? s.comissaoPercentual : '';
      // Itens avulsos disponíveis = sugeridos + já cadastrados (sem duplicar)
      const itensDisponiveis = [...new Set([...ITENS_AVULSOS_SUGERIDOS, ...itensAvulsos])];

      document.getElementById('drawerBody').innerHTML = `
        <div class="form-group">
          <label class="form-label">Nome do serviço *</label>
          <input type="text" class="form-input" id="fNome" placeholder="Ex: Lavagem Simples" value="${escHtml(s?.nome || '')}">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Preço (R$) *</label>
            <input type="number" step="0.01" min="0.01" class="form-input" id="fPreco" placeholder="0,00" value="${s?.preco || ''}">
          </div>
          <div class="form-group">
            <label class="form-label">Comissão (%)</label>
            <input type="number" step="1" min="0" max="100" class="form-input" id="fComissao"
                   placeholder="Padrão lavador" value="${comissao}">
            <div class="form-hint">Deixe vazio para usar o % padrão</div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Tipo de veículo *</label>
          <select class="form-select" id="fTipo" onchange="onTipoChange()">
            <option value="">Selecione...</option>
            <option value="CARRO" ${tipo==='CARRO'?'selected':''}>Carro</option>
            <option value="MOTO"  ${tipo==='MOTO' ?'selected':''}>Moto</option>
            <option value="AVULSO"${tipo==='AVULSO'?'selected':''}>Higienização (tapete, banco...)</option>
            <option value="OUTROS"${tipo==='OUTROS'?'selected':''}>Outros</option>
          </select>
        </div>
        <div class="form-group" id="fCatGroup" style="display:${tipo==='CARRO'?'block':'none'}">
          <label class="form-label">Categorias (Carro)</label>
          <div class="cat-grid" id="fCatGrid">
            ${CATS_CARRO.map(cat => {
              const sel = catsSel.includes(cat);
              return `<label class="cat-chip ${sel?'checked':''}" onclick="toggleCat(this)">
                <input type="checkbox" value="${cat}" ${sel?'checked':''}/>
                ${LABELS_CAT[cat]}
              </label>`;
            }).join('')}
          </div>
          <div class="form-hint" style="margin-top:8px">Nenhuma selecionada = todos os tipos de carro</div>
        </div>
        <div class="form-group" id="fItemGroup" style="display:${tipo==='AVULSO'?'block':'none'}">
          <label class="form-label">Itens avulsos deste serviço</label>
          <div class="cat-grid" id="fItemGrid">
            ${itensDisponiveis.map(it => {
              const sel = catsSel.includes(it);
              return `<label class="cat-chip ${sel?'checked':''}" onclick="toggleCat(this)">
                <input type="checkbox" value="${it}" ${sel?'checked':''}/>
                ${LABEL_ITEM_AVULSO(it)}
              </label>`;
            }).join('')}
          </div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <input type="text" class="form-input" id="fNovoItem" placeholder="Adicionar item (ex: Cadeira gamer)" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();adicionarItemAvulso();}">
            <button type="button" class="btn-f btn-f-save" style="white-space:nowrap;flex:0 0 auto" onclick="adicionarItemAvulso()"><i class="fas fa-plus"></i></button>
          </div>
          <div class="form-hint" style="margin-top:8px">Marque em quais itens este serviço/preço se aplica</div>
        </div>
      `;

      const isEdit = !!editandoId;
      document.getElementById('drawerFooter').innerHTML = `
        ${isEdit ? `<button class="btn-f btn-f-danger" onclick="excluirServico()"><i class="fas fa-trash"></i></button>` : ''}
        <button class="btn-f btn-f-cancel" onclick="fecharDrawer()">Cancelar</button>
        <button class="btn-f btn-f-save" id="btnSalvar" onclick="salvarServico()">
          <i class="fas fa-save"></i> ${isEdit ? 'Salvar' : 'Criar'}
        </button>
      `;
      abrirDrawer();
    }

    function onTipoChange() {
      const tipo = document.getElementById('fTipo').value;
      document.getElementById('fCatGroup').style.display = tipo === 'CARRO' ? 'block' : 'none';
      const itemGroup = document.getElementById('fItemGroup');
      if (itemGroup) itemGroup.style.display = tipo === 'AVULSO' ? 'block' : 'none';
    }

    function toggleCat(chip) {
      const cb = chip.querySelector('input[type="checkbox"]');
      cb.checked = !cb.checked;
      chip.classList.toggle('checked', cb.checked);
    }

    // Adiciona um novo item avulso ao grid (marcado), a partir do input de texto
    function adicionarItemAvulso() {
      const input = document.getElementById('fNovoItem');
      const raw = input.value.trim();
      if (!raw) return;
      // Chave normalizada (maiúsculas, sem acento/espaço) — igual ao padrão das categorias
      const key = raw.toUpperCase()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^A-Z0-9]/g, '');
      if (!key) return;
      const grid = document.getElementById('fItemGrid');
      // Se já existe, apenas marca
      const existente = [...grid.querySelectorAll('input[type="checkbox"]')].find(cb => cb.value === key);
      if (existente) {
        if (!existente.checked) existente.closest('.cat-chip').click();
      } else {
        const label = document.createElement('label');
        label.className = 'cat-chip checked';
        label.setAttribute('onclick', 'toggleCat(this)');
        label.innerHTML = `<input type="checkbox" value="${key}" checked/> ${escHtml(raw.charAt(0).toUpperCase() + raw.slice(1))}`;
        grid.appendChild(label);
      }
      input.value = '';
    }

    async function salvarServico() {
      const nome    = document.getElementById('fNome').value.trim();
      const preco   = parseFloat(document.getElementById('fPreco').value);
      const tipo    = document.getElementById('fTipo').value;
      const comissaoVal = document.getElementById('fComissao').value;
      const comissao = comissaoVal !== '' ? parseFloat(comissaoVal) : null;

      if (!nome || !preco || preco <= 0 || !tipo) {
        showToast('Preencha nome, preço e tipo de veículo', 'error'); return;
      }

      // Carro → categorias; Avulso → itens; demais → nenhum subtipo
      let cats = [];
      if (tipo === 'CARRO') {
        cats = Array.from(document.querySelectorAll('#fCatGrid input:checked')).map(c => c.value);
      } else if (tipo === 'AVULSO') {
        cats = Array.from(document.querySelectorAll('#fItemGrid input:checked')).map(c => c.value);
        if (cats.length === 0) { showToast('Selecione ao menos um item avulso', 'error'); return; }
      }

      const payload = {
        nome, preco, tipoVeiculo: tipo,
        subtiposVeiculo: cats,
        ...(comissao !== null ? { comissaoPercentual: comissao } : { comissaoPercentual: null })
      };

      const btn = document.getElementById('btnSalvar');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';

      try {
        if (editandoId) {
          await window.api.updateServico(editandoId, payload);
          showToast('Serviço atualizado!', 'success');
        } else {
          await window.api.createServico(payload);
          showToast('Serviço criado!', 'success');
        }
        fecharDrawer();
        await carregar();
      } catch (err) {
        showToast(err?.error || 'Erro ao salvar serviço', 'error');
        btn.disabled = false; btn.innerHTML = `<i class="fas fa-save"></i> ${editandoId ? 'Salvar' : 'Criar'}`;
      }
    }

    function excluirServico() {
      if (!confirm('Excluir este serviço? Esta ação não pode ser desfeita.')) return;
      window.api.deleteServico(editandoId)
        .then(() => { showToast('Serviço excluído.', 'success'); fecharDrawer(); carregar(); })
        .catch(() => showToast('Erro ao excluir serviço.', 'error'));
    }

    // ── FORM ADICIONAL ────────────────────────────
    function abrirEditarAdicional(id) {
      const a = adicionais.find(x => x.id === id);
      if (!a) return;
      abrirFormAdicional(a);
    }

    function abrirFormAdicional(a) {
      editandoId = a?.id || null;
      document.getElementById('drawerTitle').textContent = a ? 'Editar adicional' : 'Novo adicional';

      document.getElementById('drawerBody').innerHTML = `
        <div class="form-group">
          <label class="form-label">Nome do adicional *</label>
          <input type="text" class="form-input" id="fNomeA" placeholder="Ex: Polimento Especial" value="${escHtml(a?.nome || '')}">
        </div>
        <div class="form-group">
          <label class="form-label">Preço (R$) *</label>
          <input type="number" step="0.01" min="0.01" class="form-input" id="fPrecoA" placeholder="0,00" value="${a?.preco || ''}">
        </div>
        <div class="form-group">
          <label class="form-label">Descrição <span style="font-weight:400;color:var(--light)">(opcional)</span></label>
          <textarea class="form-input" id="fDescA" placeholder="Detalhes do adicional..."
                    style="resize:vertical;min-height:70px">${escHtml(a?.descricao || '')}</textarea>
        </div>
      `;

      const isEdit = !!editandoId;
      document.getElementById('drawerFooter').innerHTML = `
        ${isEdit ? `<button class="btn-f btn-f-danger" onclick="excluirAdicional()"><i class="fas fa-trash"></i></button>` : ''}
        <button class="btn-f btn-f-cancel" onclick="fecharDrawer()">Cancelar</button>
        <button class="btn-f btn-f-save" id="btnSalvarA" onclick="salvarAdicional()">
          <i class="fas fa-save"></i> ${isEdit ? 'Salvar' : 'Criar'}
        </button>
      `;
      abrirDrawer();
    }

    async function salvarAdicional() {
      const nome   = document.getElementById('fNomeA').value.trim();
      const preco  = parseFloat(document.getElementById('fPrecoA').value);
      const desc   = document.getElementById('fDescA').value.trim();

      if (!nome || !preco || preco <= 0) {
        showToast('Preencha nome e preço', 'error'); return;
      }

      const btn = document.getElementById('btnSalvarA');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';

      try {
        const payload = { nome, preco, descricao: desc || null };
        if (editandoId) {
          await window.api.updateAdicional(editandoId, payload);
          showToast('Adicional atualizado!', 'success');
        } else {
          await window.api.createAdicional(payload);
          showToast('Adicional criado!', 'success');
        }
        fecharDrawer();
        await carregar();
      } catch (err) {
        showToast(err?.error || 'Erro ao salvar adicional', 'error');
        btn.disabled = false; btn.innerHTML = `<i class="fas fa-save"></i> ${editandoId ? 'Salvar' : 'Criar'}`;
      }
    }

    function excluirAdicional() {
      if (!confirm('Excluir este adicional? Esta ação não pode ser desfeita.')) return;
      window.api.deleteAdicional(editandoId)
        .then(() => { showToast('Adicional excluído.', 'success'); fecharDrawer(); carregar(); })
        .catch(() => showToast('Erro ao excluir adicional.', 'error'));
    }

    // ── UTILS ─────────────────────────────────────
    function fmtR(v) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
    }
    function escHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function showToast(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `toast ${type} show`;
      el.textContent = msg;
      document.getElementById('toastContainer').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }
  </script>
  <script src="/funcionario/decola-base.js"></script>
</body>
</html>
