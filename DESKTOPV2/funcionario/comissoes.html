<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b1e3f">
  <title>Comissões — Lina X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/funcionario/decola-base.css">
  <style>
    /* Visual Decola (aprovado em 04/11/2026). Backup do visual antigo: tag git design-classico-2026-11-05 */
    .pagina { max-width: 760px; padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: 120px; }
    .topo { display: flex; align-items: center; gap: 10px; }
    .topo-tit { flex: 1; min-width: 0; }
    .topo-tit h1 { margin: 0; font: 400 clamp(24px, 6vw, 34px)/1 var(--dela); text-shadow: 3px 3px 0 var(--lina); }
    .topo-tit small { display: block; margin-top: 4px; font: 700 11px var(--mono); opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .quem { display: flex; gap: 12px; overflow-x: auto; margin: 16px calc(var(--gutter) * -1) 0; padding: 4px var(--gutter) 8px; scrollbar-width: none; }
    .pessoa { flex: none; display: grid; justify-items: center; gap: 4px; background: none; border: 0; padding: 0; color: var(--cream); cursor: pointer; }
    .pessoa .av { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--cream); background: transparent; display: grid; place-items: center; font: 400 20px var(--dela); color: var(--cream); transition: transform .15s; }
    .pessoa > span:last-child { font: 700 11px var(--mono); }
    .pessoa.active .av { background: var(--c); border-color: var(--ink); box-shadow: 3px 3px 0 var(--yellow); transform: translateY(-2px); }
    .pessoa.active > span:last-child { color: var(--yellow); }
    .quem .vazio-txt { font: 700 12px var(--mono); opacity: .6; padding: 10px 0; }

    .periodos { display: flex; gap: 6px; overflow-x: auto; margin: 8px 0 10px; scrollbar-width: none; }
    .period-chip { flex: none; padding: 5px 11px; border: 2px dashed var(--cream); border-radius: 999px; background: none; color: var(--cream); font: 700 12px var(--mono); cursor: pointer; }
    .period-chip.active { border-style: solid; background: var(--yellow); color: var(--ink); border-color: var(--ink); }
    .date-row { display: none; align-items: center; gap: 6px; margin-bottom: 12px; font: 700 12px var(--mono); }
    .date-row.show { display: flex; }
    .date-row .entrada { flex: 1; min-width: 0; padding: 6px 8px; font-size: 12px; }
    .date-row .btn { padding: 7px 12px; font-size: 13px; }

    /* contracheque */
    .cheque { padding: 0; overflow: hidden; --sc: var(--green); }
    .cheque-topo { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--c); color: var(--cream); border-bottom: 3px solid var(--ink); }
    .cheque-topo b { flex: 1; min-width: 0; font: 400 16px var(--dela); overflow-wrap: anywhere; }
    .cheque-topo span { font: 700 11px var(--mono); opacity: .9; text-align: right; }
    .conta { padding: 10px 14px 4px; }
    .conta-linha { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font: 700 13px var(--mono); }
    .conta-linha span:first-child { color: var(--muted); font-weight: 400; }
    .conta-linha.menos span:last-child { color: #c1361a; }
    .conta-total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 4px 14px 12px; padding-top: 10px; border-top: 3px double var(--ink); }
    .conta-total small { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .conta-total b { font: 400 clamp(22px, 7vw, 30px)/1 var(--dela); color: #1a7d45; white-space: nowrap; }
    .conta-total b.neg { color: #c1361a; }
    .cheque .btn { margin: 0 14px 14px; width: calc(100% - 28px); }
    .carregando { display: grid; justify-items: center; gap: 10px; padding: 30px 0; font: 700 12px var(--mono); }
    .carregando i { width: 30px; height: 30px; border: 3px solid var(--cream); border-top-color: transparent; border-radius: 50%; animation: girar .7s linear infinite; }
    .vazio { text-align: center; padding: 22px 16px; --sc: var(--yellow); }
    .vazio .ic { font-size: 26px; }
    .vazio b { display: block; font: 400 16px var(--dela); margin: 6px 0 4px; }
    .vazio p { margin: 0; font-size: 12px; color: var(--muted); }

    .filtros { display: flex; gap: 6px; margin: 18px 0 4px; flex-wrap: wrap; }
    .sf-chip { padding: 4px 10px; border: 2px solid var(--cream); border-radius: 999px; background: none; color: var(--cream); font: 700 11px var(--mono); cursor: pointer; }
    .sf-chip[class*="active"] { background: var(--cream); color: var(--ink); border-color: var(--ink); box-shadow: 2px 2px 0 var(--pink); }
    .sec-tit { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
    .sec-tit::after { content: ""; flex: 1; border-top: 2px dashed currentColor; opacity: .5; }
    .ords { padding: 2px 12px; --sc: var(--blue); }
    .ords.deb { --sc: var(--red); }
    .ord { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; align-items: center; }
    .ord + .ord { border-top: 2px dashed var(--line); }
    .ord .t { min-width: 0; }
    .ord .t b { display: block; font: 400 13px/1.2 var(--dela); overflow-wrap: anywhere; }
    .ord .t > span { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); min-width: 0; }
    .ord .t .os { flex: none; padding: 0 5px; border-radius: 4px; background: var(--ink); color: var(--cream); font: 700 10px/1.5 var(--mono); }
    .ord .t .sv { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ord .v { text-align: right; font: 400 15px var(--dela); color: #1a7d45; white-space: nowrap; }
    .ord .v small { display: block; font: 700 10px var(--mono); color: var(--muted); }
    .st { display: inline-block; margin-top: 3px; padding: 0 6px; border-radius: 5px; border: 1.5px solid var(--ink); font: 700 9px/1.5 var(--mono); letter-spacing: .04em; text-transform: uppercase; background: var(--b); color: var(--ink); }
    .deb .v { color: #c1361a; }

    /* fechar e pagar */
    .janela { position: fixed; inset: 0; z-index: 1200; background: #0e0f24bb; align-items: flex-end; justify-content: center; }
    @media (min-width: 700px) { .janela { align-items: center; } }
    .janela .folha { transform: none; animation: subir .4s cubic-bezier(.2, .9, .3, 1.1); }
    @keyframes subir { from { transform: translateY(60%); } to { transform: none; } }
    .pagar-v { text-align: center; } .pagar-v small { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); } .pagar-v b { display: block; font: 400 34px/1.1 var(--dela); color: #1a7d45; }
    .pe-2 { display: flex; gap: 10px; } .pe-2 .btn { flex: 1; } .pe-2 .btn.cancelar { flex: 0 0 auto; background: var(--paper); }
  </style>
</head>
<body>
<div id="ceu" aria-hidden="true"></div>
<div id="grao" aria-hidden="true"></div>

<div class="pagina">
  <header class="topo">
    <a class="ico-btn" href="/funcionario/index.html" title="Início"><i class="fas fa-home"></i></a>
    <div class="topo-tit"><h1>Comissões</h1><small id="empresaNome">Carregando...</small></div>
  </header>

  <nav class="quem" id="empRow"><span class="vazio-txt">Carregando...</span></nav>

  <div class="periodos">
    <button class="period-chip active" id="pre-today" onclick="setPreset('today')">Hoje</button>
    <button class="period-chip" id="pre-week" onclick="setPreset('week')">Semana</button>
    <button class="period-chip" id="pre-month" onclick="setPreset('month')">Mês</button>
    <button class="period-chip" id="pre-abertas" onclick="setPreset('abertas')">Em aberto</button>
    <button class="period-chip" id="pre-custom" onclick="setPreset('custom')"><i class="fas fa-calendar"></i> Período</button>
  </div>
  <div class="date-row" id="dateRow">
    <input class="entrada" type="date" id="dInicio"><span>até</span><input class="entrada" type="date" id="dFim">
    <button class="btn azul" onclick="applyCustom()">Buscar</button>
  </div>

  <div id="statsCard"></div>

  <div class="filtros" id="statusFilter" style="display:none">
    <button class="sf-chip active-all" id="sf-all" onclick="setStatusFilter('')">Todas</button>
    <button class="sf-chip" id="sf-fin" onclick="setStatusFilter('FINALIZADO')">Finalizadas</button>
    <button class="sf-chip" id="sf-ag" onclick="setStatusFilter('AGUARDANDO_PAGAMENTO')">Aguardando pgto</button>
    <button class="sf-chip" id="sf-em" onclick="setStatusFilter('EM_ANDAMENTO')">Em andamento</button>
  </div>

  <p class="sec-tit" id="listLabel" style="display:none">Ordens a receber</p>
  <div id="orderList"></div>

  <p class="sec-tit" id="debitLabel" style="display:none">Débitos a descontar</p>
  <div id="debitList"></div>
</div>

<nav id="mobileNav"></nav>
<div class="menu-dropdown" id="menuDropdown">
  <a href="/funcionario/index.html"><i class="fas fa-home"></i> Início</a>
  <a href="/funcionario/ordens.html"><i class="fas fa-list-alt"></i> Ordens</a>
  <a href="/funcionario/financeiro.html"><i class="fas fa-money-bill-wave"></i> Financeiro</a>
  <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
</div>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="toast" id="toast"><i id="toastIco" class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<!-- fechar e pagar comissão -->
<div class="janela" id="fecharModal" style="display:none" onclick="if(event.target===this)fecharModalClose()">
  <div class="folha" style="--sc: var(--green)" role="dialog" aria-label="Fechar comissão">
    <div class="folha-cab"><h3>Fechar e pagar comissão<small>fecha as comissões e vales do período mostrado</small></h3><button class="fechar" onclick="fecharModalClose()"><i class="fas fa-times"></i></button></div>
    <div class="folha-corpo" style="gap: 14px">
      <div class="pagar-v"><small>Valor a pagar</small><b id="fecharValor">R$ 0,00</b></div>
      <div class="campo" id="fecharFormaWrap"><label>Forma de pagamento</label>
        <select class="entrada" id="fecharForma">
          <option value="">Selecione...</option>
          <option value="DINHEIRO">💵 Dinheiro</option>
          <option value="PIX">📱 PIX</option>
          <option value="CARTAO">💳 Cartão</option>
        </select>
      </div>
      <div class="campo"><label>Observação <small style="text-transform: none">(opcional)</small></label><textarea class="entrada" id="fecharObs" rows="2" placeholder="Ex.: adiantamento descontado" style="resize: vertical; font-weight: 400; font-size: 13px"></textarea></div>
    </div>
    <div class="folha-pe pe-2"><button class="btn cancelar" onclick="fecharModalClose()">Cancelar</button><button class="btn verde" id="fecharConfirmBtn" onclick="confirmarFechar()"><i class="fas fa-check"></i> Fechar e pagar</button></div>
  </div>
</div>

  <script src="../api.js"></script>
  <script src="utils.js"></script>
  <script>
    const PAGE_TITLE  = 'Comissões';
    const PAGE_ACTIVE = 'comissoes';

    let funcionarios       = [];
    let selectedId         = null;
    // Dados retornados pelo getDadosComissao
    let ordensComissao     = []; // ordens com comissaoPaga: false
    let adiantamentosPend  = []; // adiantamentos com status PENDENTE
    let debitosOS          = []; // OS com pagamento DEBITO_FUNCIONARIO
    let activePreset       = 'today';
    let activeStatusFilter = '';
    let dateInicio         = '';
    let dateFim            = '';

    function temPermissao(p) {
      try { return JSON.parse(localStorage.getItem('permissoes') || '[]').includes(p); }
      catch { return false; }
    }

    // Resumo do fechamento do lavador selecionado (mesma conta do renderStats)
    function _resumoFechamento() {
      const totalComissao = ordensComissao.reduce((s, o) => s + getWasherShare(o, selectedId), 0);
      const totalAdianto  = adiantamentosPend.reduce((s, a) => s + (parseFloat(a.valor) || 0), 0);
      const totalDebOS    = debitosOS.reduce((s, o) => s + getWasherShare(o, selectedId), 0);
      const saldo = totalComissao - (totalAdianto + totalDebOS);
      return { saldo };
    }

    function abrirFecharModal() {
      const { saldo } = _resumoFechamento();
      document.getElementById('fecharValor').textContent = formatCurrency(saldo);
      // Forma de pagamento só é exigida quando há valor a pagar (saldo > 0)
      document.getElementById('fecharFormaWrap').style.display = saldo > 0 ? 'block' : 'none';
      document.getElementById('fecharForma').value = '';
      document.getElementById('fecharObs').value = '';
      document.getElementById('fecharModal').style.display = 'flex';
    }
    function fecharModalClose() {
      document.getElementById('fecharModal').style.display = 'none';
    }

    async function confirmarFechar() {
      const { saldo } = _resumoFechamento();
      const forma = document.getElementById('fecharForma').value;
      if (saldo > 0 && !forma) { showToast('Selecione a forma de pagamento', 'error'); return; }

      // Espelha o admin: débitos de OS só reduzem o valorPago (não vão em comissaoIds)
      const payload = {
        lavadorId: selectedId,
        comissaoIds: ordensComissao.map(o => o.id),
        adiantamentoIds: adiantamentosPend.map(a => a.id),
        valorPago: parseFloat(saldo.toFixed(2)),
        formaPagamento: saldo > 0 ? forma : 'NA',
        observacao: document.getElementById('fecharObs').value || '',
      };
      if (payload.comissaoIds.length === 0 && payload.adiantamentoIds.length === 0) {
        showToast('Nada para fechar no período.', 'error'); return;
      }

      const btn = document.getElementById('fecharConfirmBtn');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
      try {
        await window.api.fecharComissao(payload);
        showToast('Comissão fechada com sucesso!', 'success');
        fecharModalClose();
        await loadOrdens();
      } catch (e) {
        showToast(e?.error || e?.message || 'Erro ao fechar comissão.', 'error');
      } finally {
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Fechar e pagar';
      }
    }

    // ── INIT ──
    document.addEventListener('DOMContentLoaded', async () => {
      if (!validateFuncionarioAccess()) return;

      const perms = JSON.parse(localStorage.getItem('permissoes') || '[]');
      if (!perms.includes('gerenciar_funcionarios')) {
        showToast('Sem permissão para comissões', 'error');
        setTimeout(() => { window.location.href = '/funcionario/index.html'; }, 1500);
        return;
      }

      document.getElementById('mobileNav').innerHTML = createMobileNav(PAGE_ACTIVE);
      await loadUserInfo();
      setPreset('today', false);
      await loadFuncionarios();
    });

    // ── PERÍODO ──
    function setPreset(preset, reload = true) {
      activePreset = preset;
      document.querySelectorAll('.period-chip').forEach(c => c.classList.remove('active'));
      document.getElementById('pre-' + preset)?.classList.add('active');
      const dateRow = document.getElementById('dateRow');

      if (preset === 'custom') { dateRow.classList.add('show'); return; }
      dateRow.classList.remove('show');

      const now   = new Date();
      const pad   = n => String(n).padStart(2, '0');
      const fmt   = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      const today = fmt(now);

      if (preset === 'today') {
        dateInicio = today; dateFim = today;
      } else if (preset === 'week') {
        const mon = new Date(now);
        mon.setDate(now.getDate() - now.getDay() + (now.getDay() === 0 ? -6 : 1));
        dateInicio = fmt(mon); dateFim = today;
      } else if (preset === 'month') {
        dateInicio = `${now.getFullYear()}-${pad(now.getMonth()+1)}-01`;
        dateFim = today;
      } else if (preset === 'abertas') {
        // Sem datas: backend retorna todas as comissões pendentes (sem limite de data)
        dateInicio = ''; dateFim = '';
      }

      if (reload && selectedId) loadOrdens();
    }

    function applyCustom() {
      dateInicio = document.getElementById('dInicio').value;
      dateFim    = document.getElementById('dFim').value;
      if (!dateInicio || !dateFim) { showToast('Selecione as duas datas', 'error'); return; }
      if (dateInicio > dateFim)    { showToast('Data inicial deve ser antes da final', 'error'); return; }
      if (selectedId) loadOrdens();
    }

    // ── STATUS FILTER ──
    function setStatusFilter(status) {
      activeStatusFilter = status;
      document.querySelectorAll('.sf-chip').forEach(c => { c.className = 'sf-chip'; });
      const map = { '':'active-all', 'FINALIZADO':'active-fin', 'AGUARDANDO_PAGAMENTO':'active-ag', 'EM_ANDAMENTO':'active-em' };
      const ids = { '':'sf-all', 'FINALIZADO':'sf-fin', 'AGUARDANDO_PAGAMENTO':'sf-ag', 'EM_ANDAMENTO':'sf-em' };
      document.getElementById(ids[status])?.classList.add(map[status]);
      renderOrdens();
    }

    // ── MULTI-WASH: retorna o ganho do lavador numa ordem ──
    function getWasherShare(order, lavadorId) {
      const washers = [];
      if (Array.isArray(order.ordemLavadores) && order.ordemLavadores.length > 0) {
        order.ordemLavadores.forEach(ol => {
          const id = ol.lavadorId || ol.id;
          if (id) washers.push({ id, ganho: typeof ol.ganho === 'number' ? ol.ganho : undefined });
        });
      } else if (order.lavadorId) {
        const ganho = typeof order.comissao === 'number' ? order.comissao : undefined;
        washers.push({ id: order.lavadorId, ganho });
      }
      if (!washers.length) return 0;

      // Se o registro já tem ganho individual calculado, usa direto
      const existing = washers.find(w => w.id === lavadorId && typeof w.ganho === 'number');
      if (existing) return existing.ganho;

      // Fallback: divide proporcionalmente
      const pct = order.lavador?.comissao ?? 0;
      const totalCents = Math.round((order.valorTotal || 0) * (pct / 100) * 100);
      if (totalCents <= 0) return 0;
      const base = Math.floor(totalCents / washers.length);
      let remainder = totalCents % washers.length;
      const shareMap = {};
      washers.forEach(w => {
        let cents = base;
        if (remainder > 0) { cents += 1; remainder--; }
        shareMap[w.id] = cents / 100;
      });
      return shareMap[lavadorId] || 0;
    }

    // ── FUNCIONÁRIOS ──
    async function loadFuncionarios() {
      try {
        const r = await window.api.getLavadoresSimple();
        funcionarios = r.lavadores || r || [];

        if (!funcionarios.length) {
          document.getElementById('empRow').innerHTML = '<span class="vazio-txt">Nenhum funcionário</span>';
          document.getElementById('statsCard').innerHTML = emptyHtml('fa-users', 'Nenhum funcionário', 'Cadastre funcionários para ver comissões.');
          return;
        }

        renderEmpChips();
        selectedId = funcionarios[0].id;
        document.getElementById('empRow').querySelector(`[data-id="${selectedId}"]`)?.classList.add('active');
        await loadOrdens();
      } catch (e) {
        document.getElementById('empRow').innerHTML = '<span class="vazio-txt">Erro ao carregar</span>';
        showToast('Erro ao carregar funcionários', 'error');
      }
    }

    function renderEmpChips() {
      const colors = ['#2f62e6', '#22a15a', '#ff5b2e', '#c2418f', '#6b4fd8', '#0d9488', '#d4a017', '#e5383b'];
      document.getElementById('empRow').innerHTML = funcionarios.map((f, i) => {
        const inicial = (f.nome || 'F').charAt(0).toUpperCase();
        return `<button class="pessoa emp-chip" data-id="${f.id}" style="--c: ${colors[i % colors.length]}" onclick="selectFuncionario('${f.id}')">
            <span class="av">${inicial}</span><span>${(f.nome || '').split(' ')[0]}</span></button>`;
      }).join('');
    }

    async function selectFuncionario(id) {
      selectedId = id;
      document.querySelectorAll('.emp-chip').forEach(c => {
        c.classList.toggle('active', c.dataset.id === id);
      });
      await loadOrdens();
    }

    // ── CARREGAR DADOS (usa getDadosComissao — mesma fonte do admin) ──
    async function loadOrdens() {
      document.getElementById('statsCard').innerHTML = loadingHtml();
      document.getElementById('orderList').innerHTML = '';
      document.getElementById('debitList').innerHTML = '';
      document.getElementById('statusFilter').style.display = 'none';
      document.getElementById('listLabel').style.display    = 'none';
      document.getElementById('debitLabel').style.display   = 'none';

      try {
        const params = { lavadorId: selectedId };
        // Para "abertas": sem datas → backend retorna todas as pendentes
        if (dateInicio && dateFim) {
          params.dataInicio = dateInicio;
          params.dataFim    = dateFim;
        }

        const resp = await window.api.getDadosComissao(params);
        ordensComissao    = resp.comissoes    || [];
        adiantamentosPend = resp.adiantamentos || [];
        debitosOS         = resp.debitosOS    || [];

        renderStats();
        renderOrdens();
        renderDebitos();

        document.getElementById('statusFilter').style.display = ordensComissao.length ? 'flex'  : 'none';
        document.getElementById('listLabel').style.display    = ordensComissao.length ? 'block' : 'none';

        const temDebitos = adiantamentosPend.length > 0 || debitosOS.length > 0;
        document.getElementById('debitLabel').style.display = temDebitos ? 'block' : 'none';
      } catch (e) {
        document.getElementById('statsCard').innerHTML = emptyHtml('fa-exclamation-triangle', 'Erro ao carregar', 'Tente novamente.');
        showToast('Erro ao carregar comissões', 'error');
      }
    }

    // ── STATS ──
    function renderStats() {
      const func = funcionarios.find(f => f.id === selectedId);
      if (!func) return;
      const pct = parseFloat(func.comissao) || 0;

      // Comissão bruta: soma o ganho deste lavador em cada ordem pendente
      const totalComissao = ordensComissao.reduce((s, o) => s + getWasherShare(o, selectedId), 0);

      // Débitos: adiantamentos pendentes + débitos de OS
      const totalAdianto  = adiantamentosPend.reduce((s, a) => s + (parseFloat(a.valor) || 0), 0);
      const totalDebOS    = debitosOS.reduce((s, o) => s + getWasherShare(o, selectedId), 0);
      const totalDebitos  = totalAdianto + totalDebOS;

      // Saldo real a receber
      const saldoLiquido  = totalComissao - totalDebitos;

      const labelPeriodo = { today: 'Hoje', week: 'Esta semana', month: 'Este mês', abertas: 'Todas abertas', custom: 'Período' }[activePreset] || '';

      // Botão de fechar só para quem tem a permissão e havendo algo a fechar
      const podeFechar = temPermissao('fechar_comissao') && (ordensComissao.length > 0 || adiantamentosPend.length > 0);

      const cor = getComputedStyle(document.querySelector(`.pessoa[data-id="${selectedId}"]`) || document.body).getPropertyValue('--c') || 'var(--blue)';
      document.getElementById('statsCard').innerHTML = `
        <section class="cartao cheque" style="--c: ${cor}">
          <div class="cheque-topo"><b>${func.nome}</b><span>${pct}% de comissão<br>${labelPeriodo.toLowerCase()}</span></div>
          <div class="conta">
            <div class="conta-linha"><span>${ordensComissao.length} ordem${ordensComissao.length !== 1 ? 's' : ''} · comissão</span><span>${formatCurrency(totalComissao)}</span></div>
            <div class="conta-linha menos"><span>Débitos (${adiantamentosPend.length + debitosOS.length})</span><span>− ${formatCurrency(totalDebitos)}</span></div>
          </div>
          <div class="conta-total"><small>A pagar</small><b class="${saldoLiquido < 0 ? 'neg' : ''}">${formatCurrency(saldoLiquido)}</b></div>
          ${podeFechar ? `<button class="btn verde" onclick="abrirFecharModal()"><i class="fas fa-hand-holding-dollar"></i> Fechar e pagar</button>` : ''}
        </section>`;
    }

    // ── RENDER ORDENS PENDENTES ──
    function renderOrdens() {
      const list = document.getElementById('orderList');
      const func = funcionarios.find(f => f.id === selectedId);
      if (!func) return;

      let filtered = ordensComissao;
      if (activeStatusFilter) filtered = ordensComissao.filter(o => o.status === activeStatusFilter);

      if (!filtered.length) {
        list.innerHTML = emptyHtml('fa-receipt', 'Sem ordens pendentes', activeStatusFilter ? 'Nenhuma ordem com esse status.' : 'Nenhuma comissão a receber no período.');
        return;
      }

      const STATUS_LABEL = {
        FINALIZADO: 'Finalizado', AGUARDANDO_PAGAMENTO: 'Aguardando',
        EM_ANDAMENTO: 'Em andamento', PENDENTE: 'Pendente', CANCELADO: 'Cancelado',
      };
      const pct = parseFloat(func.comissao) || 0;

      const COR_ST = { FINALIZADO: '#9be3b5', AGUARDANDO_PAGAMENTO: '#ffc6e3', EM_ANDAMENTO: '#c5d4ff', PENDENTE: '#fff3c4', CANCELADO: '#e3d8bd' };
      list.innerHTML = `<section class="cartao ords">${filtered.map(o => {
        const comiss  = getWasherShare(o, selectedId);
        const valor   = parseFloat(o.valorTotal) || 0;
        const status  = o.status || 'PENDENTE';
        const data    = o.createdAt ? new Date(o.createdAt).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', timeZone:'America/Sao_Paulo' }) : '';
        const detalhe = [o.servico?.nome || o.tipoVeiculo, o.veiculo?.modelo, o.veiculo?.placa, data].filter(Boolean).join(' · ');
        return `<div class="ord">
            <span class="t"><b>${o.cliente?.nome || '—'}</b><span><span class="os">#${o.numeroOrdem || o.id?.slice(0,8)}</span><span class="sv">${detalhe}</span></span>
              <span class="st" style="--b: ${COR_ST[status] || '#e3d8bd'}">${(STATUS_LABEL[status] || status).toLowerCase()}</span></span>
            <span class="v">+ ${formatCurrency(comiss)}<small>OS ${formatCurrency(valor)} · ${pct}%</small></span>
          </div>`;
      }).join('')}</section>`;
    }

    // ── RENDER DÉBITOS PENDENTES ──
    function renderDebitos() {
      const list = document.getElementById('debitList');
      const allDebits = [
        ...adiantamentosPend.map(a => {
          const raw  = a.caixaRegistro?.descricao || '';
          const sep  = raw.indexOf(' — ');
          const desc = sep !== -1 ? raw.slice(sep + 3).trim() : '';
          return {
            tipo: 'adiantamento',
            label: desc || 'Adiantamento (Vale)',
            sub: a.data ? new Date(a.data).toLocaleDateString('pt-BR') : '—',
            valor: parseFloat(a.valor) || 0,
          };
        }),
        ...debitosOS.map(d => ({
          tipo: 'debitos_os',
          label: `Débito OS #${d.numeroOrdem || d.id?.slice(0,8)}`,
          sub: d.dataFim ? new Date(d.dataFim).toLocaleDateString('pt-BR', { timeZone:'America/Sao_Paulo' }) : '—',
          valor: getWasherShare(d, selectedId),
        })),
      ].filter(d => d.valor > 0);

      if (!allDebits.length) {
        list.innerHTML = '';
        return;
      }

      list.innerHTML = `<section class="cartao ords deb">${allDebits.map(d => `
        <div class="ord">
          <span class="t"><b>${d.label}</b><span>${d.tipo === 'adiantamento' ? 'vale' : 'débito de OS'} · ${d.sub}</span><span class="st" style="--b: #ffe0dc">pendente</span></span>
          <span class="v">− ${formatCurrency(d.valor)}<small>a descontar</small></span>
        </div>`).join('')}</section>`;
    }

    // ── HELPERS ──
    function formatCurrency(v) {
      return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
    }

    function loadingHtml() {
      return `<div class="carregando"><i></i>Carregando...</div>`;
    }

    function emptyHtml(ico, title, sub) {
      return `<section class="cartao vazio"><div class="ic"><i class="fas ${ico}"></i></div><b>${title}</b><p>${sub}</p></section>`;
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      const i = document.getElementById('toastIco');
      document.getElementById('toastMsg').textContent = msg;
      t.className = `toast ${type}`;
      void t.offsetWidth;
      i.className = `fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}`;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function toggleMenu() {
      document.getElementById('menuDropdown').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }
    function closeMenu() {
      document.getElementById('menuDropdown').classList.remove('active');
      document.getElementById('overlay').classList.remove('active');
    }
  </script>
  <script src="/funcionario/decola-base.js"></script>
</body>
</html>
