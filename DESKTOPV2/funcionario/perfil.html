<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b1e3f">
  <title>Meu Perfil — Lina X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/funcionario/decola-base.css">
  <style>
    /* Visual Decola (aprovado em 04/11/2026). Backup do visual antigo: tag git design-classico-2026-11-05 */
    .pagina { max-width: 560px; padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: 60px; }
    .topo { display: flex; align-items: center; gap: 10px; }
    .topo h1 { flex: 1; margin: 0; font: 400 clamp(24px, 6vw, 34px)/1 var(--dela); text-shadow: 3px 3px 0 var(--lina); }

    /* crachá */
    .cracha { margin-top: 18px; padding: 0; overflow: hidden; --sc: var(--yellow); }
    .cracha-faixa { height: 54px; background: repeating-linear-gradient(-45deg, var(--blue) 0 12px, #4b7cf0 12px 24px); border-bottom: 3px solid var(--ink); position: relative; }
    .cracha-faixa::after { content: ""; position: absolute; left: 50%; top: 10px; width: 46px; height: 10px; margin-left: -23px; border-radius: 999px; background: var(--space); border: 2.5px solid var(--ink); }
    .cracha-corpo { display: grid; justify-items: center; gap: 4px; padding: 0 16px 16px; margin-top: -42px; text-align: center; }
    .foto { position: relative; width: 92px; height: 92px; border-radius: 24px; border: 3px solid var(--ink); background: var(--pink); display: grid; place-items: center;
      font: 400 40px var(--dela); box-shadow: 4px 4px 0 var(--ink); }
    .foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 21px; }
    .foto label { position: absolute; right: -10px; bottom: -10px; width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--yellow); color: var(--ink);
      cursor: pointer; font-size: 14px; display: grid; place-items: center; z-index: 1; }
    #fotoInput { display: none; }
    .cracha h2 { margin: 12px 0 0; font: 400 22px/1.1 var(--dela); overflow-wrap: anywhere; }
    .cargo { display: inline-block; margin-top: 4px; padding: 1px 10px; border-radius: 999px; background: var(--ink); color: var(--yellow); font: 700 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .email { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .cracha .dica { margin: 6px 0 0; font-size: 10px; color: var(--muted); }

    .sec-tit { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
    .sec-tit::after { content: ""; flex: 1; border-top: 2px dashed currentColor; opacity: .5; }

    .zap { display: flex; align-items: center; gap: 12px; --sc: #25d366; }
    .zap .ic { width: 44px; height: 44px; border-radius: 12px; border: 2.5px solid var(--ink); background: #25d366; color: var(--ink); display: grid; place-items: center; font-size: 22px; flex: none; }
    .zap .t { flex: 1; min-width: 0; } .zap .t b { display: block; font: 400 15px var(--dela); } .zap .t > span { display: block; font-size: 11px; color: var(--muted); }
    .estado-zap { display: inline-flex !important; align-items: center; gap: 5px; margin-top: 3px; font: 700 10px var(--mono); color: #1a7d45 !important; }
    .estado-zap::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #25d366; border: 1.5px solid var(--ink); }
    .zap .btn { padding: 7px 10px; font-size: 12px; box-shadow: 2px 2px 0 var(--ink); flex: none; }
    .zap .btn.verde-zap { background: #25d366; }

    .form { display: grid; gap: 12px; --sc: var(--orange); }
    .form h3 { margin: 0; font: 400 15px var(--dela); }
    .senha { position: relative; }
    .senha .entrada { padding-right: 44px; }
    .senha button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; background: none; color: var(--muted); cursor: pointer; }
    .forca { display: flex; gap: 4px; } .forca i { flex: 1; height: 6px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--paper); }
    .forca i.on { background: var(--c); }
    .forca-rot, .confere { font: 700 10px var(--mono); color: var(--muted); }
    .sair { width: 100%; margin-top: 20px; background: var(--paper); color: #c1361a; }

    /* janela do WhatsApp */
    .modal-bg { position: fixed; inset: 0; z-index: 800; background: #0e0f24bb; display: none; align-items: flex-end; justify-content: center; }
    .modal-bg.open { display: flex; }
    @media (min-width: 700px) { .modal-bg { align-items: center; } }
    .modal-bg .folha { transform: none; animation: subir .4s cubic-bezier(.2, .9, .3, 1.1); }
    @keyframes subir { from { transform: translateY(60%); } to { transform: none; } }
    .modal-body { padding: 14px 14px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
    .modal-body p { margin: 0; color: var(--muted) !important; }
    .wpp-code-box { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px; border: 2.5px dashed var(--ink); border-radius: 12px; background: var(--paper); }
    .wpp-code { font: 400 28px/1 var(--dela); letter-spacing: .12em; }
    .wpp-code.expired { opacity: .4; text-decoration: line-through; }
    .wpp-timer { font: 700 12px var(--mono); color: var(--muted); }
    .btn-wpp, .btn-desvincular { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 3px solid var(--ink); border-radius: 12px;
      font: 400 15px var(--dela); box-shadow: 4px 4px 0 var(--ink); cursor: pointer; background: #25d366; color: var(--ink); }
    .bwpp-gerar { background: var(--yellow); }
    .btn-desvincular { background: var(--paper); color: #c1361a; }
    .wpp-instrucao { font-size: 11px; text-align: center; }
    .wpp-connected-state { display: grid; justify-items: center; gap: 4px; text-align: center; }
    .wpp-c-ico { width: 56px; height: 56px; border-radius: 16px; border: 3px solid var(--ink); background: #25d366; display: grid; place-items: center; font-size: 28px; box-shadow: 3px 3px 0 var(--ink); }
    .wpp-c-title { font: 400 17px var(--dela); }
    .wpp-c-num { font: 700 13px var(--mono); color: var(--muted); }
  </style>
</head>
<body>
<div id="ceu" aria-hidden="true"></div>
<div id="grao" aria-hidden="true"></div>

<div class="pagina">
  <header class="topo">
    <a class="ico-btn" href="/funcionario/index.html" title="Início"><i class="fas fa-home"></i></a>
    <h1>Meu perfil</h1>
  </header>

  <section class="cartao cracha">
    <div class="cracha-faixa"></div>
    <div class="cracha-corpo">
      <div class="foto" id="avatarCircle"><span id="avatarInitial">?</span>
        <label for="fotoInput" title="Trocar foto"><i class="fas fa-camera"></i></label>
      </div>
      <input type="file" id="fotoInput" accept="image/*">
      <h2 id="perfilNome">Carregando...</h2>
      <span class="cargo" id="cargoBadge" style="display:none"><span id="cargoNome">—</span></span>
      <span class="email" id="perfilEmail"></span>
      <p class="dica">Toque na câmera para trocar a foto (fica só neste aparelho)</p>
    </div>
  </section>

  <p class="sec-tit">Integrações</p>
  <section class="cartao zap">
    <span class="ic"><i class="fab fa-whatsapp"></i></span>
    <span class="t"><b>WhatsApp com a Lina</b><span id="zapNum">receba avisos e consulte pelo chat</span><span class="estado-zap" id="zapEstado" hidden>conectado</span></span>
    <span id="wppCardBody"><button class="btn verde-zap" onclick="abrirModalWpp()">Conectar</button></span>
  </section>

  <p class="sec-tit">Segurança</p>
  <section class="cartao form">
    <h3><i class="fas fa-key"></i> Trocar senha</h3>
    <div class="campo"><label>Senha atual</label><div class="senha"><input class="entrada" type="password" id="senhaAtual" placeholder="Sua senha atual" autocomplete="current-password"><button type="button" title="Mostrar" onclick="toggleVisibility('senhaAtual', this)"><i class="fas fa-eye"></i></button></div></div>
    <div class="campo"><label>Nova senha</label><div class="senha"><input class="entrada" type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" oninput="conferirSenha()"><button type="button" title="Mostrar" onclick="toggleVisibility('novaSenha', this)"><i class="fas fa-eye"></i></button></div>
      <div class="forca" id="forca"><i></i><i></i><i></i><i></i></div><span class="forca-rot" id="forcaRot">&nbsp;</span></div>
    <div class="campo"><label>Confirmar nova senha</label><div class="senha"><input class="entrada" type="password" id="confirmarSenha" placeholder="Repita a nova senha" autocomplete="new-password" oninput="conferirSenha()"><button type="button" title="Mostrar" onclick="toggleVisibility('confirmarSenha', this)"><i class="fas fa-eye"></i></button></div><span class="confere" id="confere">&nbsp;</span></div>
    <button class="btn" style="background: var(--orange); color: var(--cream)" id="btnAlterarSenha" onclick="alterarSenha()"><i class="fas fa-lock"></i> Salvar nova senha</button>
  </section>

  <button class="btn sair" onclick="sairDaConta()"><i class="fas fa-right-from-bracket"></i> Sair da conta</button>
</div>

<!-- WhatsApp -->
<div class="modal-bg" id="wppModal" onclick="fecharModalWpp(event)">
  <div class="folha" style="--sc: #25d366" role="dialog" aria-label="WhatsApp">
    <div class="folha-cab"><h3>WhatsApp com a Lina<small>avisos e consultas pelo chat</small></h3><button class="fechar" onclick="fecharModalWpp()"><i class="fas fa-times"></i></button></div>
    <div class="modal-body" id="wppModalBody"></div>
  </div>
</div>

  <script src="../api.js"></script>
  <script>
    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '../login.html';
        return;
      }

      await carregarPerfil();
      configurarFoto();
      checarStatusWpp();
    });

    // ===== CARREGAR PERFIL =====
    async function carregarPerfil() {
      // Exibe dados do localStorage imediatamente
      const nomeLocal = localStorage.getItem('usuarioNome') || '';
      if (nomeLocal) {
        document.getElementById('perfilNome').textContent = nomeLocal;
        document.getElementById('avatarInitial').textContent = nomeLocal.charAt(0).toUpperCase();
      }

      // Restaura foto salva localmente
      const fotoSalva = localStorage.getItem('fotoPerfil');
      if (fotoSalva) aplicarFoto(fotoSalva);

      // Busca dados atualizados do servidor (cargo, email)
      try {
        const perfil = await window.api.getMeuPerfil();

        document.getElementById('perfilNome').textContent = perfil.nome;
        document.getElementById('avatarInitial').textContent = perfil.nome.charAt(0).toUpperCase();

        if (perfil.email) {
          document.getElementById('perfilEmail').textContent = perfil.email;
        }

        if (perfil.cargo) {
          document.getElementById('cargoNome').textContent = perfil.cargo;
          document.getElementById('cargoBadge').style.display = 'inline-flex';
        }
      } catch {
        // Silencioso — dados do localStorage já exibidos
      }
    }

    // ===== FOTO DE PERFIL (armazenada localmente) =====
    function configurarFoto() {
      document.getElementById('fotoInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 3 * 1024 * 1024) {
          showToast('Foto muito grande. Máximo 3 MB.', 'error');
          return;
        }

        const reader = new FileReader();
        reader.onload = (ev) => {
          aplicarFoto(ev.target.result);
          localStorage.setItem('fotoPerfil', ev.target.result);
          showToast('Foto atualizada!', 'success');
        };
        reader.readAsDataURL(file);
      });
    }

    function aplicarFoto(dataUrl) {
      const circle = document.getElementById('avatarCircle');
      let img = circle.querySelector('img');
      if (!img) {
        img = document.createElement('img');
        img.alt = 'Foto de perfil';
        circle.appendChild(img);
      }
      img.src = dataUrl;
      document.getElementById('avatarInitial').style.display = 'none';
    }

    // ===== ALTERAR SENHA =====
    async function alterarSenha() {
      const senhaAtual  = document.getElementById('senhaAtual').value.trim();
      const novaSenha   = document.getElementById('novaSenha').value;
      const confirmar   = document.getElementById('confirmarSenha').value;

      if (!senhaAtual || !novaSenha || !confirmar) {
        showToast('Preencha todos os campos.', 'error');
        return;
      }
      if (novaSenha.length < 6) {
        showToast('A nova senha deve ter ao menos 6 caracteres.', 'error');
        return;
      }
      if (novaSenha !== confirmar) {
        showToast('As senhas não coincidem.', 'error');
        return;
      }

      const btn = document.getElementById('btnAlterarSenha');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Aguarde...';

      try {
        await window.api.changePassword({ senhaAtual, novaSenha });
        showToast('Senha alterada com sucesso!', 'success');
        document.getElementById('senhaAtual').value = '';
        document.getElementById('novaSenha').value = '';
        document.getElementById('confirmarSenha').value = '';
      } catch (err) {
        showToast(err?.message || 'Erro ao alterar senha.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-lock"></i> Salvar nova senha';
        conferirSenha();
      }
    }

    // ===== WHATSAPP =====
    let wppTimer = null;

    function formatTelefone(telefone) {
      if (!telefone) return '-';
      const d = telefone.replace(/\D/g, '');
      if (d.length >= 12) return `+${d.slice(0,2)} (${d.slice(2,4)}) ${d.slice(4,9)}-${d.slice(9)}`;
      if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
      return telefone;
    }

    async function checarStatusWpp() {
      try {
        const status = await fetchApi('/whatsapp/me/wpp/status');
        if (status.conectado) renderWppCardConectado(status.telefone);
      } catch {
        // mantém botão de conectar
      }
    }

    function renderWppCardConectado(telefone) {
      document.getElementById('zapNum').textContent = formatTelefone(telefone);
      document.getElementById('zapEstado').hidden = false;
      document.getElementById('wppCardBody').innerHTML = `<button class="btn" onclick="abrirModalWpp()">Ver</button>`;
    }

    async function abrirModalWpp() {
      const body = document.getElementById('wppModalBody');
      body.innerHTML = `<p style="text-align:center;color:var(--muted);font-size:13px">Carregando...</p>`;
      document.getElementById('wppModal').classList.add('open');

      try {
        const status = await fetchApi('/whatsapp/me/wpp/status');
        if (status.conectado) {
          renderModalWpp({ conectado: true, numero: formatTelefone(status.telefone) });
          return;
        }

        const { code, expiresInSeconds, botNumero } = await fetchApi('/whatsapp/me/wpp/pin', { method: 'POST' });
        const expiraEm = Date.now() + expiresInSeconds * 1000;
        renderModalWpp({ codigo: code, expiraEm, botNumero, conectado: false, numero: null });
      } catch {
        body.innerHTML = `
          <p style="font-size:13px;color:var(--muted);margin-bottom:16px">Não foi possível gerar o código. Tente novamente.</p>
          <button class="btn-wpp bwpp-gerar" onclick="abrirModalWpp()"><i class="fas fa-rotate-right"></i> Tentar novamente</button>`;
      }
    }

    function renderModalWpp({ codigo, expiraEm, botNumero, conectado, numero }) {
      const body = document.getElementById('wppModalBody');
      if (conectado) {
        body.innerHTML = `
          <div class="wpp-connected-state">
            <div class="wpp-c-ico"><i class="fab fa-whatsapp"></i></div>
            <div class="wpp-c-title">WhatsApp conectado!</div>
            <div class="wpp-c-num">${numero}</div>
          </div>
          <p style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:14px;line-height:1.5">
            Você receberá notificações e pode fazer consultas pelo WhatsApp conforme suas permissões.
          </p>
          <button class="btn-desvincular" onclick="desvincularWpp()">Desvincular número</button>`;
        return;
      }

      const expirado = expiraEm && expiraEm < Date.now();
      const url = botNumero ? `https://wa.me/55${botNumero}?text=${codigo}` : `https://wa.me/?text=${codigo}`;

      body.innerHTML = `
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5">
          Toque em <strong>"Abrir WhatsApp"</strong> — a mensagem já vem preenchida, só apertar enviar.
        </p>
        <div class="wpp-code-box${expirado ? ' expired' : ''}">
          <div class="wpp-code${expirado ? ' expired' : ''}">${codigo}</div>
          ${expiraEm && !expirado
            ? `<div class="wpp-timer" id="wppCountdown"><i class="fas fa-clock"></i> —</div>`
            : expirado
            ? `<span style="font-size:11px;font-weight:700;color:#ef4444">Expirado</span>`
            : ''}
        </div>
        ${!expirado
          ? `<button class="btn-wpp bwpp-conectar" onclick="window.open('${url}','_blank')">
               <i class="fab fa-whatsapp"></i> Abrir WhatsApp
             </button>`
          : `<button class="btn-wpp bwpp-gerar" onclick="abrirModalWpp()">
               <i class="fas fa-rotate-right"></i> Gerar novo código
             </button>`}
        <p class="wpp-instrucao">Código válido por 5 minutos. O bot confirma automaticamente.</p>`;

      if (expiraEm && !expirado) iniciarCountdown(expiraEm);
    }

    async function desvincularWpp() {
      if (!confirm('Deseja desvincular seu número do WhatsApp?')) return;
      try {
        await fetchApi('/whatsapp/me/wpp/desvincular', { method: 'POST' });
        fecharModalWpp();
        document.getElementById('zapNum').textContent = 'receba avisos e consulte pelo chat';
        document.getElementById('zapEstado').hidden = true;
        document.getElementById('wppCardBody').innerHTML = `<button class="btn verde-zap" onclick="abrirModalWpp()">Conectar</button>`;
        showToast('WhatsApp desvinculado', 'success');
      } catch {
        showToast('Erro ao desvincular. Tente novamente.', 'error');
      }
    }

    function iniciarCountdown(expiraEm) {
      clearInterval(wppTimer);
      wppTimer = setInterval(() => {
        const el = document.getElementById('wppCountdown');
        if (!el) { clearInterval(wppTimer); return; }
        const diff = expiraEm - Date.now();
        if (diff <= 0) { clearInterval(wppTimer); abrirModalWpp(); return; }
        const m = Math.floor(diff / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.innerHTML = `<i class="fas fa-clock"></i> ${m}:${String(s).padStart(2,'0')}`;
      }, 1000);
    }

    function fecharModalWpp(e) {
      if (e && e.target !== document.getElementById('wppModal')) return;
      document.getElementById('wppModal').classList.remove('open');
      clearInterval(wppTimer);
    }

    // Força da senha e conferência ao vivo (só aviso visual; a validação continua em alterarSenha)
    function conferirSenha() {
      const v = document.getElementById('novaSenha').value, c = document.getElementById('confirmarSenha').value;
      const n = !v ? 0 : v.length < 6 ? 1 : (/\d/.test(v) && /[a-z]/i.test(v) ? (v.length >= 10 ? 4 : 3) : 2);
      const cores = ['', 'var(--red)', 'var(--orange)', 'var(--yellow)', 'var(--green)'];
      document.querySelectorAll('#forca i').forEach((x, k) => { x.classList.toggle('on', k < n); x.style.setProperty('--c', cores[n]); });
      document.getElementById('forcaRot').textContent = ['\u00a0', 'curta demais', 'fraca', 'boa', 'forte'][n];
      document.getElementById('confere').innerHTML = !c ? '&nbsp;' : c === v ? '<span style="color: #1a7d45">✓ as duas batem</span>' : '<span style="color: #c1361a">✗ não está igual</span>';
    }

    function sairDaConta() {
      if (!confirm('Tem certeza que deseja sair?')) return;
      if (typeof clearSession === 'function') clearSession(); else localStorage.clear();
      window.location.href = '/login.html';
    }

    // ===== TOGGLE SENHA ====-
    function toggleVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon  = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    // ===== TOAST =====
    function showToast(message, type = 'success') {
      const existing = document.getElementById('_toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.id = '_toast';
      toast.className = `toast toast-${type}`;
      const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
      toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
      document.body.appendChild(toast);

      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
  <script src="/funcionario/decola-base.js"></script>
</body>
</html>
