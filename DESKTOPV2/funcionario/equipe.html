<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b1e3f">
  <title>Equipe — Lina X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/funcionario/decola-base.css">
  <style>
    /* Visual Decola (aprovado em 04/11/2026). Backup do visual antigo: tag git design-classico-2026-11-05 */
    .pagina { max-width: 860px; padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: 120px; }
    .topo { display: flex; align-items: center; gap: 10px; }
    .topo-tit { flex: 1; min-width: 0; }
    .topo-tit h1 { margin: 0; font: 400 clamp(24px, 6vw, 34px)/1 var(--dela); text-shadow: 3px 3px 0 var(--lina); }
    .topo-tit p { margin: 4px 0 0; font-size: 11px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agora { display: flex; gap: 8px; margin: 16px 0 14px; flex-wrap: wrap; align-items: center; }
    .agora .chip { padding: 4px 11px 4px 5px; font-size: 12px; cursor: default; }
    .mostrar-inativos { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font: 700 11px var(--mono); cursor: pointer; }
    .mostrar-inativos input { accent-color: var(--yellow); }
    .lista { display: grid; gap: 14px; }
    @media (min-width: 720px) { .lista { grid-template-columns: 1fr 1fr; } }
    .lav { display: grid; gap: 10px; --sc: var(--c); }
    .lav.inativo { opacity: .6; --sc: #9a96a8; }
    .lav-topo { display: flex; align-items: center; gap: 12px; }
    .av { position: relative; width: 50px; height: 50px; border-radius: 50%; border: 3px solid var(--ink); background: var(--c); color: var(--cream); display: grid; place-items: center; font: 400 20px var(--dela); flex: none; }
    .av::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--cream); background: var(--st); }
    .lav-topo .t { flex: 1; min-width: 0; }
    .lav-topo .t b { display: block; font: 400 17px/1.1 var(--dela); overflow-wrap: anywhere; }
    .situ { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; padding: 2px 8px; border-radius: 999px; border: 2px solid var(--ink); background: var(--sb); font: 700 10px var(--mono); color: var(--ink); }
    .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); }
    .nums div { padding: 6px 4px; text-align: center; min-width: 0; }
    .nums div + div { border-left: 2px dashed var(--line); }
    .nums b { display: block; font: 400 16px/1.1 var(--dela); white-space: nowrap; }
    .nums small { font: 700 9px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .lav-pe { display: flex; align-items: center; gap: 8px; }
    .lav-pe .link-st { flex: 1; min-width: 0; font-size: 11px; color: var(--muted); }
    .lav-pe .link-st b { color: var(--ink); }
    .lav-pe .link-st.sem b { color: #c1361a; }
    .lav-pe .btn { padding: 7px 11px; font-size: 12px; box-shadow: 2px 2px 0 var(--ink); flex: none; }
    .vazio { text-align: center; padding: 26px 16px; --sc: var(--yellow); }
    .vazio .ic { font-size: 28px; }
    .vazio b { display: block; font: 400 17px var(--dela); margin: 6px 0 4px; }
    .vazio p { margin: 0; font-size: 12px; color: var(--muted); }
    .carregando { display: grid; justify-items: center; gap: 10px; padding: 34px 0; font: 700 12px var(--mono); }
    .carregando i { width: 30px; height: 30px; border: 3px solid var(--cream); border-top-color: transparent; border-radius: 50%; animation: girar .7s linear infinite; }

    /* janela do link do portal */
    .sheet-backdrop { position: fixed; inset: 0; z-index: 800; background: #0e0f24bb; opacity: 0; pointer-events: none; transition: opacity .25s; }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .bottom-sheet { position: fixed; z-index: 810; left: 0; right: 0; bottom: 0; margin: 0 auto; width: 100%; max-width: 560px; max-height: 90vh; overflow: auto;
      background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-bottom: 0; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 0 var(--blue);
      transform: translateY(105%); transition: transform .45s cubic-bezier(.2, .9, .3, 1.1); }
    .bottom-sheet.open { transform: none; }
    .sheet-handle { width: 44px; height: 5px; background: var(--ink); opacity: .25; border-radius: 3px; margin: 10px auto 0; }
    .sheet-cab { display: flex; align-items: center; gap: 10px; padding: 8px 14px 12px; border-bottom: 3px solid var(--ink); }
    .sheet-cab > div { flex: 1; min-width: 0; }
    .sheet-title { font: 400 17px/1.1 var(--dela); }
    .sheet-sub { margin-top: 3px; font: 700 11px var(--mono); color: var(--muted); }
    .sheet-corpo { padding: 14px 14px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
    .existing-link { display: none; gap: 8px; padding: 10px; border: 2.5px solid var(--ink); border-radius: 12px; background: #e2f4e8; }
    .existing-link.visible { display: grid; }
    .existing-link-lbl { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #1a7d45; }
    .existing-link-url { display: block; padding: 7px 9px; border: 2px dashed var(--ink); border-radius: 8px; background: var(--paper); font: 700 11px var(--mono); overflow-wrap: anywhere; user-select: all; }
    .btn-copy-existing { justify-self: end; padding: 6px 12px; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--cream); color: var(--ink); font: 400 13px var(--dela); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; }
    .rot { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .duration-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .dur-opt { padding: 10px 6px; border: 2.5px solid var(--ink); border-radius: 12px; background: var(--paper); color: var(--ink); font: 400 15px var(--dela); cursor: pointer; }
    .dur-opt.sel { background: var(--blue); color: var(--cream); box-shadow: 3px 3px 0 var(--ink); }
    .dur-opt[data-val="permanent"] { border-style: dashed; }
    .dur-opt[data-val="permanent"].sel { border-style: solid; background: var(--orange); }
    .dur-warn { display: none; padding: 7px 10px; border: 2px solid var(--ink); border-radius: 10px; background: var(--yellow); font: 700 11px var(--mono); }
    .dur-warn.visible { display: block; }
    .btn-generate { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: 3px solid var(--ink); border-radius: 12px;
      background: var(--blue); color: var(--cream); font: 400 15px var(--dela); box-shadow: 4px 4px 0 var(--ink); cursor: pointer; }
    .btn-generate:disabled { opacity: .6; }
  </style>
</head>
<body>
<div id="ceu" aria-hidden="true"></div>
<div id="grao" aria-hidden="true"></div>

<div class="pagina">
  <header class="topo">
    <a class="ico-btn" href="/funcionario/index.html" title="Início"><i class="fas fa-home"></i></a>
    <div class="topo-tit"><h1>Equipe</h1><p id="empresaNome">Carregando...</p></div>
  </header>
  <div class="agora">
    <span id="teamCount" style="display:contents"></span>
    <label class="mostrar-inativos"><input type="checkbox" id="toggleInativosEquipe" onchange="loadFuncionarios()"> mostrar inativos</label>
  </div>
  <div class="lista" id="content"></div>
</div>

<nav id="mobileNav"></nav>
<div id="menu"></div>

<!-- link de acesso ao portal -->
<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeTokenModal()"></div>
<div class="bottom-sheet" id="tokenSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-cab">
    <div><div class="sheet-title" id="sheetTitle">Link de acesso</div><div class="sheet-sub" id="sheetSub">o lavador vê as ordens e a comissão dele</div></div>
    <button class="fechar" onclick="closeTokenModal()"><i class="fas fa-times"></i></button>
  </div>
  <div class="sheet-corpo">
    <div class="existing-link" id="existingLinkBox">
      <div class="existing-link-lbl"><i class="fas fa-check-circle"></i> Link ativo</div>
      <code class="existing-link-url" id="existingLinkUrl"></code>
      <button class="btn-copy-existing" onclick="copyExistingLink()"><i class="fas fa-copy"></i> Copiar link ativo</button>
    </div>
    <span class="rot">Gerar novo link</span>
    <div class="duration-grid">
      <button class="dur-opt sel" data-val="24" onclick="selectDuration(this)">24 horas</button>
      <button class="dur-opt" data-val="48" onclick="selectDuration(this)">48 horas</button>
      <button class="dur-opt" data-val="72" onclick="selectDuration(this)">72 horas</button>
      <button class="dur-opt" data-val="168" onclick="selectDuration(this)">1 semana</button>
      <button class="dur-opt" data-val="permanent" onclick="selectDuration(this)" style="grid-column:1/-1">🔓 Link permanente</button>
    </div>
    <div class="dur-warn" id="durWarn">⚠️ Links permanentes nunca expiram. Use só para quem é fixo.</div>
    <button class="btn-generate" id="btnGenerate" onclick="generateToken()"><i class="fas fa-link"></i> Gerar link</button>
  </div>
</div>

  <script src="../api.js"></script>
  <script src="utils.js"></script>
  <script>
    const PAGE_ACTIVE = 'funcionarios';

    const AVATAR_COLORS = ['#2f62e6', '#6b4fd8', '#c2418f', '#ff5b2e', '#22a15a', '#0d9488', '#d4a017', '#e5383b'];

    function avatarColor(name) {
      return AVATAR_COLORS[(name || '').charCodeAt(0) % AVATAR_COLORS.length];
    }
    function avatarInitial(name) {
      return (name || '?').charAt(0).toUpperCase();
    }
    function formatCompact(val) {
      if (!val || val === 0) return 'R$0';
      if (val >= 1000) return 'R$' + (val / 1000).toFixed(1).replace('.', ',') + 'k';
      return 'R$' + Math.round(val);
    }

    // ── INIT ──────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      if (!validateFuncionarioAccess()) return;

      const permissoes = JSON.parse(localStorage.getItem('permissoes') || '[]');
      if (!permissoes.includes('gerenciar_funcionarios')) {
        showToast('Sem permissão para visualizar funcionários', 'error');
        setTimeout(() => navigateTo('index.html'), 1500);
        return;
      }

      document.getElementById('menu').innerHTML    = createFuncionarioMenu();
      document.getElementById('mobileNav').innerHTML = createMobileNav(PAGE_ACTIVE);

      await loadUserInfo();
      await loadFuncionarios();
    });

    // ── LOAD ──────────────────────────────────────────
    async function loadFuncionarios() {
      const content  = document.getElementById('content');
      const countEl  = document.getElementById('teamCount');
      content.innerHTML = '<div class="carregando" style="grid-column:1/-1"><i></i>Carregando...</div>';

      try {
        const response     = await window.api.getLavadores();
        const todos        = response.lavadores || [];

        // Inativos ocultos por padrão (soft-delete); toggle revela para reativar
        const mostrarInativos = document.getElementById('toggleInativosEquipe')?.checked;
        const funcionarios = mostrarInativos ? todos : todos.filter(f => f.ativo);
        const inativosOcultos = todos.length - funcionarios.length;
        const ativos = todos.filter(f => f.ativo).length;
        countEl.innerHTML = `<span class="chip" style="--sc: var(--green)"><b>${ativos}</b>ativo${ativos !== 1 ? 's' : ''}</span>`
          + (todos.length - ativos ? `<span class="chip" style="--sc: #9a96a8"><b>${todos.length - ativos}</b>inativo${todos.length - ativos !== 1 ? 's' : ''}</span>` : '');

        if (funcionarios.length === 0) {
          content.innerHTML = `
            <section class="cartao vazio" style="grid-column:1/-1">
              <div class="ic">👷</div>
              <b>${todos.length === 0 ? 'Nenhum funcionário' : 'Nenhum funcionário ativo'}</b>
              <p>${todos.length === 0 ? 'Não há funcionários cadastrados no momento.' : `${inativosOcultos} inativo(s) oculto(s) — marque "mostrar inativos".`}</p>
            </section>`;
          return;
        }

        content.innerHTML = funcionarios.map(f => {
          const comissaoMes = f.comissaoMesAtual || 0;
          const ordensMes   = f.ordensMesAtual   || 0;
          const safeName    = (f.nome || '').replace(/'/g, "\\'");
          const cor         = avatarColor(f.nome || '');
          // situação do link do portal (tokens já vêm na lista)
          const token = (f.tokens || []).find(t => t.ativo === true);
          const vencido = token && token.expiraEm && new Date(token.expiraEm).getTime() < Date.now();
          const linkTxt = !token || vencido ? 'sem link ativo'
            : token.expiraEm === null ? 'permanente'
            : 'até ' + new Date(token.expiraEm).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
          const semLink = !token || vencido;

          return `
            <article class="cartao lav${f.ativo ? '' : ' inativo'}" style="--c: ${cor}; --st: ${f.ativo ? 'var(--green)' : '#9a96a8'}; --sb: ${f.ativo ? '#dff5e6' : '#ece8dd'}">
              <div class="lav-topo">
                <span class="av">${avatarInitial(f.nome)}</span>
                <span class="t"><b>${escapeHtml(f.nome || 'Sem nome')}</b><span class="situ">${f.ativo ? 'ativo' : 'inativo'}</span></span>
              </div>
              <div class="nums">
                <div><b>${f.comissao || 0}%</b><small>comissão</small></div>
                <div><b>${ordensMes}</b><small>ordens/mês</small></div>
                <div><b>${formatCompact(comissaoMes)}</b><small>ganho/mês</small></div>
              </div>
              ${f.ativo ? `
              <div class="lav-pe">
                <span class="link-st${semLink ? ' sem' : ''}"><i class="fas fa-link"></i> Portal: <b>${linkTxt}</b></span>
                <button class="btn${semLink ? ' azul' : ''}" onclick="openTokenModal('${f.id}','${safeName}')">${semLink ? 'Gerar link' : 'Ver link'}</button>
              </div>` : ''}
            </article>`;
        }).join('');

      } catch (err) {
        console.error(err);
        countEl.innerHTML = '';
        content.innerHTML = `
          <section class="cartao vazio" style="grid-column:1/-1">
            <div class="ic">⚠️</div>
            <b>Erro ao carregar</b>
            <p>Tente novamente em alguns segundos.</p>
            <button class="btn azul" style="margin-top:12px" onclick="loadFuncionarios()"><i class="fas fa-redo"></i> Tentar novamente</button>
          </section>`;
      }
    }

    // ── TOKEN MODAL ───────────────────────────────────
    let currentLavadorId = null;
    let selectedDuration = '24';
    let existingLinkUrl  = null;

    function openTokenModal(lavadorId, lavadorNome) {
      currentLavadorId = lavadorId;
      selectedDuration = '24';
      existingLinkUrl  = null;

      document.getElementById('sheetTitle').textContent = lavadorNome;
      document.getElementById('sheetSub').textContent   = 'o lavador vê as ordens e a comissão dele';
      document.getElementById('existingLinkBox').classList.remove('visible');
      document.getElementById('durWarn').classList.remove('visible');

      document.querySelectorAll('.dur-opt').forEach(b => b.classList.remove('sel'));
      document.querySelector('.dur-opt[data-val="24"]').classList.add('sel');

      document.getElementById('sheetBackdrop').classList.add('open');
      document.getElementById('tokenSheet').classList.add('open');

      loadExistingTokens(lavadorId);
    }

    function closeTokenModal() {
      document.getElementById('sheetBackdrop').classList.remove('open');
      document.getElementById('tokenSheet').classList.remove('open');
      currentLavadorId = null;
    }

    async function loadExistingTokens(lavadorId) {
      try {
        const response = await window.api.getLavadores();
        const lavador  = (response.lavadores || []).find(l => l.id === lavadorId);
        if (!lavador?.tokens?.length) return;

        const tokenAtivo = lavador.tokens.find(t => t.ativo === true);
        if (!tokenAtivo) return;

        existingLinkUrl = `${window.location.origin}/lavador-publico.html?token=${tokenAtivo.token}`;

        const expiraMsg = tokenAtivo.expiraEm === null
          ? 'Permanente — nunca expira'
          : `Expira em ${new Date(tokenAtivo.expiraEm).toLocaleDateString('pt-BR')}`;

        document.getElementById('existingLinkUrl').textContent = existingLinkUrl;
        document.getElementById('existingLinkBox').classList.add('visible');
        document.getElementById('sheetSub').textContent = expiraMsg;
      } catch (err) {
        console.error(err);
      }
    }

    function copyExistingLink() {
      if (!existingLinkUrl) return;
      navigator.clipboard.writeText(existingLinkUrl)
        .then(() => { showToast('Link copiado!', 'success'); closeTokenModal(); })
        .catch(() =>   showToast('Erro ao copiar', 'error'));
    }

    function selectDuration(btn) {
      document.querySelectorAll('.dur-opt').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      selectedDuration = btn.dataset.val;
      document.getElementById('durWarn').classList.toggle('visible', selectedDuration === 'permanent');
    }

    async function generateToken() {
      if (!currentLavadorId) return;
      const btn = document.getElementById('btnGenerate');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Gerando...';

      try {
        const response = await window.api.gerarTokenLavador(currentLavadorId, selectedDuration);
        const link = `${window.location.origin}/lavador-publico.html?token=${response.token}`;
        await navigator.clipboard.writeText(link).catch(() => {});

        const msg = selectedDuration === 'permanent'
          ? 'Link permanente copiado!'
          : `Link copiado! Válido por ${selectedDuration}h`;
        showToast(msg, 'success');
        closeTokenModal();
        loadFuncionarios();
      } catch (err) {
        console.error(err);
        showToast('Erro ao gerar link. Tente novamente.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-link"></i> Gerar link';
      }
    }
  </script>
  <script src="/funcionario/decola-base.js"></script>
</body>
</html>
