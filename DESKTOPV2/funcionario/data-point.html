<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b1e3f">
  <title>Data Point — Lina X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/funcionario/decola-base.css">
  <style>
    /* Visual Decola (aprovado em 04/11/2026). Backup do visual antigo: tag git design-classico-2026-11-05 */
    .pagina { max-width: 760px; padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: 120px; }
    .topo { display: flex; align-items: center; gap: 10px; }
    .topo-tit { flex: 1; min-width: 0; }
    .topo-tit h1 { margin: 0; font: 400 clamp(24px, 6vw, 34px)/1 var(--dela); text-shadow: 3px 3px 0 var(--lina); }
    .topo-tit p { margin: 4px 0 0; font-size: 11px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .relogio { text-align: right; font: 700 10px var(--mono); opacity: .85; flex: none; }
    .relogio b { display: block; font: 400 22px/1 var(--dela); color: var(--yellow); }

    .resumo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 16px 0; }
    .res { padding: 8px 4px 6px; border: 2.5px solid var(--ink); border-radius: 12px; background: var(--paper); color: var(--ink); text-align: center; box-shadow: 3px 3px 0 var(--c); cursor: pointer; min-width: 0; }
    .res b { display: block; font: 400 22px/1 var(--dela); }
    .res span { display: block; margin-top: 3px; font: 700 9px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .res.on { background: var(--c); } .res.on span { color: var(--ink); }
    .lista { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
    @media (min-width: 720px) { .lista { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .pessoa { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; cursor: pointer; --sc: var(--c); }
    .p-topo { display: flex; align-items: center; gap: 10px; }
    .av { width: 42px; height: 42px; border-radius: 12px; border: 2.5px solid var(--ink); background: var(--ca); color: var(--cream); display: grid; place-items: center; font: 400 17px var(--dela); flex: none; }
    .p-topo .t { flex: 1; min-width: 0; }
    .p-topo .t b { display: block; font: 400 15px/1.15 var(--dela); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-topo .t span { display: block; font-size: 11px; color: var(--muted); }
    .estado { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; border: 2px solid var(--ink); background: var(--c); color: var(--cf, var(--ink));
      font: 700 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
    .estado::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .estado.vivo::before { animation: piscar 1.4s ease-in-out infinite; }
    @keyframes piscar { 50% { opacity: .2; } }
    .horas { display: grid; gap: 4px; }
    .horas-topo { display: flex; justify-content: space-between; font: 700 11px var(--mono); }
    .horas-topo b { font: 400 14px var(--dela); }
    .horas-topo b span { font: 700 11px var(--mono); color: var(--muted); }
    .regua { position: relative; height: 14px; border: 2.5px solid var(--ink); border-radius: 999px; background: #e3d8bd; overflow: hidden; }
    .regua i { position: absolute; top: 0; bottom: 0; left: 0; width: var(--p); background: var(--c); border-right: 2.5px solid var(--ink); }
    .regua.vivo i { background: repeating-linear-gradient(-45deg, var(--c) 0 6px, color-mix(in srgb, var(--c) 70%, #fff) 6px 12px); animation: listras .9s linear infinite; }
    .horas small { display: flex; justify-content: space-between; font: 700 9px var(--mono); color: var(--muted); }
    .alerta-gps { font: 700 10px var(--mono); color: #c1361a; }
    .vazio { text-align: center; padding: 26px 16px; --sc: var(--yellow); grid-column: 1 / -1; }
    .vazio .ic { font-size: 28px; }
    .vazio b { display: block; font: 400 17px var(--dela); margin: 6px 0 4px; }
    .vazio p { margin: 0; font-size: 12px; color: var(--muted); }
    .carregando { display: grid; justify-items: center; gap: 10px; padding: 34px 0; font: 700 12px var(--mono); grid-column: 1 / -1; }
    .carregando i { width: 30px; height: 30px; border: 3px solid var(--cream); border-top-color: transparent; border-radius: 50%; animation: girar .7s linear infinite; }

    /* batidas do dia */
    .batidas { display: grid; padding-left: 6px; }
    .batida { position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 0 8px 18px; border-left: 3px solid var(--ink); font: 700 13px var(--mono); }
    .batida::before { content: ""; position: absolute; left: -9px; width: 15px; height: 15px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--c); }
    .batida b { font: 400 16px var(--dela); width: 52px; }
    .batida span { color: var(--muted); font-weight: 400; font-size: 12px; }
    .batida.agora { border-left-style: dashed; }
    .ok-jornada { padding: 8px 10px; border: 2px solid var(--ink); border-radius: 10px; background: #dff5e6; font-size: 12px; }
    .vazio-txt { margin: 0; text-align: center; font-size: 13px; }
  </style>
</head>
<body>
<div id="ceu" aria-hidden="true"></div>
<div id="grao" aria-hidden="true"></div>

<div class="pagina">
  <header class="topo">
    <a class="ico-btn" href="/funcionario/index.html" title="Início"><i class="fas fa-home"></i></a>
    <div class="topo-tit"><h1>Data Point</h1><p id="empresaNome">Carregando...</p></div>
    <div class="relogio">agora<b id="relogio">--:--</b></div>
  </header>
  <div class="resumo" id="resumoGrid" style="display:none"></div>
  <div class="lista" id="content"></div>
</div>

<nav id="mobileNav"></nav>
<div id="menu"></div>

<!-- batidas do dia -->
<div class="folha-fundo" id="folhaP"><div class="folha" id="folhaPDentro" role="dialog" aria-label="Batidas do dia"></div></div>

  <script src="../api.js"></script>
  <script src="utils.js"></script>
  <script>
    const PAGE_ACTIVE = 'data-point';

    // estado: rótulo, cor, cor do texto
    const DP_ESTADO = {
      DENTRO:    ['Dentro', 'var(--green)', 'var(--cream)'],
      FORA_TEMP: ['Pausa', 'var(--yellow)', 'var(--ink)'],
      ENCERROU:  ['Encerrou', '#9fc1ff', 'var(--ink)'],
      AUSENTE:   ['Ausente', 'var(--red)', 'var(--cream)'],
    };
    const CORES_AV = ['#2f62e6', '#22a15a', '#c2418f', '#ff5b2e', '#d08a00', '#6b4fd8', '#0d9488', '#e5383b'];
    let funcsCache = [];
    let filtroEstado = '';

    function hm(min) { min = Math.max(0, Math.round(min || 0)); return `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}`; }
    function corAv(id) { let h = 0; for (const c of String(id || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return CORES_AV[h % CORES_AV.length]; }
    function relogio() {
      const d = new Date();
      document.getElementById('relogio').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    // ── INIT ──────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      if (!validateFuncionarioAccess()) return;

      const permissoes = JSON.parse(localStorage.getItem('permissoes') || '[]');
      if (!permissoes.includes('ver_data_point_equipe')) {
        showToast('Sem permissão para visualizar o Data Point', 'error');
        setTimeout(() => navigateTo('/funcionario/index.html'), 1500);
        return;
      }

      document.getElementById('menu').innerHTML      = createFuncionarioMenu();
      document.getElementById('mobileNav').innerHTML  = createMobileNav(PAGE_ACTIVE);
      relogio(); setInterval(relogio, 30000);

      await loadUserInfo();
      await loadEquipe();
    });

    // ── LOAD ──────────────────────────────────────────
    async function loadEquipe() {
      const content = document.getElementById('content');
      const resumoEl = document.getElementById('resumoGrid');
      content.innerHTML = '<div class="carregando"><i></i>Carregando...</div>';
      resumoEl.style.display = 'none';

      try {
        const data = await window.api.getEquipeFuncionarioDp();
        funcsCache = data.funcionarios || [];
        const resumo = data.resumo || {};
        const contagem = { DENTRO: resumo.dentro ?? 0, FORA_TEMP: resumo.foratemp ?? 0, ENCERROU: resumo.encerrou ?? 0, AUSENTE: resumo.ausente ?? 0 };
        resumoEl.innerHTML = Object.entries(DP_ESTADO).map(([k, [rot, cor]]) =>
          `<button class="res${filtroEstado === k ? ' on' : ''}" style="--c: ${cor}" onclick="filtrarEstado('${k}')"><b>${contagem[k]}</b><span>${rot}</span></button>`).join('');
        resumoEl.style.display = 'grid';
        renderLista();
      } catch (err) {
        console.error(err);
        content.innerHTML = `
          <section class="cartao vazio">
            <div class="ic">⚠️</div>
            <b>Erro ao carregar</b>
            <p>Tente novamente em alguns segundos.</p>
            <button class="btn azul" style="margin-top:12px" onclick="loadEquipe()"><i class="fas fa-redo"></i> Tentar novamente</button>
          </section>`;
      }
    }

    function filtrarEstado(k) {
      filtroEstado = filtroEstado === k ? '' : k;
      document.querySelectorAll('#resumoGrid .res').forEach((b, i) => b.classList.toggle('on', Object.keys(DP_ESTADO)[i] === filtroEstado));
      renderLista();
    }

    function renderLista() {
      const content = document.getElementById('content');
      if (funcsCache.length === 0) {
        content.innerHTML = `
          <section class="cartao vazio">
            <div class="ic">🕒</div>
            <b>Nenhum funcionário no Data Point</b>
            <p>Ainda não há funcionários cadastrados no controle de ponto.</p>
          </section>`;
        return;
      }
      const lista = funcsCache.filter(f => !filtroEstado || f.estado === filtroEstado);
      if (!lista.length) {
        content.innerHTML = `<section class="cartao vazio"><div class="ic">👀</div><b>Ninguém nesse estado</b><p>Toque de novo no filtro para ver todos.</p></section>`;
        return;
      }
      content.innerHTML = lista.map(f => {
        const [rot, cor, corTxt] = DP_ESTADO[f.estado] || [f.estado, 'var(--paper)', 'var(--ink)'];
        const marcs = f.marcacoesHoje || [];
        const ultima = marcs[marcs.length - 1];
        const det = ultima ? `${ultima.tipo === 'ENTRADA' ? 'entrou' : 'saiu'} às ${ultima.horaFormatada}` : 'não bateu o ponto hoje';
        const carga = f.cargaEsperadaMin || 0;
        const pct = carga ? Math.min((f.minutosHoje || 0) / carga * 100, 100) : 0;
        const vivo = f.estado === 'DENTRO';
        return `
          <article class="cartao pessoa" style="--c: ${cor}; --cf: ${corTxt}; --ca: ${corAv(f.id)}" onclick="abrirBatidas('${f.id}')">
            <div class="p-topo">
              <span class="av">${escapeHtml((f.nome || '?').charAt(0).toUpperCase())}</span>
              <span class="t"><b>${escapeHtml(f.nome || '—')}${f.cargo ? ` · ${escapeHtml(f.cargo)}` : ''}</b><span>${det}</span></span>
              <span class="estado${vivo ? ' vivo' : ''}">${rot}</span>
            </div>
            <div class="horas">
              <div class="horas-topo"><span>horas hoje</span><b>${hm(f.minutosHoje)}${carga ? ` <span>/ ${hm(carga)}</span>` : ''}</b></div>
              ${carga ? `<div class="regua${vivo ? ' vivo' : ''}" style="--p: ${pct.toFixed(1)}%"><i></i></div><small><span>0h</span><span>${hm(carga / 2)}</span><span>${hm(carga)}</span></small>` : ''}
              ${f.gpsSuspeito ? '<span class="alerta-gps"><i class="fas fa-location-crosshairs"></i> GPS com precisão suspeita hoje</span>' : ''}
            </div>
          </article>`;
      }).join('');
    }

    // ── BATIDAS DO DIA ────────────────────────────────
    function abrirBatidas(id) {
      const f = funcsCache.find(x => x.id === id);
      if (!f) return;
      const [rot, cor] = DP_ESTADO[f.estado] || [f.estado, 'var(--blue)'];
      const marcs = f.marcacoesHoje || [];
      const carga = f.cargaEsperadaMin || 0;
      const dentro = f.estado === 'DENTRO';
      const agora = document.getElementById('relogio').textContent;
      const corpo = marcs.length ? `
        <div class="batidas">
          ${marcs.map(m => `<div class="batida" style="--c: ${m.tipo === 'ENTRADA' ? 'var(--green)' : 'var(--yellow)'}"><b>${m.horaFormatada}</b><span>${m.tipo === 'ENTRADA' ? 'Entrada' : 'Saída'}${m.foraDoRaio ? ` · a ${m.distanciaM}m da empresa` : ''}${m.canal === 'WHATSAPP' ? ' · pelo WhatsApp' : ''}</span></div>`).join('')}
          ${dentro ? `<div class="batida agora" style="--c: var(--paper)"><b>${agora}</b><span>agora · trabalhando</span></div>` : ''}
        </div>
        ${carga ? `<div class="ok-jornada"><b>${hm(f.minutosHoje)}</b> trabalhadas${(f.minutosHoje || 0) >= carga
          ? (f.minutosExtra ? ` · <b>${hm(f.minutosExtra)}</b> além da jornada de ${hm(carga)}` : ` · jornada de ${hm(carga)} completa`)
          : ` · faltam <b>${hm(carga - (f.minutosHoje || 0))}</b> para fechar a jornada de ${hm(carga)}`}</div>` : ''}`
        : '<p class="vazio-txt">Nenhuma batida hoje. Se for folga ou atestado, o dono registra no Data Point.</p>';
      const dentroFolha = document.getElementById('folhaPDentro');
      dentroFolha.style.setProperty('--sc', cor);
      dentroFolha.innerHTML = `
        <div class="folha-cab"><h3>${escapeHtml(f.nome || '—')}<small>batidas de hoje · ${rot.toLowerCase()}</small></h3><button class="fechar" data-fechar><i class="fas fa-times"></i></button></div>
        <div class="folha-corpo">${corpo}</div>`;
      Folha.abrir('folhaP');
    }
  </script>
  <script src="/funcionario/decola-base.js"></script>
</body>
</html>
