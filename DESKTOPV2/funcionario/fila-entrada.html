<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b1e3f">
    <title>Fila de Entrada — Lina X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/funcionario/decola-base.css">
    <script defer src="/vendor/alpinejs/cdn.min.js"></script>
    <style>
    /* Visual Decola (aprovado em 04/11/2026). Backup do visual antigo: tag git design-classico-2026-11-05 */
    [x-cloak] { display: none !important; }
    .pagina { max-width: 980px; padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: 140px; }
    .topo { display: flex; align-items: center; gap: 10px; }
    .topo-tit { flex: 1; min-width: 0; }
    .topo-tit h1 { margin: 0; font: 400 clamp(20px, 5.2vw, 34px)/1 var(--dela); text-shadow: 3px 3px 0 var(--lina); white-space: nowrap; }
    .topo-tit p { margin: 4px 0 0; font-size: 11px; opacity: .8; }
    .btn-linha { padding: 6px 8px; font-size: 12px; box-shadow: 3px 3px 0 var(--pink); gap: 4px; }
    .btn-linha.amarelo { background: var(--yellow); }

    /* aplicar a todas */
    .ferramentas { margin: 16px 0 14px; --sc: var(--yellow); display: grid; gap: 10px; }
    .ferr-linha { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
    .ferr-linha .campo { flex: 1 1 180px; }
    .ferr-linha .btn { padding: 9px 12px; font-size: 12px; box-shadow: 3px 3px 0 var(--ink); }
    .contagem { display: flex; align-items: center; gap: 10px; font: 700 12px var(--mono); }
    .contagem .tubo { flex: 1; height: 10px; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; background: #e3d8bd; }
    .contagem .tubo i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--green) 0 6px, #3fbf76 6px 12px); animation: listras .9s linear infinite; transition: width .4s; }
    .contagem.criando .tubo i { background: repeating-linear-gradient(-45deg, var(--blue) 0 6px, #4b7cf0 6px 12px); }
    select.entrada { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
      background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 26px; }

    /* ===== cartões da fila ===== */
    .fila { display: grid; gap: 14px; }
    @media (min-width: 760px) { .fila { grid-template-columns: 1fr 1fr; } }
    .carro { padding: 0; overflow: hidden; --sc: var(--st, var(--pink)); transition: box-shadow .3s; }
    .carro-topo { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 2px dashed var(--line); }
    .carro-topo .n { width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: var(--yellow); display: grid; place-items: center; font: 400 12px/1 var(--dela); flex: none; }
    .placa-campo { position: relative; flex: 1; min-width: 0; max-width: 190px; border: 2.5px solid var(--ink); border-radius: 7px; overflow: hidden; background: #fff; }
    .placa-campo::before { content: "BRASIL"; display: block; background: var(--blue); color: #fff; font: 700 7px/1 var(--mono); letter-spacing: .25em; padding: 2px 0; text-align: center; }
    .placa-campo input { width: 100%; border: 0; outline: none; background: none; text-align: center; text-transform: uppercase; font: 700 16px/1 var(--mono); letter-spacing: .04em; padding: 5px 2px 6px; color: var(--ink); }
    .placa-campo input::placeholder { color: #c9c3b2; }
    .cam { width: 40px; height: 40px; border-radius: 10px; border: 2.5px solid var(--ink); background: var(--orange); color: var(--cream); cursor: pointer; flex: none; box-shadow: 2px 2px 0 var(--ink); }
    .cam:disabled { opacity: .4; }
    .estado { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; border: 2px solid var(--ink);
      font: 700 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; background: var(--paper); flex: none; }
    .estado.pronta { background: var(--green); color: var(--cream); }
    .estado.falta { background: #fff3c4; }
    .estado.searching { background: #dfe6ff; }
    .estado.done { background: var(--ink); color: var(--green); }
    .estado.error { background: var(--red); color: var(--cream); }
    .tirar { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--ink); background: var(--paper); color: #c1361a; cursor: pointer; flex: none; }
    .carro-corpo { padding: 10px 12px 12px; display: grid; gap: 10px; }
    .quem { display: flex; align-items: center; gap: 10px; min-height: 34px; }
    .quem .av { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--ink); background: var(--pink); display: grid; place-items: center; font: 400 14px var(--dela); flex: none; }
    .quem .av.novo { background: var(--yellow); }
    .quem b { display: block; font: 400 14px/1.15 var(--dela); }
    .quem span span { display: block; font-size: 11px; color: var(--muted); }
    .quem .vazio { font-size: 12px; color: var(--muted); }
    .quem .erro { font: 700 12px var(--mono); color: #c1361a; }
    .gira { width: 14px; height: 14px; border: 2.5px solid var(--ink); border-top-color: transparent; border-radius: 50%; animation: girar .7s linear infinite; display: inline-block; vertical-align: -2px; }
    .novo-cli { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .novo-cli .entrada, .opcoes .entrada { padding: 7px 9px; font-size: 12px; }
    .novo-cli .entrada.falta { border-color: var(--orange); box-shadow: 2px 2px 0 var(--orange); }
    .opcoes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .opcoes .campo label { font-size: 9px; }
    .tipo-seg { display: flex; gap: 4px; }
    .tipo-seg button { flex: 1; padding: 6px 0; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper); color: var(--ink); cursor: pointer; font-size: 13px; }
    .tipo-seg button.on { background: var(--blue); color: var(--cream); }
    .tipo-seg button:disabled { opacity: .5; }
    .carro.done { opacity: .7; }
    .carro.done .carro-corpo { display: none; }
    .carro.done .carro-topo { border-bottom: 0; }
    .vazio-fila { text-align: center; padding: 26px 16px; --sc: var(--yellow); }
    .vazio-fila b { display: block; font: 400 18px var(--dela); margin: 6px 0; }

    /* rodapé fixo */
    .rodape-fila { position: fixed; z-index: 600; left: 0; right: 0; bottom: 0; background: var(--cream); color: var(--ink); border-top: 3px solid var(--ink); box-shadow: 0 -5px 0 var(--green);
      padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
    .rodape-dentro { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
    .rodape-dentro .resumo { flex: 1; min-width: 0; font: 700 12px var(--mono); }
    .rodape-dentro .resumo b { font: 400 20px var(--dela); }
    .rodape-dentro .resumo > span { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
    .btn-criar { padding: 12px 16px; font-size: 15px; }

    /* câmera */
    .folha-fundo { opacity: 1; pointer-events: auto; }
    .folha-fundo .folha { transform: none; animation: subir .45s cubic-bezier(.2, .9, .3, 1.1); }
    @keyframes subir { from { transform: translateY(60%); } to { transform: none; } }
    .camera { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; background: #0e0f24; }
    .camera video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .camera .guia { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .camera .guia i { width: 72%; aspect-ratio: 3.2 / 1; border: 3px dashed var(--yellow); border-radius: 10px; }
    .camera-erro { padding: 8px 10px; border: 2px solid var(--ink); border-radius: 10px; background: #ffd0cc; font: 700 12px var(--mono); }
    .folha-pe .btn { width: 100%; }

    /* avisos rápidos */
    #toast-container { position: fixed; z-index: 5000; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: center; width: max-content; max-width: 90vw; }
    .toast-item { background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); padding: 9px 14px 10px; font: 700 13px var(--mono); }
    .toast-item.success { background: var(--green); color: var(--cream); }
    .toast-item.error { background: var(--red); color: var(--cream); }
    .toast-item.info { background: var(--yellow); }
    </style>
</head>
<body x-data="filaEntrada()" x-init="init()">
<div id="ceu" aria-hidden="true"></div>
<div id="grao" aria-hidden="true"></div>

<div class="pagina">
    <header class="topo">
        <a class="ico-btn" href="/funcionario/ordens.html" title="Voltar"><i class="fas fa-arrow-left"></i></a>
        <div class="topo-tit"><h1>Fila de entrada</h1><p>vários carros de uma vez</p></div>
        <button class="btn btn-linha" @click="addRow()" :disabled="isCreating"><i class="fas fa-plus"></i> 1</button>
        <button class="btn btn-linha amarelo" @click="addMultipleRows()" :disabled="isCreating"><i class="fas fa-plus"></i> 5</button>
    </header>

    <section class="cartao ferramentas">
        <div class="ferr-linha">
            <div class="campo"><label>Aplicar a todas · serviço</label>
                <select class="entrada" x-model="globalServico" @change="applyServiceToAll()" style="padding: 8px 26px 8px 10px; font-size: 12px">
                    <option value="">Escolher…</option>
                    <template x-for="s in servicosAll" :key="s.id"><option :value="s.id" x-text="s.nome"></option></template>
                </select>
            </div>
            <button class="btn" @click="distribuirLavadores()" :disabled="lavadores.length === 0" style="background: var(--blue); color: var(--cream)"><i class="fas fa-shuffle"></i> Distribuir lavadores</button>
        </div>
        <!-- prontas antes de criar; durante a criação vira o progresso -->
        <div class="contagem" :class="{criando: isCreating}">
            <span x-text="isCreating ? `criando ${progressDone} de ${progressTotal}` : `${rowsReady} de ${rowsUsadas} prontas`"></span>
            <span class="tubo"><i :style="'width:' + (isCreating ? (progressTotal ? progressDone / progressTotal * 100 : 0) : (rowsUsadas ? rowsReady / rowsUsadas * 100 : 0)) + '%'"></i></span>
        </div>
    </section>

    <div class="fila">
        <section class="cartao vazio-fila" x-show="rows.length === 0" style="grid-column: 1 / -1">
            <div style="font-size: 30px">🚗🚙🚕</div>
            <b>Nenhum carro na fila</b>
            <p style="margin: 0 0 12px; font-size: 12px; color: var(--muted)">Toque em +5 para começar a registrar</p>
            <button class="btn" style="background: var(--yellow)" @click="addMultipleRows()"><i class="fas fa-plus"></i> 5 carros</button>
        </section>

        <template x-for="(row, idx) in rows" :key="row.id">
            <article class="cartao carro" :class="row.state" :style="'--st:' + corEstado(row)">
                <div class="carro-topo">
                    <span class="n" x-text="idx + 1"></span>
                    <label class="placa-campo"><input class="placa-input" type="text" maxlength="8" placeholder="ABC1D23" x-model="row.placa"
                        :disabled="row.state === 'done' || row.state === 'searching' || isCreating" @input="onPlacaInput(row)" :aria-label="'Placa do carro ' + (idx + 1)"></label>
                    <button class="cam" x-show="row.state !== 'done'" @click="abrirOcrParaLinha(row)" :disabled="isCreating" title="Ler placa pela câmera"><i class="fas fa-camera"></i></button>
                    <span style="margin-left: auto" x-show="row.state === 'empty'"></span>
                    <span class="estado" x-show="row.state !== 'empty'" :class="classeEstado(row)" x-text="rotuloEstado(row)"></span>
                    <button class="tirar" x-show="row.state !== 'done'" @click="removeRow(idx)" :disabled="isCreating" title="Tirar da fila"><i class="fas fa-times"></i></button>
                </div>
                <div class="carro-corpo">
                    <div class="quem">
                        <span class="vazio" x-show="row.state === 'searching'"><span class="gira"></span> procurando a placa…</span>
                        <template x-if="row.state === 'found'">
                            <span style="display:contents"><span class="av" x-text="(row.clienteNome || '?')[0].toUpperCase()"></span><span><b x-text="row.clienteNome || '—'"></b><span x-text="row.veiculoDesc || ''"></span></span></span>
                        </template>
                        <template x-if="row.state === 'manual'">
                            <span style="display:contents"><span class="av novo">+</span><span><b>Placa nova</b><span>preencha o modelo (o nome é opcional)</span></span></span>
                        </template>
                        <span class="vazio" x-show="row.state === 'empty'">Digite a placa ou use a câmera</span>
                        <span class="erro" x-show="row.state === 'error'" x-text="row.errorMsg || 'Erro ao criar'"></span>
                    </div>
                    <div class="novo-cli" x-show="row.state === 'manual'" data-modelo-host>
                        <input class="entrada" type="text" placeholder="Modelo * (ex.: onix)" x-model="row.modelo" :class="{falta: !row.modelo}" :disabled="isCreating" data-modelo-carro>
                        <input class="entrada" type="text" placeholder="Nome (opcional)" x-model="row.clienteNome" :disabled="isCreating">
                    </div>
                    <div class="opcoes">
                        <div class="campo"><label>Tipo</label>
                            <div class="tipo-seg">
                                <button :class="{on: row.tipoVeiculo === 'CARRO'}" @click="row.tipoVeiculo = 'CARRO'; onTipoChange(row)" :disabled="row.state === 'done' || isCreating" title="Carro"><i class="fas fa-car-side"></i></button>
                                <button :class="{on: row.tipoVeiculo === 'MOTO'}" @click="row.tipoVeiculo = 'MOTO'; onTipoChange(row)" :disabled="row.state === 'done' || isCreating" title="Moto"><i class="fas fa-motorcycle"></i></button>
                                <button :class="{on: row.tipoVeiculo === 'OUTROS'}" @click="row.tipoVeiculo = 'OUTROS'; onTipoChange(row)" :disabled="row.state === 'done' || isCreating" title="Outros"><i class="fas fa-truck"></i></button>
                            </div>
                        </div>
                        <div class="campo"><label>Categoria</label>
                            <select class="entrada" x-model="row.categoriaVeiculo" :disabled="row.tipoVeiculo !== 'CARRO' || row.state === 'done' || isCreating" @change="onCategoriaChange(row)">
                                <option value="" x-show="row.tipoVeiculo !== 'CARRO'">—</option>
                                <option value="HATCH">Hatch</option>
                                <option value="SEDAN">Sedan</option>
                                <option value="SUV">SUV</option>
                                <option value="PICKUP">Pickup</option>
                                <option value="CAMINHONETE">Caminhonete</option>
                                <option value="VAN">Van</option>
                                <option value="MICROONIBUS">Micro-ônibus</option>
                                <option value="CAMINHAO">Caminhão</option>
                            </select>
                        </div>
                        <div class="campo"><label>Serviço</label>
                            <select class="entrada" x-model="row.servicoId" :disabled="row.state === 'done' || isCreating">
                                <option value="">Escolher…</option>
                                <template x-for="s in getServicosForRow(row)" :key="s.id">
                                    <option :value="s.id" x-text="s.nome + (s.preco ? ` · R$${Number(s.preco).toFixed(2).replace('.', ',')}` : '')"></option>
                                </template>
                            </select>
                        </div>
                        <div class="campo"><label>Lavador</label>
                            <select class="entrada" x-model="row.lavadorId" :disabled="row.state === 'done' || isCreating">
                                <option value="">Sem lavador</option>
                                <template x-for="l in lavadores" :key="l.id"><option :value="l.id" x-text="l.nome"></option></template>
                            </select>
                        </div>
                    </div>
                </div>
            </article>
        </template>
    </div>
</div>

<!-- rodapé fixo -->
<div class="rodape-fila" x-show="rows.length > 0">
    <div class="rodape-dentro">
        <div class="resumo"><b x-text="rowsReady"></b> prontas
            <span x-text="[rowsDone ? rowsDone + ' criada' + (rowsDone > 1 ? 's' : '') : '', rowsError ? rowsError + ' com erro' : ''].filter(Boolean).join(' · ') || 'digite as placas'"></span>
        </div>
        <button class="btn" @click="clearCompleted()" x-show="rowsDone > 0" :disabled="isCreating" style="padding: 10px 12px; font-size: 12px">Limpar criadas</button>
        <button class="btn verde btn-criar" @click="criarOrdens()" :disabled="rowsReady === 0 || isCreating">
            <span x-show="!isCreating"><i class="fas fa-bolt"></i> Criar <span x-text="rowsReady || ''"></span></span>
            <span x-show="isCreating" style="display:flex;align-items:center;gap:8px"><span class="gira" style="border-color: var(--cream); border-top-color: transparent"></span> Criando…</span>
        </button>
    </div>
</div>

<!-- câmera: leitura da placa -->
<div class="folha-fundo" x-show="ocr.isOpen" x-cloak @click.self="closeCameraModal()">
    <div class="folha" style="--sc: var(--orange)" role="dialog" aria-label="Ler placa" @click.stop>
        <div class="folha-cab"><h3>Ler placa<small>enquadre a placa no retângulo</small></h3><button class="fechar" @click="closeCameraModal()"><i class="fas fa-times"></i></button></div>
        <div class="folha-corpo">
            <div class="camera"><video id="ocrVideoFil" autoplay playsinline muted></video><div class="guia"><i></i></div></div>
            <canvas id="ocrCanvasFil" style="display:none"></canvas>
            <div class="camera-erro" x-show="ocr.error" x-text="ocr.error"></div>
        </div>
        <div class="folha-pe">
            <button class="btn azul" x-show="!ocr.isProcessing" @click="ocrCapturar()"><i class="fas fa-camera"></i> <span x-text="ocr.error ? 'Tentar novamente' : 'Capturar'"></span></button>
            <button class="btn azul" x-show="ocr.isProcessing" disabled><span class="gira" style="border-color: var(--cream); border-top-color: transparent"></span> Lendo placa…</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>

    <!-- API (caminho relativo da pasta funcionario) -->
    <script src="../api.js"></script>
    <script src="/funcionario/modelos-carro.js"></script>
    <script>
        // ============================================================
        // UTILITÁRIOS
        // ============================================================
        function showToast(msg, type = 'info', duration = 3500) {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `toast-item ${type}`;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => el.remove(), duration);
        }

        function debounce(fn, delay) {
            let timer;
            return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); };
        }

        let _rowId = 0;
        function makeRow() {
            return {
                id: ++_rowId,
                placa: '',
                state: 'empty',
                veiculoId: null,
                clienteId: null,
                clienteNome: '',
                veiculoDesc: '',
                tipoVeiculo: 'CARRO',
                categoriaVeiculo: 'HATCH',
                modelo: '',
                servicoId: '',
                lavadorId: '',
                ordemId: null,
                errorMsg: '',
            };
        }

        // ============================================================
        // ALPINE COMPONENT
        // ============================================================
        function filaEntrada() {
            return {
                rows: [],
                lavadores: [],
                servicos: [],
                servicosAll: [],
                globalServico: '',
                isCreating: false,
                progressDone: 0,
                progressTotal: 0,
                _placaSearch: null,
                ocr: { isOpen: false, stream: null, isProcessing: false, error: null, targetRow: null },

                get rowsReady() {
                    return this.rows.filter(r =>
                        (r.state === 'found' || r.state === 'manual') && r.servicoId &&
                        (r.state === 'found' || r.modelo?.trim())
                    ).length;
                },
                get rowsDone()  { return this.rows.filter(r => r.state === 'done').length; },
                get rowsUsadas() { return this.rows.filter(r => r.state !== 'empty').length; },
                get rowsError() { return this.rows.filter(r => r.state === 'error').length; },

                async init() {
                    // Validação de acesso funcionário
                    const token = localStorage.getItem('token');
                    const userRole = localStorage.getItem('userRole');
                    if (!token || userRole !== 'USER') {
                        window.location.href = '../login.html';
                        return;
                    }

                    try {
                        const [lavs, servs] = await Promise.all([
                            window.api.getLavadoresSimple(),
                            window.api.getServicos({ limit: 500, ativo: 'true' })
                        ]);
                        this.lavadores  = lavs?.lavadores  || (Array.isArray(lavs)  ? lavs  : []);
                        this.servicos   = servs?.servicos  || (Array.isArray(servs) ? servs : []);
                        this.servicosAll = this.servicos;
                    } catch (e) {
                        console.error('Erro ao carregar dados:', e);
                        showToast('Erro ao carregar lavadores/serviços', 'error');
                    }

                    this.addMultipleRows(3);
                    this._placaSearch = debounce(row => this._buscarPlaca(row), 600);
                },

                addRow() {
                    this.rows.push(makeRow());
                    this.$nextTick(() => {
                        const inputs = document.querySelectorAll('.placa-input');
                        inputs[inputs.length - 1]?.focus();
                    });
                },
                addMultipleRows(n = 5) { for (let i = 0; i < n; i++) this.rows.push(makeRow()); },
                removeRow(idx)    { this.rows.splice(idx, 1); },
                clearCompleted()  { this.rows = this.rows.filter(r => r.state !== 'done'); },

                onPlacaInput(row) {
                    const raw = row.placa.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                    row.placa = raw.length > 3 ? raw.slice(0,3) + '-' + raw.slice(3,7) : raw;
                    const placa = raw.replace(/-/g, '');
                    if (placa.length < 7) {
                        if (row.state !== 'empty') {
                            Object.assign(row, { state:'empty', veiculoId:null, clienteId:null, clienteNome:'', veiculoDesc:'' });
                        }
                        return;
                    }
                    row.state = 'searching';
                    // um temporizador por linha: digitar a placa seguinte não cancela a busca desta
                    clearTimeout(row._busca);
                    row._busca = setTimeout(() => this._buscarPlaca(row), 600);
                },

                async _buscarPlaca(row) {
                    const placa = row.placa.replace(/-/g,'').toUpperCase();
                    if (placa.length < 7) return;
                    try {
                        const data = await window.api.getVeiculoByPlaca(placa);
                        if (data?.id) {
                            Object.assign(row, {
                                state: 'found',
                                veiculoId: data.id,
                                clienteId: data.clienteId || null,
                                clienteNome: data.cliente?.nome || '—',
                                veiculoDesc: `${data.modelo || ''} ${data.cor ? '· '+data.cor : ''}`.trim() || placa,
                                modelo: data.modelo || '',
                                tipoVeiculo: data.tipo || row.tipoVeiculo,
                                categoriaVeiculo: data.categoria || row.categoriaVeiculo,
                            });
                            if (this.globalServico && !row.servicoId) row.servicoId = this.globalServico;
                        } else {
                            Object.assign(row, { state:'manual', veiculoId:null, clienteId:null, clienteNome:'', veiculoDesc:'' });
                        }
                    } catch {
                        Object.assign(row, { state:'manual', veiculoId:null, clienteId:null, clienteNome:'', veiculoDesc:'' });
                    }
                },

                onTipoChange(row) {
                    row.categoriaVeiculo = row.tipoVeiculo === 'CARRO' ? 'HATCH' : '';
                    row.servicoId = '';
                },
                onCategoriaChange(row) { row.servicoId = ''; },

                getServicosForRow(row) {
                    return this.servicos.filter(s => {
                        const tvs = s.tiposVeiculo;
                        if (!tvs || tvs.length === 0) return true;
                        const tipoMatch = tvs.filter(tv => tv.nome === row.tipoVeiculo);
                        if (tipoMatch.length === 0) return false;
                        if (row.tipoVeiculo === 'CARRO' && row.categoriaVeiculo) {
                            const comCat = tipoMatch.filter(tv => tv.categoria);
                            if (comCat.length > 0) return comCat.some(tv => tv.categoria === row.categoriaVeiculo);
                        }
                        return true;
                    });
                },

                applyServiceToAll() {
                    if (!this.globalServico) return;
                    this.rows.forEach(r => { if (r.state !== 'done') r.servicoId = this.globalServico; });
                    showToast('Serviço aplicado a todas as linhas', 'info');
                },

                distribuirLavadores() {
                    const lavs = Array.isArray(this.lavadores) ? this.lavadores : [];
                    if (lavs.length === 0) { showToast('Nenhum lavador disponível', 'error'); return; }
                    let i = 0;
                    this.rows.forEach(row => {
                        if (row.state !== 'done') {
                            const lav = lavs[i % lavs.length];
                            if (lav?.id) row.lavadorId = lav.id;
                            i++;
                        }
                    });
                    showToast('Lavadores distribuídos uniformemente', 'info');
                },

                // Visual do cartão: "pronta" quando já dá para criar; "falta info" quando achou/é nova mas falta algo
                linhaPronta(r) { return (r.state === 'found' || r.state === 'manual') && !!r.servicoId && (r.state === 'found' || !!r.modelo?.trim()); },
                classeEstado(r) { return (r.state === 'found' || r.state === 'manual') ? (this.linhaPronta(r) ? 'pronta' : 'falta') : r.state; },
                rotuloEstado(r) {
                    return { pronta: '✓ pronta', falta: 'falta info', searching: 'buscando', done: '✓ criada', error: 'erro' }[this.classeEstado(r)] || '';
                },
                corEstado(r) {
                    return { pronta: 'var(--green)', falta: 'var(--yellow)', searching: 'var(--blue)', done: 'var(--ink)', error: 'var(--red)' }[this.classeEstado(r)] || 'var(--pink)';
                },

                stateLabel(state) {
                    return { empty:'Vazia', searching:'Buscando', found:'Encontrado',
                             manual:'Manual', done:'Criado ✓', error:'Erro ✗' }[state] || state;
                },

                async criarOrdens() {
                    const prontas = this.rows.filter(r =>
                        (r.state === 'found' || r.state === 'manual') && r.servicoId &&
                        (r.state === 'found' || r.modelo?.trim())
                    );
                    if (prontas.length === 0) { showToast('Nenhuma linha pronta. Preencha o serviço e o modelo do veículo.', 'error'); return; }

                    this.isCreating = true;
                    this.progressDone = 0;
                    this.progressTotal = prontas.length;
                    let criadas = 0, erros = 0;

                    for (const row of prontas) {
                        try {
                            const result = await window.api.createOrdem(this._buildPayload(row));
                            row.state = 'done';
                            row.ordemId = result?.id || null;
                            criadas++;
                        } catch (e) {
                            row.state = 'error';
                            row.errorMsg = e?.message || 'Falha ao criar';
                            erros++;
                        }
                        this.progressDone++;
                    }
                    this.isCreating = false;

                    if (criadas > 0 && erros === 0)    showToast(`${criadas} ordem(ns) criada(s)!`, 'success');
                    else if (criadas > 0 && erros > 0) showToast(`${criadas} criadas, ${erros} com erro`, 'info');
                    else                               showToast(`Erro ao criar ordens (${erros} falhas)`, 'error');
                },

                async abrirOcrParaLinha(row) {
                    if (row.state === 'done' || this.isCreating) return;
                    this.ocr.targetRow = row;
                    this.ocr.error = null;
                    this.ocr.isProcessing = false;
                    this.ocr.isOpen = true;
                    await this.$nextTick();
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                        this.ocr.stream = stream;
                        const video = document.getElementById('ocrVideoFil');
                        if (video) { video.srcObject = stream; }
                    } catch {
                        this.ocr.error = 'Câmera não disponível. Verifique as permissões.';
                    }
                },

                closeCameraModal() {
                    if (this.ocr.stream) {
                        this.ocr.stream.getTracks().forEach(t => t.stop());
                        this.ocr.stream = null;
                    }
                    this.ocr.isOpen = false;
                    this.ocr.isProcessing = false;
                    this.ocr.error = null;
                    this.ocr.targetRow = null;
                },

                async ocrCapturar() {
                    const video = document.getElementById('ocrVideoFil');
                    const canvas = document.getElementById('ocrCanvasFil');
                    if (!video || !canvas) return;
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const imageBase64 = canvas.toDataURL('image/jpeg', 0.85);
                    this.ocr.isProcessing = true;
                    this.ocr.error = null;
                    try {
                        const data = await window.api.reconhecerPlaca(imageBase64);
                        if (!data.placa) {
                            this.ocr.error = 'Nenhuma placa detectada. Ajuste o ângulo ou iluminação.';
                            return;
                        }
                        const row = this.ocr.targetRow;
                        this.closeCameraModal();
                        if (row) {
                            row.placa = data.placa;
                            this.onPlacaInput(row);
                        }
                    } catch {
                        this.ocr.error = 'Erro ao processar imagem. Tente novamente.';
                    } finally {
                        this.ocr.isProcessing = false;
                    }
                },

                _buildPayload(row) {
                    const placa = row.placa.replace(/-/g,'').toUpperCase();
                    const payload = {
                        itens: [{ tipo:'SERVICO', itemId: row.servicoId, quantidade: 1 }],
                        lavadorId: row.lavadorId || undefined,
                        forcarCriacao: true,
                    };
                    if (row.veiculoId && row.clienteId) {
                        payload.veiculoId = row.veiculoId;
                        payload.clienteId = row.clienteId;
                    } else if (row.veiculoId) {
                        payload.veiculoId  = row.veiculoId;
                        payload.novoCliente = { nome: `Avulso ${placa}` };
                    } else {
                        payload.novoCliente = { nome: row.clienteNome?.trim() || '' };
                        payload.novoVeiculo = { placa, modelo: row.modelo?.trim() || placa };
                    }
                    return payload;
                },
            };
        }
    </script>
    <script src="/funcionario/decola-base.js"></script>
