<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b1e3f">
  <title>Clientes — Lina X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/funcionario/decola-base.css">
  <style>
    /* Visual Decola (aprovado em 04/11/2026). Backup do visual antigo: tag git design-classico-2026-11-05 */
    :root { --mid: var(--muted); --light: var(--muted); --text: var(--ink); --blue-d: var(--blue); }
    .pagina { max-width: 860px; padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: 120px; }
    .topo { display: flex; align-items: center; gap: 10px; }
    .topo-tit { flex: 1; min-width: 0; }
    .topo-tit h1 { margin: 0; font: 400 clamp(24px, 6vw, 34px)/1 var(--dela); text-shadow: 3px 3px 0 var(--lina); }
    .topo-tit p { margin: 4px 0 0; font-size: 11px; opacity: .8; }
    .btn-novo { padding: 8px 12px; font-size: 13px; background: var(--yellow); box-shadow: 3px 3px 0 var(--pink); }
    .sino { display: none; }
    .sino b { position: absolute; top: -8px; right: -8px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; background: var(--red); color: var(--cream);
      border: 2px solid var(--space); display: grid; place-items: center; font: 400 10px/1 var(--dela); }

    .busca { position: relative; margin-top: 16px; }
    .busca .lupa { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); line-height: 0; z-index: 1; font-size: 15px; }
    .busca .entrada { height: 50px; padding-left: 40px; padding-right: 40px; font-size: 14px; border-width: 3px; box-shadow: 4px 4px 0 var(--pink); }
    .search-clear { display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
    .search-clear.visible { display: block; }
    .filtros { display: flex; gap: 8px; overflow-x: auto; margin: 14px calc(var(--gutter) * -1) 4px; padding: 0 var(--gutter) 6px; scrollbar-width: none; }
    .filtro { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 6px; border: 2.5px solid var(--cream); border-radius: 999px; background: none;
      color: var(--cream); font: 700 12px var(--mono); cursor: pointer; white-space: nowrap; }
    .filtro b { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--cream); color: var(--ink); display: grid; place-items: center; font: 400 11px/1 var(--dela); }
    .filtro.on { background: var(--c, var(--cream)); color: var(--ink); border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
    .filtro.on b { background: var(--ink); color: var(--c, var(--cream)); }

    .lista { gap: 14px; margin-top: 10px; }
    @media (min-width: 720px) { .lista { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .cli { cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .cli-topo { display: flex; align-items: center; gap: 10px; }
    .av { width: 42px; height: 42px; border-radius: 12px; border: 2.5px solid var(--ink); background: var(--c); color: var(--ink); display: grid; place-items: center; font: 400 18px var(--dela); flex: none; }
    .cli-topo .t { flex: 1; min-width: 0; }
    .cli-topo .t b { display: block; font: 400 15px/1.15 var(--dela); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cli-topo .t > span { display: block; font-size: 11px; color: var(--muted); }
    .sem-nome { display: inline-block; padding: 0 6px; border-radius: 5px; background: #fff3c4; border: 1.5px solid var(--ink); font: 700 10px var(--mono); color: var(--ink); vertical-align: 2px; }
    .sem-tel { color: #c1361a; }
    .quando { flex: none; text-align: right; font: 700 10px var(--mono); color: var(--muted); }
    .quando b { display: block; font: 400 13px var(--dela); color: var(--ink); }
    .quando.sumiu b { color: #c1361a; }
    .numeros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); }
    .numeros div { padding: 5px 4px; text-align: center; min-width: 0; }
    .numeros div + div { border-left: 2px dashed var(--line); }
    .numeros b { display: block; font: 400 14px/1.1 var(--dela); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .numeros small { font: 700 9px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .placas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .placa.mini { min-width: 0; } .placa.mini::before { font-size: 6px; padding: 1px 0; } .placa.mini b { font-size: 12px; padding: 2px 6px 3px; }
    .placas .mais { font: 700 11px var(--mono); color: var(--muted); }
    .cli-pe { display: flex; align-items: center; gap: 6px; }
    .chamar { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 2px solid #128c4a; border-radius: 10px; background: #e2f4e8; font-size: 11px; }
    .chamar .btn { margin-left: auto; padding: 5px 9px; font-size: 11px; background: #25d366; box-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
    .mini-acao { width: 32px; height: 32px; border-radius: 9px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; flex: none; margin-left: auto; }
    .chamar + .mini-acao { margin-left: 0; }
    .mini-acao.perigo { color: #c1361a; margin-left: 0; }
    /* resultado de veículo (busca por placa): placa grande primeiro, dono depois */
    .veic-res { display: flex; align-items: center; gap: 12px; cursor: pointer; --sc: var(--blue); }
    .veic-res.frota { --sc: #0b7a3b; }
    .veic-res .placa { min-width: 112px; }
    .veic-res .placa b { font-size: 17px; }
    .placa b mark { background: var(--yellow); color: var(--ink); border-radius: 2px; }
    .veic-res .t { flex: 1; min-width: 0; }
    .veic-res .t b { display: block; font: 400 14px/1.15 var(--dela); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .veic-res .dono { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 1px 7px; border-radius: 6px; border: 1.5px solid var(--ink); background: var(--paper);
      font: 700 10px var(--mono); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .veic-res.frota .dono { background: #0b7a3b; color: #fff; border-color: #0b7a3b; }
    .veic-res .ir { font: 400 18px var(--dela); flex: none; }
    .sec-res { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
    .sec-res::after { content: ""; flex: 1; border-top: 2px dashed currentColor; opacity: .5; }
    .veic-mais { margin: 8px 0 0; font: 700 11px var(--mono); opacity: .8; text-align: center; }
    /* frota (6+ veículos): resumo por modelo no cartão; no detalhe, busca própria e grupos */
    .cli.frota { --sc: #0b7a3b; }
    .selo-frota { flex: none; padding: 2px 8px; border-radius: 999px; border: 2px solid var(--ink); background: #0b7a3b; color: #fff; font: 700 10px var(--mono); }
    .modelos-resumo { display: flex; flex-wrap: wrap; gap: 6px; }
    .mr { padding: 2px 8px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper); font: 700 11px var(--mono); }
    .mr b { font: 400 11px var(--dela); }
    .busca-frota { position: sticky; top: -14px; z-index: 2; background: var(--cream); padding: 6px 0 8px; }
    .busca-frota .lupa { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); line-height: 0; }
    .busca-frota .form-input { padding-left: 34px; }
    .grupo { border: 2.5px solid var(--ink); border-radius: 12px; background: var(--paper); overflow: hidden; }
    .grupo + .grupo { margin-top: 8px; }
    .grupo > button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; background: none; color: var(--ink); cursor: pointer; text-align: left; }
    .grupo > button b { flex: 1; min-width: 0; font: 400 14px var(--dela); }
    .grupo > button span { font: 700 11px var(--mono); color: var(--muted); }
    .grupo > button .seta { transition: transform .2s; }
    .grupo.aberto > button .seta { transform: rotate(180deg); }
    .grupo-corpo { display: none; border-top: 2px dashed var(--line); padding: 2px 12px 8px; }
    .grupo.aberto .grupo-corpo, .grupo.solto .grupo-corpo { display: block; }
    .grupo.solto .grupo-corpo { border-top: 0; }
    .grupo .veic.alvo { background: #fff3c4; margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
    .btn-os { padding: 5px 9px; border: 2px solid var(--ink); border-radius: 8px; background: var(--green); color: var(--cream); font: 700 11px var(--mono); text-decoration: none; white-space: nowrap; }
    .mais-grupo { width: 100%; margin-top: 4px; padding: 6px; border: 2px dashed var(--ink); border-radius: 8px; background: none; font: 700 11px var(--mono); cursor: pointer; color: var(--ink); }
    .state-container { text-align: center; padding: 26px 16px; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--yellow); }
    .state-container .state-icon { font-size: 28px; }
    .state-container .state-title { font: 400 17px var(--dela); margin: 6px 0 4px; }
    .state-container .state-sub { font-size: 12px; color: var(--muted); }
    .spin { width: 30px; height: 30px; margin: 0 auto; border: 3px solid var(--ink); border-top-color: transparent; border-radius: 50%; animation: girar .7s linear infinite; }

    /* ===== janela de baixo (detalhe, formulário, sumidos) ===== */
    .drawer-overlay { position: fixed; inset: 0; z-index: 800; background: #0e0f24bb; opacity: 0; pointer-events: none; transition: opacity .25s; }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; z-index: 810; left: 0; right: 0; bottom: 0; margin: 0 auto; width: 100%; max-width: 560px; max-height: 90vh; display: flex; flex-direction: column;
      background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-bottom: 0; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 0 var(--blue);
      transform: translateY(105%); transition: transform .45s cubic-bezier(.2, .9, .3, 1.1); }
    .drawer.open { transform: none; }
    .drawer-handle { width: 44px; height: 5px; background: var(--ink); opacity: .25; border-radius: 3px; margin: 10px auto 0; flex: none; }
    .drawer-header { display: flex; align-items: center; gap: 10px; padding: 8px 14px 12px; border-bottom: 3px solid var(--ink); flex: none; }
    .drawer-title { flex: 1; min-width: 0; font: 400 17px/1.1 var(--dela); }
    .drawer-close, .modal-close-btn { width: 34px; height: 34px; border-radius: 10px; border: 2.5px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; font-size: 15px; flex: none; }
    .drawer-body { padding: 14px; overflow: auto; display: grid; gap: 12px; align-content: start; }
    .drawer-footer { display: flex; gap: 10px; padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 3px solid var(--ink); flex: none; }
    .drawer-footer .btn-f { flex: 1; }
    .det-num { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .det-num div { border: 2.5px solid var(--ink); border-radius: 12px; padding: 8px 4px; text-align: center; background: var(--paper); box-shadow: 3px 3px 0 var(--c); min-width: 0; }
    .det-num b { display: block; font: 400 clamp(13px, 4vw, 17px)/1.1 var(--dela); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .det-num small { font: 700 9px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .det-linha { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 2px dashed var(--line); font: 700 12px var(--mono); }
    .det-linha span:first-child { color: var(--muted); font-weight: 400; }
    .det-tit { margin: 4px 0 -4px; font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .veic { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .veic + .veic { border-top: 2px dashed var(--line); }
    .veic .t { flex: 1; min-width: 0; font: 700 13px var(--mono); }
    .btn-transf { padding: 5px 9px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper); color: var(--ink); font: 700 11px var(--mono); cursor: pointer; white-space: nowrap; }
    .acoes-det { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .acoes-det .btn { padding: 10px 8px; font-size: 13px; }
    .acoes-det .btn.largo { grid-column: 1 / -1; }
    .btn.zap { background: #25d366; }
    .btn.lixo { background: var(--paper); color: #c1361a; }
    .reengajar { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid #128c4a; border-radius: 10px; background: #e2f4e8; font-size: 12px; }
    .vazio-txt { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }

    /* formulário */
    .form-section { display: grid; gap: 10px; }
    .form-section-title { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .form-group { display: grid; gap: 4px; }
    .form-label { font: 700 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .form-input { width: 100%; min-width: 0; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--paper); color: var(--ink); padding: 9px 11px; font: 700 14px var(--mono); outline: none; }
    .form-input:focus { box-shadow: 3px 3px 0 var(--blue); }
    .form-hint { font-size: 10px; color: var(--muted); }
    .vehicle-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 36px; gap: 8px; align-items: start; margin-bottom: 8px; }
    .vehicle-row .form-input { padding: 8px 9px; font-size: 13px; }
    .btn-remove-veh { width: 36px; height: 36px; border-radius: 10px; border: 2px solid var(--ink); background: #ffe0dc; color: #c1361a; cursor: pointer; }
    .btn-add-veh { justify-self: start; padding: 6px 12px; border: 2px dashed var(--ink); border-radius: 10px; background: none; color: var(--ink); font: 700 12px var(--mono); cursor: pointer; }
    .btn-f { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 3px solid var(--ink); border-radius: 12px; padding: 10px 14px;
      font: 400 14px/1.1 var(--dela); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; background: var(--paper); color: var(--ink); }
    .btn-f:disabled { opacity: .5; cursor: not-allowed; }
    .btn-f-save { background: var(--green); color: var(--cream); }
    .btn-f-wa { background: #25d366; color: var(--ink); }
    .btn-f-cancel { flex: 0 0 auto !important; }

    /* clientes sumidos (sino) */
    .notif-toggle { display: flex; align-items: center; gap: 8px; font: 700 12px var(--mono); }
    .notif-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 2px dashed var(--line); }
    .notif-info { flex: 1; min-width: 0; }
    .notif-nome { font: 400 14px var(--dela); }
    .notif-meta { font-size: 11px; color: var(--muted); }
    .notif-actions { display: flex; gap: 6px; flex: none; }
    .btn-notif-ignore, .btn-notif-msg { padding: 5px 8px; border: 2px solid var(--ink) !important; border-radius: 8px; background: var(--paper); color: var(--ink) !important; font: 700 11px var(--mono); cursor: pointer; }
    .btn-notif-msg { background: #25d366; }

    /* janelas do meio (transferir, WhatsApp) */
    .modal-overlay { position: fixed; inset: 0; z-index: 900; background: #0e0f24bb; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-box { width: 100%; max-width: 460px; max-height: 90vh; display: flex; flex-direction: column; background: var(--cream); color: var(--ink); border: 3px solid var(--ink);
      border-radius: 18px; box-shadow: 6px 6px 0 var(--blue); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 3px solid var(--ink); }
    .modal-header h3 { margin: 0; font: 400 16px/1.1 var(--dela); }
    .modal-body { padding: 14px; overflow: auto; display: grid; gap: 12px; align-content: start; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 14px; border-top: 3px solid var(--ink); }
    .transfer-info { padding: 8px 10px; border: 2px solid var(--ink); border-radius: 10px; background: #fff3c4; font-size: 12px; line-height: 1.5; }
    .transfer-search-results { border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
    .transfer-result-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; cursor: pointer; background: var(--paper); }
    .transfer-result-item + .transfer-result-item { border-top: 2px dashed var(--line); }
    .transfer-result-item.selected { background: #fff3c4; }
    .transfer-result-name { font: 700 13px var(--mono); }
    .transfer-result-phone { font-size: 11px; color: var(--muted); }
    .selected-client-box { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--green); color: var(--cream); }
    .selected-client-name { font: 400 14px var(--dela); }
    .btn-deselect { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; }
    .wa-cliente-info { display: flex; align-items: center; gap: 10px; }
    .wa-status-banner { padding: 7px 10px; border: 2px solid var(--ink); border-radius: 10px; font: 700 12px var(--mono); }
    .wa-status-banner.conectado { background: #e2f4e8; color: #1a6b3d; }
    .wa-status-banner.desconectado { background: #ffe0dc; color: #c1361a; }
    .wa-tab-bar { display: flex; gap: 6px; }
    .wa-tab-btn { flex: 1; padding: 6px 8px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); font: 700 12px var(--mono); cursor: pointer; }
    .wa-tab-btn.ativo { background: var(--ink); color: var(--yellow); }
    .wa-templates-list { display: grid; gap: 6px; }
    .wa-template-card { padding: 8px 10px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); cursor: pointer; }
    .wa-template-card.selecionado { background: #25d366; box-shadow: 2px 2px 0 var(--ink); }
    .tc-nome { font: 700 12px var(--mono); }
    .tc-texto { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wa-template-card.selecionado .tc-texto { color: var(--ink); }
    .wa-preview-box, .wa-msg-textarea { width: 100%; border: 2.5px solid var(--ink); border-radius: 12px; background: #dcf8c6; color: var(--ink); padding: 10px 12px; font: 400 13px/1.45 var(--mono); white-space: pre-wrap; }
    .wa-msg-textarea { min-height: 110px; resize: vertical; outline: none; }
    .toast-container { position: fixed; z-index: 5000; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: center; width: max-content; max-width: 90vw; }
    .toast-container .toast { position: static; transform: none; opacity: 1; pointer-events: auto; }
    .toast-container .toast.info { background: var(--yellow); }
  </style>
</head>
<body>
<div id="ceu" aria-hidden="true"></div>
<div id="grao" aria-hidden="true"></div>

<div class="pagina">
  <header class="topo">
    <a class="ico-btn" href="/funcionario/index.html" title="Início"><i class="fas fa-home"></i></a>
    <div class="topo-tit"><h1>Clientes</h1><p id="countLabel">Carregando...</p></div>
    <button class="ico-btn sino" id="btnNotif" onclick="openNotifPanel()" title="Clientes sem visitar há muito tempo"><i class="fas fa-bell"></i><b id="notifBadge">0</b></button>
    <button class="btn btn-novo" onclick="openFormNew()"><i class="fas fa-plus"></i> Novo</button>
  </header>

  <div class="busca">
    <span class="lupa"><i class="fas fa-search"></i></span>
    <input class="entrada" type="text" id="searchInput" placeholder="Nome, telefone ou placa…" oninput="onSearch(this)" autocomplete="off">
    <button class="search-clear" id="searchClear" onclick="clearSearch()" title="Limpar"><i class="fas fa-times"></i></button>
  </div>
  <nav class="filtros" id="filterBar"></nav>
  <div id="veicResult"></div>
  <div class="lista" id="grid"></div>
</div>

<nav id="bottomNav"></nav>
<div class="toast-container" id="toastContainer"></div>

<!-- janela de baixo: detalhe, formulário e clientes sumidos -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <span class="drawer-title" id="drawerTitle">—</span>
    <button class="drawer-close" onclick="closeDrawer()"><i class="fas fa-times"></i></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer" id="drawerFooter" style="display:none"></div>
</div>

<!-- transferir veículo -->

<div class="modal-overlay" id="waModal" onclick="if(event.target===this)closeWaModal()">
  <div class="modal-box" style="max-width:480px; box-shadow: 6px 6px 0 #25d366">

      <button class="btn-f btn-f-cancel" onclick="closeWaModal()">Cancelar</button>

  <script src="../api.js"></script>
  <script src="utils.js"></script>
  <script src="/funcionario/modelos-carro.js"></script>
  <script>
    const PAGE_TITLE  = 'Clientes';
    const PAGE_ACTIVE = 'clientes';

    let allClientes   = [];
    let filtered      = [];
    let editingId     = null;
    let vehCount      = 0;
    let filtroAtivo   = 'todos';
    let filterCounts  = {};
    let searchTimer   = null;

    // Renderização em lotes (evita recriar centenas de cards de uma vez)
    const GRID_BATCH   = 60;
    let renderedCount  = 0;
    let gridObserver   = null;

    // Estado da transferência
    let transferVeiculoData   = null;
    let transferClienteSel    = null;
    let transferTimer         = null;

    // Checa uma permissão do cargo (mesmo catálogo do RBAC do backend)
    function temPermissao(p) {
      try { return JSON.parse(localStorage.getItem('permissoes') || '[]').includes(p); }
      catch { return false; }
    }

    // ── INIT ──────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      if (!validateFuncionarioAccess()) return;

      const permissoes = JSON.parse(localStorage.getItem('permissoes') || '[]');
      if (!permissoes.includes('gerenciar_clientes')) {
        showToast('Sem permissão para gerenciar clientes', 'error');
        setTimeout(() => { window.location.href = '/funcionario/index.html'; }, 1500);
        return;
      }

      document.getElementById('bottomNav').innerHTML = createMobileNav(PAGE_ACTIVE);
      await loadClientes();
    });

    // ── CARREGAR ──────────────────────────────────
    // Busca a 1ª página e exibe na hora; o resto entra em background sem travar a tela.
    // (antes buscava tudo de uma vez com limit=500 fixo — arriscado, empresas já
    // com 450+ clientes ficavam a um passo de perder cadastro silenciosamente)
    async function loadClientes() {
      setGrid(`<div class="state-container"><div class="spin"></div></div>`);
      try {
        const PAGE_SIZE = 200;
        const first = await window.api.getClientes(1, PAGE_SIZE, '');
        allClientes = first.clientes || first.data || [];
        refreshComputed();
        filtered = applyFilterAndSearch();
        renderFilterBar();
        renderGrid();

        const pages = first.pagination?.pages || 1;
        for (let p = 2; p <= pages; p++) {
          const r = await window.api.getClientes(p, PAGE_SIZE, '');
          allClientes.push(...(r.clientes || r.data || []));
        }
        if (pages > 1) {
          refreshComputed();
          filtered = applyFilterAndSearch();
          renderFilterBar();
          renderGrid();
        }
      } catch {
        setGrid(`<div class="state-container">
          <i class="fas fa-exclamation-triangle state-icon"></i>
          <div class="state-title">Erro ao carregar</div>
          <div class="state-sub">Verifique a conexão e tente novamente.</div>
        </div>`);
      }
    }

    // Recalcula, uma única vez por carregamento, os valores derivados de cada
    // cliente (gasto total, dias desde a última visita, etc.) e as contagens dos
    // filtros — antes eram recalculados a cada render/clique, com todos os
    // clientes sendo varridos várias vezes seguidas.
    function refreshComputed() {
      const hoje = getHojeBRT();
      for (const c of allClientes) {
        const ordensValidas = (c.ordens || []).filter(o => o.status !== 'CANCELADO');
        c._totalOrdens = ordensValidas.length || c._count?.ordens || 0;
        c._totalGasto  = ordensValidas.reduce((acc, o) => acc + (o.valorTotal || 0), 0);
        const datas = ordensValidas.map(o => o.dataFim || o.createdAt).filter(Boolean).map(d => new Date(d));
        c._ultimaVisita = datas.length ? new Date(Math.max(...datas)) : null;
        c._dias         = c._ultimaVisita ? Math.floor((Date.now() - c._ultimaVisita.getTime()) / 86400000) : null;
        c._temHoje      = ordensValidas.some(o => o.createdAt && dataBRT(o.createdAt) === hoje);
      }

      filterCounts = { todos: allClientes.length, hoje: 0, recentes: 0, inativos: 0, semNome: 0 };
      for (const c of allClientes) {
        if (matchFiltro(c, 'hoje'))     filterCounts.hoje++;
        if (matchFiltro(c, 'recentes')) filterCounts.recentes++;
        if (matchFiltro(c, 'inativos')) filterCounts.inativos++;
        if (matchFiltro(c, 'semNome'))  filterCounts.semNome++;
      }

      computeNotificaveis();
    }

    // ── NOTIFICAÇÃO: CLIENTES SEM VISITAR HÁ MUITO TEMPO ──
    // Mesmo limite do filtro "Inativos 30d+" já existente no CRM. "Ignorar" some
    // com o cliente da lista por 15 dias (campo notificacaoIgnoradaAte no banco,
    // compartilhado entre todos os funcionários/dispositivos da empresa).
    // Por padrão só entram quem tem WhatsApp cadastrado (é o que dá pra agir);
    // quem não tem fica escondido atrás de um toggle, com atalho pra cadastrar o número.
    const DIAS_NOTIF = 30;
    let notificaveis          = []; // elegíveis com telefone
    let notificaveisSemFone   = []; // elegíveis sem telefone
    let mostrarSemWhatsapp    = false;

    function computeNotificaveis() {
      const agora = Date.now();
      const elegiveis = allClientes.filter(c =>
        c._dias !== null && c._dias >= DIAS_NOTIF &&
        (!c.notificacaoIgnoradaAte || new Date(c.notificacaoIgnoradaAte).getTime() <= agora)
      );
      notificaveis        = elegiveis.filter(c => c.telefone).sort((a, b) => (b._dias || 0) - (a._dias || 0));
      notificaveisSemFone = elegiveis.filter(c => !c.telefone).sort((a, b) => (b._dias || 0) - (a._dias || 0));
      renderNotifBadge();
    }

    function renderNotifBadge() {
      const btn   = document.getElementById('btnNotif');
      const badge = document.getElementById('notifBadge');
      if (!btn || !badge) return;
      if (notificaveis.length > 0) {
        btn.style.display = 'grid';
        badge.textContent = notificaveis.length > 99 ? '99+' : notificaveis.length;
      } else {
        btn.style.display = 'none';
      }
    }

    function openNotifPanel() {
      mostrarSemWhatsapp = false;
      openDrawer();
      document.getElementById('drawerFooter').style.display = 'none';
      renderNotifPanelBody();
    }

    function toggleSemWhatsapp(checkbox) {
      mostrarSemWhatsapp = checkbox.checked;
      renderNotifPanelBody();
    }

    function renderNotifPanelBody() {
      document.getElementById('drawerTitle').textContent = `Sem visitar há ${DIAS_NOTIF}d+ (${notificaveis.length})`;
      const body = document.getElementById('drawerBody');
      const lista = mostrarSemWhatsapp ? [...notificaveis, ...notificaveisSemFone] : notificaveis;

      const toggleHtml = notificaveisSemFone.length > 0 ? `
        <label class="notif-toggle">
          <input type="checkbox" ${mostrarSemWhatsapp ? 'checked' : ''} onchange="toggleSemWhatsapp(this)">
          Mostrar também ${notificaveisSemFone.length} sem WhatsApp cadastrado
        </label>` : '';

      if (!lista.length) {
        body.innerHTML = toggleHtml + `<div class="state-container">
          <div class="state-icon">👏</div>
          <div class="state-title">Tudo em dia!</div>
          <div class="state-sub">Nenhum cliente esquecido no momento.</div>
        </div>`;
        return;
      }

      body.innerHTML = toggleHtml + lista.map(c => {
        const nome = c.nome && c.nome !== 'N/A' ? c.nome : 'Cliente sem nome';
        const acaoMsg = c.telefone
          ? `<button class="btn-notif-msg" onclick="openWaModal('${c.id}')" title="Enviar mensagem">
               <i class="fab fa-whatsapp"></i> Mensagem
             </button>`
          : `<button class="btn-notif-msg" style="color:var(--blue-d);border-color:#bfdbfe" onclick="openFormEdit('${c.id}')" title="Cadastrar WhatsApp">
               <i class="fas fa-pencil-alt"></i> Adicionar nº
             </button>`;
        return `
          <div class="notif-row" id="notifRow_${c.id}">
            <div class="notif-info">
              <div class="notif-nome">${escHtml(nome)}</div>
              <div class="notif-meta">${c.telefone ? escHtml(c.telefone) : 'Sem telefone'} · ${c._dias}d sem visitar</div>
            </div>
            <div class="notif-actions">
              <button class="btn-notif-ignore" onclick="ignorarNotificacao('${c.id}')" title="Não mostrar por 15 dias">
                <i class="fas fa-clock"></i> Ignorar
              </button>
              ${acaoMsg}
            </div>
          </div>`;
      }).join('');
    }

    async function ignorarNotificacao(id) {
      const row = document.getElementById(`notifRow_${id}`);
      if (row) row.style.opacity = '.5';
      try {
        const r = await window.api.ignorarNotificacaoCliente(id);
        const c = allClientes.find(x => x.id === id);
        if (c) c.notificacaoIgnoradaAte = r.notificacaoIgnoradaAte || new Date(Date.now() + 15 * 86400000).toISOString();
        notificaveis        = notificaveis.filter(x => x.id !== id);
        notificaveisSemFone = notificaveisSemFone.filter(x => x.id !== id);
        renderNotifBadge();
        renderNotifPanelBody();
        showToast('Cliente ignorado por 15 dias', 'success');
      } catch {
        showToast('Erro ao ignorar cliente', 'error');
        if (row) row.style.opacity = '1';
      }
    }

    // ── FILTRO BAR ────────────────────────────────
    function renderFilterBar() {
      const filtros = [
        { id: 'todos',    label: 'Todos',        cor: 'var(--cream)' },
        { id: 'hoje',     label: 'Hoje',         cor: 'var(--yellow)' },
        { id: 'recentes', label: '7 dias',       cor: '#9be3b5' },
        { id: 'inativos', label: 'Sumidos 30d+', cor: 'var(--pink)' },
        { id: 'semNome',  label: 'Sem nome',     cor: '#ffb199' }
      ];
      document.getElementById('filterBar').innerHTML = filtros.map(f =>
        `<button class="filtro ${filtroAtivo === f.id ? 'on' : ''}" style="--c: ${f.cor}" onclick="setFiltro('${f.id}')"><b>${filterCounts[f.id] ?? 0}</b>${f.label}</button>`
      ).join('');
    }

    function setFiltro(id) {
      filtroAtivo = id;
      filtered = applyFilterAndSearch();
      renderGrid();
      renderFilterBar();
    }

    function matchFiltro(c, tipo) {
      const dias = diasDesdeUltimaVisita(c);
      if (tipo === 'hoje')     return clienteTevOrdemHoje(c);
      if (tipo === 'recentes') return dias !== null && dias <= 7;
      if (tipo === 'inativos') return dias === null || dias > 30;
      if (tipo === 'semNome')  return !c.nome || c.nome === 'N/A' || c.nome.trim() === '';
      return true;
    }

    // ── HELPERS BRT ───────────────────────────────
    function getHojeBRT() {
      const brt = new Date(Date.now() - 3 * 60 * 60 * 1000);
      return brt.toISOString().slice(0, 10);
    }

    function dataBRT(dateStr) {
      const brt = new Date(new Date(dateStr).getTime() - 3 * 60 * 60 * 1000);
      return brt.toISOString().slice(0, 10);
    }

    // Lêem os valores calculados uma única vez em refreshComputed() — evita
    // reprocessar o array de ordens de cada cliente a cada render/filtro.
    function clienteTevOrdemHoje(c) {
      return !!c._temHoje;
    }

    // ── HELPERS DE DATA / VISITA ──────────────────
    function ultimaVisitaDate(c) {
      return c._ultimaVisita ?? null;
    }

    function diasDesdeUltimaVisita(c) {
      return c._dias ?? null;
    }

    function badgeVisitaHtml(c) {
      const dias = diasDesdeUltimaVisita(c);
      if (dias === null) return '';
      let cls, txt;
      if (dias <= 7)  { cls = 'recente'; txt = `${dias}d`; }
      else if (dias <= 30) { cls = 'media'; txt = `${dias}d`; }
      else            { cls = 'antiga';  txt = `${dias}d`; }
      return `<span class="badge-visita ${cls}"><i class="fas fa-clock"></i>${txt}</span>`;
    }

    function calcTotalGasto(c) {
      return c._totalGasto ?? 0;
    }

    function gerarLinkWhatsApp(c, dias) {
      const nome = (c.nome && c.nome !== 'N/A' ? c.nome : 'cliente').split(' ')[0];
      const diasTxt = dias !== null ? `${dias} dias` : 'um tempo';
      const msg = `Olá ${nome}! 😊 Já faz ${diasTxt} desde a sua última visita. Seu veículo já pode estar precisando de uma lavagem! Que tal agendar hoje? Temos horários disponíveis para você. 🚗✨`;
      return `https://wa.me/55${cleanPhone(c.telefone)}?text=${encodeURIComponent(msg)}`;
    }

    // ── RENDER GRID ───────────────────────────────
    // Renderiza em lotes de GRID_BATCH cards, carregando mais conforme o usuário
    // rola a tela (IntersectionObserver) — evita recriar centenas de cards de
    // uma vez a cada busca/filtro, que é o que travava a rolagem em celulares
    // mais fracos com listas de clientes grandes.
    // ── RESULTADO POR VEÍCULO ─────────────────────
    // Com 2+ letras/números de placa, mostra os CARROS que batem (com o dono) antes dos clientes:
    // em frota grande o carro procurado não fica escondido atrás do cartão do cliente.
    const FROTA_MIN = 6; // a partir de quantos veículos o cliente é tratado como frota
    const ehFrota = (c) => (c.veiculos || []).length >= FROTA_MIN;
    const normPlaca = (v) => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    function marcaPlaca(placa, qp) {
      const p = escHtml(placa || ''), i = qp ? normPlaca(placa).indexOf(qp) : -1;
      return i < 0 ? p : p.slice(0, i) + '<mark>' + p.slice(i, i + qp.length) + '</mark>' + p.slice(i + qp.length);
    }
    function veiculosPorPlaca(q) {
      const qp = normPlaca(q);
      if (qp.length < 2) return [];
      const achados = [];
      for (const c of allClientes) {
        if (filtroAtivo !== 'todos' && !matchFiltro(c, filtroAtivo)) continue;
        for (const v of (c.veiculos || [])) if (normPlaca(v.placa).includes(qp)) achados.push({ c, v });
      }
      return achados;
    }
    function renderVeiculos(q) {
      const box = document.getElementById('veicResult');
      const achados = veiculosPorPlaca(q);
      if (!achados.length) { box.innerHTML = ''; return achados; }
      const qp = normPlaca(q), max = 40;
      box.innerHTML = `<p class="sec-res">Veículos com essa placa · ${achados.length}</p>
        <div class="lista">${achados.slice(0, max).map(({ c, v }) => {
          const frota = ehFrota(c);
          const nome = c.nome && c.nome !== 'N/A' ? c.nome : 'Cliente sem nome';
          return `<article class="cartao veic-res${frota ? ' frota' : ''}" onclick="openDetail('${c.id}', '${escHtml(v.placa)}')">
            <span class="placa"><b>${marcaPlaca(v.placa, qp)}</b></span>
            <span class="t"><b>${escHtml(v.modelo || 'Modelo não informado')}</b>
              <span class="dono"><i class="fas ${frota ? 'fa-key' : 'fa-user'}"></i> ${escHtml(nome)}${frota ? ` · ${c.veiculos.length} carros` : ''}</span></span>
            <span class="ir">→</span></article>`;
        }).join('')}</div>
        ${achados.length > max ? `<p class="veic-mais">+ ${achados.length - max} — digite mais da placa para afinar</p>` : ''}
        <p class="sec-res">Clientes</p>`;
      return achados;
    }
    // o cliente bate na busca por algo além da placa? (nome, telefone ou modelo)
    function bateSemPlaca(c, q) {
      return (c.nome || '').toLowerCase().includes(q) || (c.telefone || '').includes(q)
        || (c.veiculos || []).some(v => (v.modelo || '').toLowerCase().includes(q));
    }

    function renderGrid() {
      const qBusca = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      // quem apareceu só pela placa já está nos resultados de veículo — não repete como cliente
      const nVeic = renderVeiculos(qBusca).length;
      if (nVeic) filtered = filtered.filter(c => bateSemPlaca(c, qBusca));
      const total    = filtered.length;
      const allTotal = allClientes.length;
      document.getElementById('countLabel').textContent = nVeic
        ? `${nVeic} veículo${nVeic !== 1 ? 's' : ''} · ${total} cliente${total !== 1 ? 's' : ''}`
        : total === allTotal
          ? `${total} cliente${total !== 1 ? 's' : ''}`
          : `${total} de ${allTotal} cliente${allTotal !== 1 ? 's' : ''}`;
      // só carros no resultado: some o título "Clientes" vazio
      if (nVeic && !total) document.querySelector('#veicResult .sec-res:last-of-type')?.remove();

      if (gridObserver) { gridObserver.disconnect(); gridObserver = null; }

      if (total === 0 && document.getElementById('veicResult').innerHTML) { setGrid(''); return; }
      if (total === 0) {
        setGrid(`<div class="state-container">
          <div class="state-icon">🔎</div>
          <div class="state-title">Ninguém encontrado</div>
          <div class="state-sub">Tente outro termo ou mude o filtro.</div>
        </div>`);
        return;
      }

      const g = document.getElementById('grid');
      g.style.display = 'grid';
      g.classList.add('lista');
      g.innerHTML = '';
      renderedCount = 0;
      appendNextBatch();
    }

    function appendNextBatch() {
      const g = document.getElementById('grid');
      const sentinel = document.getElementById('gridSentinel');
      if (sentinel) sentinel.remove();

      const next = filtered.slice(renderedCount, renderedCount + GRID_BATCH);
      g.insertAdjacentHTML('beforeend', next.map(c => clienteCard(c)).join(''));
      renderedCount += next.length;

      if (renderedCount < filtered.length) {
        g.insertAdjacentHTML('beforeend', '<div id="gridSentinel" style="grid-column:1/-1;height:1px"></div>');
        gridObserver = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) appendNextBatch();
        }, { rootMargin: '600px' });
        gridObserver.observe(document.getElementById('gridSentinel'));
      }
    }

    function setGrid(html) {
      const g = document.getElementById('grid');
      g.style.display = 'block';
      g.innerHTML = html;
    }

    // Cor do avatar a partir do id (fica igual entre recarregamentos)
    const CORES_AV = ['var(--pink)', 'var(--yellow)', '#9fc1ff', '#9be3b5', '#ffb199', '#d6b8ff'];
    function corAvatar(id) { let h = 0; for (const ch of String(id || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return CORES_AV[h % CORES_AV.length]; }
    function quandoHtml(c) {
      const dias = diasDesdeUltimaVisita(c);
      if (dias === null) return `<span class="quando">última visita<b>—</b></span>`;
      return `<span class="quando${dias > 30 ? ' sumiu' : ''}">última visita<b>${dias === 0 ? 'hoje' : `há ${dias} dia${dias > 1 ? 's' : ''}`}</b></span>`;
    }

    // contagem de veículos por modelo (maior primeiro); sem modelo vira "Sem modelo"
    function resumoModelos(veiculos) {
      const cont = {};
      for (const v of veiculos) { const m = (v.modelo || '').trim() || 'Sem modelo'; cont[m] = (cont[m] || 0) + 1; }
      return Object.entries(cont).sort((a, b) => b[1] - a[1]);
    }

    function clienteCard(c) {
      const isNA     = !c.nome || c.nome === 'N/A' || c.nome.trim() === '';
      const veiculos = c.veiculos || [];
      const dias     = diasDesdeUltimaVisita(c);
      const sumiu    = dias !== null && dias > 30;
      const initial  = isNA ? (veiculos[0]?.placa ? veiculos[0].placa.charAt(0).toUpperCase() : '?') : c.nome.charAt(0).toUpperCase();
      const placas   = veiculos.slice(0, 3).map(v => `<span class="placa mini"><b>${escHtml(v.placa)}</b></span>`).join('')
        + (veiculos.length > 3 ? `<span class="mais">+${veiculos.length - 3}</span>` : '');
      const frota    = ehFrota(c);
      const resumo   = frota ? resumoModelos(veiculos) : [];
      const chamar = sumiu && c.telefone
        ? `<div class="chamar"><i class="fab fa-whatsapp" style="font-size: 16px; color: #128c4a"></i><span>Sumiu há <b>${dias} dias</b></span>
             <button class="btn" onclick="event.stopPropagation(); openWaModal('${c.id}')">Chamar de volta</button></div>` : '';
      return `
        <article class="cartao cli${frota ? ' frota' : ''}" style="${frota ? '' : `--sc: ${sumiu ? 'var(--pink)' : 'var(--blue)'}`}" onclick="openDetail('${c.id}')">
          <div class="cli-topo">
            <span class="av" style="--c: ${frota ? '#0b7a3b' : corAvatar(c.id)}; ${frota ? 'color: #fff' : ''}">${frota ? '<i class="fas fa-key"></i>' : escHtml(initial)}</span>
            <span class="t"><b>${isNA ? '<span class="sem-nome">sem nome</span>' : escHtml(c.nome)}</b><span>${frota ? `${veiculos.length} veículos · ${resumo.length} modelo${resumo.length !== 1 ? 's' : ''}` : c.telefone ? escHtml(c.telefone) : '<span class="sem-tel">sem telefone</span>'}</span></span>
            ${frota ? '<span class="selo-frota">frota</span>' : quandoHtml(c)}
          </div>
          <div class="numeros"><div><b>${c._totalOrdens ?? 0}</b><small>visitas</small></div><div><b>${veiculos.length}</b><small>veículos</small></div><div><b>${gastoCurto(calcTotalGasto(c))}</b><small>gasto</small></div></div>
          ${frota ? `<div class="modelos-resumo">${resumo.slice(0, 5).map(([m, n]) => `<span class="mr"><b>${n}</b> ${escHtml(m)}</span>`).join('')}${resumo.length > 5 ? `<span class="mr">+${resumo.length - 5}</span>` : ''}</div>`
            : veiculos.length ? `<div class="placas">${placas}</div>` : ''}
          <div class="cli-pe" onclick="event.stopPropagation()">
            ${chamar}
            <button class="mini-acao" title="Editar" onclick="openFormEdit('${c.id}')"><i class="fas fa-pen"></i></button>
            ${temPermissao('excluir_clientes') ? `<button class="mini-acao perigo" title="Excluir" onclick="confirmDelete('${c.id}', '${escHtml(c.nome)}')"><i class="fas fa-trash"></i></button>` : ''}
          </div>
        </article>`;
    }

    // ── BUSCA ─────────────────────────────────────
    // Debounce de 250ms: digitando rápido, só filtra/re-renderiza o grid depois
    // que a pessoa parar de digitar, em vez de refazer o grid a cada tecla.
    function onSearch(input) {
      const q = input.value.trim().toLowerCase();
      document.getElementById('searchClear').classList.toggle('visible', q.length > 0);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        filtered = applyFilterAndSearch(q);
        renderGrid();
      }, 250);
    }

    function applyFilterAndSearch(q) {
      if (q === undefined) q = document.getElementById('searchInput').value.trim().toLowerCase();
      return allClientes.filter(c => {
        const matchSearch = !q ||
          (c.nome || '').toLowerCase().includes(q) ||
          (c.telefone || '').includes(q) ||
          (c.veiculos || []).some(v =>
            (v.placa || '').toLowerCase().includes(q) ||
            (v.modelo || '').toLowerCase().includes(q)
          );
        const matchFilter = filtroAtivo === 'todos' || matchFiltro(c, filtroAtivo);
        return matchSearch && matchFilter;
      });
    }

    function clearSearch() {
      clearTimeout(searchTimer);
      document.getElementById('searchInput').value = '';
      document.getElementById('searchClear').classList.remove('visible');
      filtered = applyFilterAndSearch('');
      renderGrid();
    }

    // ── DRAWER DETALHE ────────────────────────────
    let detCliente = null, detAbertos = new Set(), detLimite = {};
    async function openDetail(id, placaAlvo = '') {
      const c = allClientes.find(x => x.id === id);
      if (!c) return;
      detCliente = c; detAbertos = new Set(); detLimite = {};
      const alvo = placaAlvo && (c.veiculos || []).find(v => v.placa === placaAlvo);
      if (alvo) detAbertos.add((alvo.modelo || '').trim() || 'Sem modelo');

      openDrawer();
      const isNA = !c.nome || c.nome === 'N/A';
      document.getElementById('drawerTitle').textContent = isNA ? 'Cliente sem nome' : c.nome;
      document.getElementById('drawerFooter').style.display = 'none';

      const totalGasto  = calcTotalGasto(c);
      const totalOrdens = c._totalOrdens ?? 0;
      const veiculos    = c.veiculos || [];
      const dias        = diasDesdeUltimaVisita(c);
      const uvData      = ultimaVisitaDate(c);
      const ultimaVisitaFmt = uvData ? uvData.toLocaleDateString('pt-BR') : '—';

      // Reengajar: 15+ dias sem visita e com telefone
      const reengajar = c.telefone && dias !== null && dias >= 15
        ? `<div class="reengajar"><i class="fab fa-whatsapp" style="font-size: 18px; color: #128c4a"></i><span>Última visita há <b>${dias} dias</b>. Mande uma mensagem para trazer o cliente de volta.</span></div>` : '';

      const buscaFrota = veiculos.length >= FROTA_MIN
        ? `<div class="busca-frota"><div style="position: relative"><span class="lupa"><i class="fas fa-search"></i></span>
            <input class="form-input" id="buscaFrota" placeholder="Buscar placa ou modelo neste cliente…" value="${escHtml(placaAlvo)}" autocomplete="off" oninput="desenharVeicsDet(this.value)"></div></div>` : '';

      document.getElementById('drawerBody').innerHTML = `
        <div class="det-num">
          <div style="--c: var(--yellow)"><b>${totalOrdens}</b><small>visitas</small></div>
          <div style="--c: var(--blue)"><b>${veiculos.length}</b><small>veículos</small></div>
          <div style="--c: var(--green)"><b>${gastoCurto(totalGasto)}</b><small>gasto</small></div>
        </div>
        ${reengajar}
        <div>
          <div class="det-linha"><span>Telefone</span><span>${c.telefone ? escHtml(c.telefone) : '—'}</span></div>
          <div class="det-linha"><span>Última visita</span><span>${ultimaVisitaFmt}${dias !== null ? ` · há ${dias}d` : ''}</span></div>
        </div>
        <p class="det-tit">Veículos (${veiculos.length})</p>
        ${buscaFrota}
        <div id="veicsDet"></div>
        <div class="acoes-det">
          <a class="btn verde largo" href="/funcionario/nova-ordem.html"><i class="fas fa-plus"></i> Nova ordem</a>
          <button class="btn" onclick="openFormEdit('${c.id}')"><i class="fas fa-pen"></i> Editar</button>
          ${c.telefone ? `<button class="btn zap" onclick="openWaModal('${c.id}')"><i class="fab fa-whatsapp"></i> Mensagem</button>` : '<button class="btn" disabled><i class="fab fa-whatsapp"></i> Sem telefone</button>'}
          ${temPermissao('excluir_clientes') ? `<button class="btn lixo largo" onclick="confirmDelete('${c.id}', '${escHtml(c.nome || 'N/A')}')"><i class="fas fa-trash"></i> Excluir cliente</button>` : ''}
        </div>
      `;
      desenharVeicsDet(placaAlvo);
      if (alvo) setTimeout(() => document.querySelector('#veicsDet .veic.alvo')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 400);
    }

    // lista de veículos do detalhe: poucos (ou filtrando) = lista simples; frota = grupos por modelo
    function desenharVeicsDet(filtro = '') {
      const c = detCliente, box = document.getElementById('veicsDet');
      if (!c || !box) return;
      const veiculos = c.veiculos || [];
      if (!veiculos.length) { box.innerHTML = `<p class="vazio-txt">Nenhum veículo vinculado</p>`; return; }
      const qp = normPlaca(filtro), qn = filtro.trim().toLowerCase();
      const lista = veiculos.filter(v => !qn || (qp.length >= 2 && normPlaca(v.placa).includes(qp)) || (v.modelo || '').toLowerCase().includes(qn));
      if (!lista.length) { box.innerHTML = `<p class="vazio-txt">Nenhum veículo com isso.</p>`; return; }
      const linha = (v) => `<div class="veic${qp.length >= 7 && normPlaca(v.placa) === qp ? ' alvo' : ''}">
          <span class="placa mini"><b>${marcaPlaca(v.placa, qp.length >= 2 ? qp : '')}</b></span><span class="t">${escHtml(v.modelo || '—')}</span>
          <a class="btn-os" href="/funcionario/nova-ordem.html?placa=${encodeURIComponent(v.placa)}" title="Nova ordem para este carro">+ Ordem</a>
          <button class="btn-transf" onclick="openTransferModal('${v.id}', '${v.placa}', '${escHtml(v.modelo || '')}', '${c.id}', '${escHtml(c.nome || 'N/A')}')" title="Transferir"><i class="fas fa-right-left"></i></button></div>`;
      if (veiculos.length < FROTA_MIN || (qn && lista.length <= 12)) {
        box.innerHTML = `<div class="grupo solto"><div class="grupo-corpo">${lista.map(linha).join('')}</div></div>`;
        return;
      }
      const grupos = {};
      for (const v of lista) { const m = (v.modelo || '').trim() || 'Sem modelo'; (grupos[m] = grupos[m] || []).push(v); }
      box.innerHTML = Object.entries(grupos).sort((a, b) => b[1].length - a[1].length).map(([m, vs]) => {
        const lim = detLimite[m] || 15;
        return `<div class="grupo${detAbertos.has(m) || qn ? ' aberto' : ''}" data-m="${escHtml(m)}">
            <button type="button" onclick="alternarGrupoDet(this)"><b>${escHtml(m)}</b><span>${vs.length} carro${vs.length > 1 ? 's' : ''}</span><i class="fas fa-chevron-down seta"></i></button>
            <div class="grupo-corpo">${vs.slice(0, lim).map(linha).join('')}${vs.length > lim ? `<button type="button" class="mais-grupo" onclick="maisDoGrupo(this)">ver mais ${vs.length - lim}</button>` : ''}</div></div>`;
      }).join('');
    }
    function alternarGrupoDet(b) {
      const g = b.parentElement, m = g.dataset.m;
      g.classList.toggle('aberto');
      g.classList.contains('aberto') ? detAbertos.add(m) : detAbertos.delete(m);
    }
    function maisDoGrupo(b) {
      const m = b.closest('.grupo').dataset.m;
      detLimite[m] = (detLimite[m] || 15) + 30; detAbertos.add(m);
      desenharVeicsDet(document.getElementById('buscaFrota')?.value || '');
    }

    // ── TRANSFER MODAL ────────────────────────────
    function openTransferModal(veiculoId, placa, modelo, clienteAtualId, clienteAtualNome) {
      transferVeiculoData = { id: veiculoId, placa, modelo, clienteAtualId };
      transferClienteSel  = null;

      document.getElementById('transferInfo').innerHTML =
        `<strong>Veículo:</strong> <span>${placa}${modelo ? ' — ' + modelo : ''}</span><br>
         <strong>Proprietário atual:</strong> <span>${escHtml(clienteAtualNome)}</span>`;

      document.getElementById('transferSearch').value = '';
      document.getElementById('transferResults').innerHTML = '';
      document.getElementById('selectedClientBox').style.display = 'none';
      document.getElementById('btnConfirmTransfer').disabled = true;

      document.getElementById('transferModal').classList.add('open');
    }

    function closeTransferModal() {
      document.getElementById('transferModal').classList.remove('open');
      clearTimeout(transferTimer);
      transferVeiculoData = null;
      transferClienteSel  = null;
    }

    function onTransferSearch(input) {
      clearTimeout(transferTimer);
      const q = input.value.trim().toLowerCase();
      if (q.length < 2) {
        document.getElementById('transferResults').innerHTML = '';
        return;
      }
      transferTimer = setTimeout(() => {
        const resultados = allClientes.filter(c =>
          c.id !== transferVeiculoData?.clienteAtualId &&
          ((c.nome || '').toLowerCase().includes(q) || (c.telefone || '').includes(q))
        ).slice(0, 8);

        if (!resultados.length) {
          document.getElementById('transferResults').innerHTML =
            `<p style="font-size:12px;color:var(--light);text-align:center;padding:10px">Nenhum cliente encontrado</p>`;
          return;
        }

        document.getElementById('transferResults').innerHTML = `
          <div class="transfer-search-results">
            ${resultados.map(c => `
              <div class="transfer-result-item ${transferClienteSel?.id === c.id ? 'selected' : ''}"
                   onclick="selecionarClienteTransfer('${c.id}', '${escHtml(c.nome || 'N/A')}', '${escHtml(c.telefone || '')}')">
                <div>
                  <div class="transfer-result-name">${escHtml(c.nome || 'N/A')}</div>
                  ${c.telefone ? `<div class="transfer-result-phone">${escHtml(c.telefone)}</div>` : ''}
                </div>
                ${transferClienteSel?.id === c.id ? '<i class="fas fa-check" style="color:var(--blue-d)"></i>' : ''}
              </div>
            `).join('')}
          </div>`;
      }, 300);
    }

    function selecionarClienteTransfer(id, nome, telefone) {
      transferClienteSel = { id, nome, telefone };
      document.getElementById('btnConfirmTransfer').disabled = false;

      const box = document.getElementById('selectedClientBox');
      box.style.display = 'flex';
      box.innerHTML = `
        <div class="selected-client-box">
          <div>
            <div class="selected-client-name">${escHtml(nome)}</div>
            ${telefone ? `<div style="font-size:11px;color:var(--mid)">${escHtml(telefone)}</div>` : ''}
          </div>
          <button class="btn-deselect" onclick="desselecionarTransfer()"><i class="fas fa-times"></i></button>
        </div>`;

      // Atualizar resultados para mostrar selecionado
      onTransferSearch(document.getElementById('transferSearch'));
    }

    function desselecionarTransfer() {
      transferClienteSel = null;
      document.getElementById('btnConfirmTransfer').disabled = true;
      document.getElementById('selectedClientBox').style.display = 'none';
    }

    async function confirmarTransferencia() {
      if (!transferVeiculoData || !transferClienteSel) return;
      const btn = document.getElementById('btnConfirmTransfer');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Transferindo...';

      try {
        const result = await window.api.transferirVeiculo(transferVeiculoData.id, transferClienteSel.id);
        showToast(result.message || 'Veículo transferido com sucesso!', 'success');
        closeTransferModal();
        closeDrawer();
        await loadClientes();
      } catch (err) {
        showToast(err?.error || 'Erro ao transferir veículo', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> Confirmar';
      }
    }

    // ── DRAWER FORM (novo / editar) ───────────────
    async function openFormNew() {
      editingId = null;
      vehCount  = 0;
      openDrawer();
      document.getElementById('drawerTitle').textContent = 'Novo Cliente';
      renderForm(null);
    }

    async function openFormEdit(id) {
      editingId = id;
      vehCount  = 0;
      openDrawer();
      document.getElementById('drawerTitle').textContent = 'Editar Cliente';
      document.getElementById('drawerBody').innerHTML = `<div class="state-container"><div class="spin"></div></div>`;
      document.getElementById('drawerFooter').style.display = 'none';

      try {
        const r = await window.api.getClienteById(id);
        const c = r.data || r;
        renderForm(c);
      } catch {
        showToast('Erro ao carregar dados do cliente', 'error');
        closeDrawer();
      }
    }

    function renderForm(c) {
      const veiculos = c?.veiculos || [];

      document.getElementById('drawerBody').innerHTML = `
        <div class="form-section">
          <div class="form-section-title">Dados pessoais</div>
          <div class="form-group">
            <label class="form-label">Nome <span style="color:var(--light);font-weight:400">(opcional)</span></label>
            <input type="text" class="form-input" id="fNome" placeholder="Ex: João Silva" value="${escHtml(c?.nome && c.nome !== 'N/A' ? c.nome : '')}">
            <div class="form-hint">Deixe vazio para registrar como "N/A"</div>
          </div>
          <div class="form-group">
            <label class="form-label">Telefone / WhatsApp <span style="color:var(--light);font-weight:400">(opcional)</span></label>
            <input type="tel" class="form-input" id="fTelefone" placeholder="(00) 00000-0000" value="${escHtml(c?.telefone || '')}">
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">Veículos</div>
          <div id="fVeiculos">
            ${veiculos.length > 0
              ? veiculos.map(v => buildVehRow(v.placa, v.modelo, v.id)).join('')
              : buildVehRow()}

          </button>
        </div>

      document.getElementById('drawerFooter').style.display = 'flex';
      document.getElementById('drawerFooter').innerHTML = `
        <button class="btn-f btn-f-cancel" onclick="closeDrawer()">Cancelar</button>
        <button class="btn-f btn-f-save" id="saveBtn" onclick="saveForm()">
          <i class="fas fa-save"></i> ${editingId ? 'Salvar' : 'Criar'}
        </button>
      `;
    }

    function buildVehRow(placa = '', modelo = '', vehId = '') {
      vehCount++;
      const n = vehCount;
      return `
        <div class="vehicle-row" id="vr${n}" data-veh-id="${escHtml(vehId)}" data-modelo-host>
          <input type="text" class="form-input veh-placa" placeholder="Placa (ABC1234)" value="${escHtml(placa)}"
                 style="text-transform:uppercase;font-weight:700;letter-spacing:.5px">
          <input type="text" class="form-input veh-modelo" placeholder="Modelo (ex.: onix)" value="${escHtml(modelo)}" data-modelo-carro>
          <button type="button" class="btn-remove-veh" onclick="document.getElementById('vr${n}').remove()">
            <i class="fas fa-times"></i>
          </button>
        </div>
      `;

    function addVehRow() {
      document.getElementById('fVeiculos').insertAdjacentHTML('beforeend', buildVehRow());
    }

    // ── SALVAR ────────────────────────────────────
    async function saveForm() {
      const nome     = document.getElementById('fNome')?.value.trim() || '';
      const telefone = document.getElementById('fTelefone')?.value.trim() || null;
      const saveBtn  = document.getElementById('saveBtn');

      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';

      try {
        const data = { nome: nome || 'N/A', telefone };

        if (editingId) {
          await window.api.updateCliente(editingId, data);

          const rows = document.querySelectorAll('.vehicle-row');
          for (const row of rows) {
            const placa  = row.querySelector('.veh-placa')?.value.trim().toUpperCase();
            const modelo = row.querySelector('.veh-modelo')?.value.trim() || null;
            const vehId  = row.dataset.vehId;
            if (!placa) continue;
            if (vehId) {
              await window.api.updateVeiculo(vehId, { placa, modelo });
            } else {
              await window.api.createVeiculo({ clienteId: editingId, placa, modelo, cor: null });
            }
          }

          showToast('Cliente atualizado!', 'success');
        } else {
          const created = await window.api.createCliente(data);
          const clienteId = created.id;

          const rows = document.querySelectorAll('.vehicle-row');
          for (const row of rows) {
            const placa  = row.querySelector('.veh-placa')?.value.trim().toUpperCase();
            const modelo = row.querySelector('.veh-modelo')?.value.trim();
            if (placa) {
              await window.api.createVeiculo({ clienteId, placa, modelo: modelo || null, cor: null });
            }
          }
          showToast('Cliente criado!', 'success');
        }

        closeDrawer();
        await loadClientes();
      } catch (err) {
        showToast(err?.error || 'Erro ao salvar. Tente novamente.', 'error');
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i class="fas fa-save"></i> ${editingId ? 'Salvar' : 'Criar'}`;
      }
    }

    // ── EXCLUIR ───────────────────────────────────
    function confirmDelete(id, nome) {
      if (!confirm(`Excluir "${nome}"? Esta ação não pode ser desfeita.`)) return;
      deleteCliente(id);
    }

    async function deleteCliente(id) {
      try {
        await window.api.deleteCliente(id);
        showToast('Cliente excluído.', 'success');
        closeDrawer();
        await loadClientes();
      } catch {
        showToast('Erro ao excluir cliente.', 'error');
      }
    }

    // ── DRAWER HELPERS ────────────────────────────
    function openDrawer() {
      document.getElementById('drawerOverlay').classList.add('open');
      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
      editingId = null;
    }

    // ── UTILS ─────────────────────────────────────
    function cleanPhone(p) { return (p || '').replace(/\D/g, ''); }

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Gasto nos quadrinhos vai sem centavos, para caber no celular
    function gastoCurto(v) { return 'R$ ' + Math.round(v || 0).toLocaleString('pt-BR'); }

    function fmtCurrency(v) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
    }

    function showToast(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `toast ${type} show`;
      el.textContent = msg;
      document.getElementById('toastContainer').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // ── WA MODAL ─────────────────────────────────
    let waClienteId   = null;
    let waTemplates   = [];
    let waTabAtiva    = 'template';
    let waTemplateSel = null;
    let waStatus      = null;

    async function openWaModal(clienteId) {
      waClienteId   = clienteId;
      waTabAtiva    = 'template';
      waTemplateSel = null;
      waStatus      = null;
      waTemplates   = [];

      document.getElementById('waModal').classList.add('open');
      document.getElementById('waSendBtn').disabled = true;
      document.getElementById('waModalBody').innerHTML =
        `<div style="text-align:center;padding:30px"><div class="spin" style="margin:0 auto"></div></div>`;

      try {
        const [tRes, sRes] = await Promise.all([
          window.api.empresaWaGetTemplates(),
          window.api.empresaWaStatus(),
        ]);
        waTemplates = (tRes.templates || []).filter(t => t.ativo !== false);
        waStatus    = sRes.status;
        if (waTemplates.length > 0) waTemplateSel = waTemplates[0];
      } catch {
        waTemplates = [];
      }

      renderWaModal();
    }

    function closeWaModal() {
      document.getElementById('waModal').classList.remove('open');
      waClienteId = null;
    }

    function renderWaModal() {
      const c = allClientes.find(x => x.id === waClienteId);
      const body = document.getElementById('waModalBody');

      const statusBanner = waStatus === 'CONECTADO'
        ? `<div class="wa-status-banner conectado"><i class="fas fa-check-circle"></i> WhatsApp da empresa conectado</div>`
        : `<div class="wa-status-banner desconectado"><i class="fas fa-exclamation-triangle"></i> WhatsApp desconectado — configure em Configurações</div>`;

      body.innerHTML = `
        <div class="wa-cliente-info">
          <i class="fas fa-user" style="color:#25D366;font-size:18px"></i>
          <div>
            <div style="font-weight:700;font-size:14px;color:var(--text)">${escHtml(c?.nome || '—')}</div>
            <div style="font-size:12px;color:var(--mid)">${escHtml(c?.telefone || '')}</div>
          </div>
        </div>
        ${statusBanner}
        <div class="wa-tab-bar">
          <button class="wa-tab-btn ${waTabAtiva === 'template' ? 'ativo' : ''}" onclick="setWaTab('template')">
            <i class="fas fa-list" style="margin-right:4px"></i>Templates
          </button>
          <button class="wa-tab-btn ${waTabAtiva === 'livre' ? 'ativo' : ''}" onclick="setWaTab('livre')">
            <i class="fas fa-pen" style="margin-right:4px"></i>Mensagem livre
          </button>
        </div>
        ${waTabAtiva === 'template' ? renderWaTemplateTab(c) : renderWaLivreTab()}
      `;

      updateWaSendBtn();
    }

    function renderWaTemplateTab(c) {
      if (!waTemplates.length) {
        return `<p style="text-align:center;color:var(--light);font-size:13px;padding:16px 0">Nenhum template cadastrado. Configure em <strong>Configurações → WhatsApp</strong>.</p>`;
      }
      const nome  = (c?.nome && c.nome !== 'N/A' ? c.nome : 'cliente').split(' ')[0];
      const placa = c?.veiculos?.[0]?.placa || '';
      const dias  = diasDesdeUltimaVisita(c) ?? '';

      const lista = waTemplates.map(t => `
        <div class="wa-template-card ${waTemplateSel?.id === t.id ? 'selecionado' : ''}"
             onclick="selectWaTemplate('${t.id}')">
          <div class="tc-nome">${escHtml(t.nome)}</div>
          <div class="tc-texto">${escHtml(t.texto)}</div>
        </div>
      `).join('');

      const preview = waTemplateSel
        ? `<div>
             <div style="font-size:11px;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px">Preview</div>
             <div class="wa-preview-box">${escHtml(waResolverVars(waTemplateSel.texto, nome, placa, String(dias)))}</div>
           </div>`
        : '';

      return `<div class="wa-templates-list">${lista}</div>${preview}`;
    }

    function renderWaLivreTab() {
      return `<textarea class="wa-msg-textarea" id="waMsgLivre"
                placeholder="Digite a mensagem que será enviada ao cliente..."
                maxlength="1000"
                oninput="updateWaSendBtn()"></textarea>
              <div style="text-align:right;font-size:11px;color:var(--light);margin-top:4px" id="waCharCount">0/1000</div>`;
    }

    function setWaTab(tab) {
      waTabAtiva = tab;
      renderWaModal();
    }

    function selectWaTemplate(id) {
      waTemplateSel = waTemplates.find(t => t.id === id) || null;
      renderWaModal();
    }

    function waResolverVars(texto, nome, placa, dias) {
      return texto
        .replace(/\{\{nome\}\}/g,    nome)
        .replace(/\{\{placa\}\}/g,   placa)
        .replace(/\{\{dias\}\}/g,    dias)
        .replace(/\{\{valor\}\}/g,   '')
        .replace(/\{\{empresa\}\}/g, '');
    }

    function updateWaSendBtn() {
      const btn = document.getElementById('waSendBtn');
      if (!btn) return;
      if (waTabAtiva === 'template') {
        btn.disabled = !waTemplateSel;
      } else {
        const val = document.getElementById('waMsgLivre')?.value.trim() || '';
        const counter = document.getElementById('waCharCount');
        if (counter) counter.textContent = val.length + '/1000';
        btn.disabled = !val;
      }
    }

    async function sendWaMessage() {
      const btn = document.getElementById('waSendBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fab fa-whatsapp"></i> Enviando...';
      try {
        if (waTabAtiva === 'template') {
          if (!waTemplateSel) return;
          await window.api.empresaWaEnviarCliente(waClienteId, waTemplateSel.id, null);
        } else {
          const msg = document.getElementById('waMsgLivre')?.value.trim();
          if (!msg) return;
          await window.api.empresaWaEnviarCliente(waClienteId, null, msg);
        }
        showToast('Mensagem enviada com sucesso!', 'success');
        closeWaModal();
      } catch (err) {
        showToast(err?.error || 'Erro ao enviar mensagem', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fab fa-whatsapp"></i> Enviar';
      }
    }
  </script>
  <script src="/funcionario/decola-base.js"></script>
</body>
</html>
